<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>自选股看板 · Watchlist Board</title>
<style>
:root {
  --bg: #0f1117; --card: #1a1d27; --card2: #12141d; --border: #2a2d3e;
  --text: #e2e8f0; --muted: #7c8698; --dim: #4b5468;
  /* 美股惯例：绿涨红跌 */
  --up: #22c55e; --down: #f87171;
  --blue: #60a5fa; --sel: #1b2440;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--text); min-height: 100vh; font-size: 15px;
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; overflow-x: hidden; }
a { color: var(--blue); }
button { font-family: inherit; }

header { position: sticky; top: 0; z-index: 20; background: rgba(15,17,23,.94); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border); padding: 10px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
header h1 { font-size: 17px; font-weight: 700; }
.hbtn { background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 20px;
  padding: 5px 13px; font-size: 13px; text-decoration: none; cursor: pointer; }
.hbtn.first { margin-left: auto; }

.wrap { max-width: 1200px; margin: 0 auto; padding: 12px 16px 8px; }

/* 指数列 */
.indices { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.indices::-webkit-scrollbar { display: none; }
.idx { flex: 0 0 auto; min-width: 128px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 7px 11px; }
.idx .n { font-size: 12px; color: var(--muted); }
.idx .n b { color: var(--blue); font-family: var(--mono); font-weight: 600; margin-right: 4px; }
.idx .p { font-family: var(--mono); font-size: 16px; font-weight: 600; margin-top: 1px; }
.idx .c { font-family: var(--mono); font-size: 12.5px; }
.mktline { font-size: 12px; color: var(--muted); margin: 6px 0 2px; line-height: 1.6; }

/* 分页签与工具列 */
.tabs { display: flex; gap: 6px; margin: 10px 0 8px; flex-wrap: wrap; }
.tab { background: var(--card); color: var(--muted); border: 1px solid var(--border); border-radius: 8px;
  padding: 7px 16px; font-size: 14px; cursor: pointer; }
.tab[aria-pressed="true"] { background: var(--sel); color: var(--text); border-color: var(--blue); }
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
.tools input[type=search], .tools select { background: var(--card2); color: var(--text); border: 1px solid var(--border);
  border-radius: 8px; padding: 7px 10px; font-size: 14px; min-width: 0; }
.tools input[type=search] { width: 160px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { background: var(--card2); color: var(--muted); border: 1px solid var(--border); border-radius: 16px;
  padding: 3px 11px; font-size: 12.5px; cursor: pointer; }
.chip[aria-pressed="true"] { color: var(--text); border-color: var(--blue); background: var(--sel); }
.count { margin-left: auto; font-size: 12px; color: var(--muted); }

/* 表格：券商风格 */
.scroll { overflow: auto; max-height: calc(100vh - 290px); min-height: 280px;
  background: var(--card); border: 1px solid var(--border); border-radius: 12px; -webkit-overflow-scrolling: touch; }
.scroll.fit { min-height: 0; }
.cols { display: grid; grid-template-columns: 1fr; }
.cols.two { grid-template-columns: 1fr 1fr; }
.cols.two > table:first-child { border-right: 1px solid var(--border); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
thead th { position: sticky; top: 0; z-index: 2; background: var(--card); color: var(--muted); font-weight: 500;
  font-size: 12px; text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; cursor: pointer; user-select: none; }
thead th:first-child { text-align: left; }
thead th.on { color: var(--text); }
tbody td, tfoot td { padding: 8px 10px; text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums;
  border-bottom: 1px solid rgba(42,45,62,.6); white-space: nowrap; }
tbody td:first-child, tfoot td:first-child { text-align: left; font-family: inherit; }
tbody tr.row { cursor: pointer; }
tbody tr.row:hover, tbody tr.row:focus { background: var(--sel); outline: none; }
.sym { color: var(--blue); font-family: var(--mono); font-weight: 600; margin-right: 8px; }
.nm { color: var(--muted); font-size: 13px; }
.price { font-weight: 600; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); }
tfoot td { position: sticky; bottom: 0; background: #20243a; font-weight: 700; border-top: 1px solid var(--border); border-bottom: 0; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); font-size: 13.5px; }
.pnl-table td:first-child, .pnl-table th:first-child { position: sticky; left: 0; background: var(--card); z-index: 1; }
.pnl-table thead th:first-child { z-index: 3; }
.pnl-table tfoot td:first-child { background: #20243a; }

/* 损益摘要 */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
.tile { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; min-width: 0; }
.tile .l { font-size: 12px; color: var(--muted); }
.tile .v { font-family: var(--mono); font-size: 17px; font-weight: 700; margin-top: 1px; overflow-wrap: anywhere; }
.tile .s { font-family: var(--mono); font-size: 12px; }

/* 解锁框 */
.lockbox { background: var(--card); border: 1px solid var(--border); border-radius: 12px; text-align: center; padding: 28px 16px; }
.lockbox p { color: var(--muted); font-size: 13.5px; line-height: 1.7; margin: 6px auto 14px; max-width: 460px; }
.pw-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.pw-row input { background: var(--card2); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 9px 12px; font-size: 15px; width: 210px; max-width: 100%; }
.pw-row button { background: var(--sel); color: var(--text); border: 1px solid var(--blue); border-radius: 10px; padding: 9px 18px; font-size: 14px; cursor: pointer; }
.pw-err { color: var(--down); font-size: 13px; margin-top: 10px; display: none; }

/* 趋势图 */
.chart-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px 8px; }
.ch-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.ch-head .big { font-family: var(--mono); font-size: 22px; font-weight: 700; }
.ch-info { font-family: var(--mono); font-size: 12px; color: var(--muted); margin: 4px 0 6px; line-height: 1.6; min-height: 20px; }
.ranges { display: flex; gap: 6px; margin-left: auto; }
#chartBox { width: 100%; touch-action: pan-y; }
#chartBox svg { display: block; width: 100%; }
.k.up { stroke: var(--up); fill: var(--up); } .k.down { stroke: var(--down); fill: var(--down); }
.axis { fill: var(--muted); font-size: 10.5px; font-family: var(--mono); }
.grid { stroke: var(--border); stroke-width: 1; }
.ma20 { stroke: #fbbf24; fill: none; stroke-width: 1.2; } .ma50 { stroke: #a78bfa; fill: none; stroke-width: 1.2; }
.legend { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
.legend i { display: inline-block; width: 14px; height: 2px; vertical-align: middle; margin: 0 4px 0 10px; }

.qstatus { font-size: 12px; margin: 6px 0 0; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.qstatus .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); display: inline-block; }
.qstatus.live .dot { background: var(--up); } .qstatus.fail .dot { background: #fbbf24; }
.qstatus.fail { color: #fbbf24; }
.late { font-size: 10.5px; color: #fbbf24; border: 1px solid #5b4a1a; border-radius: 8px; padding: 0 5px; margin-left: 6px; font-family: inherit; }

footer { color: var(--muted); font-size: 12px; line-height: 1.8; text-align: center; padding: 18px 16px 36px; max-width: 900px; margin: 0 auto; }
footer b { color: var(--text); font-weight: 600; }
#err { color: var(--down); text-align: center; padding: 40px 16px; display: none; }

@media (max-width: 560px) {
  .wrap { padding: 10px 10px 6px; }
  header { padding: 9px 10px; }
  .tab { padding: 7px 13px; }
  .tools input[type=search] { width: 100%; flex: 1 1 100%; }
  .count { margin-left: 0; }
  table { font-size: 13.5px; }
  thead th, tbody td, tfoot td { padding: 8px 7px; }
  .nm { display: block; font-size: 11.5px; margin-top: 1px; max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
  .sym { margin-right: 0; }
  .tile .v { font-size: 14px; }
  .ranges { margin-left: 0; }
  .scroll { max-height: calc(100vh - 330px); }
}
</style>
</head>
<body>
<header>
  <h1 data-i="title">自选股看板</h1>
  <a class="hbtn first" href="./" data-i="toAnalyzer">📊 分析器</a>

<div class="wrap">

      <button class="tab" data-tab="pnl" aria-pressed="false" data-i="tabPnl">损益</button>
      <button class="tab" data-tab="chart" aria-pressed="false" data-i="tabChart">趋势图</button>
    </div>

    <section id="vWatch">
      <div class="tools">
        <input type="search" id="q" data-ph="search" placeholder="搜索代号或名称" aria-label="search" autocomplete="off">

      </div>
      <div class="scroll" id="watchScroll"><div class="cols" id="watchCols"></div></div>
    </section>

    <section id="vPnl" style="display:none"></section>

    <section id="vChart" style="display:none">
      <div class="tools">
        <select id="chartSel" aria-label="symbol"></select>
        <div class="ranges" id="ranges"></div>
      </div>
      <div class="chart-card">
        <div class="ch-head" id="chHead"></div>
        <div class="ch-info" id="chInfo"></div>
        <div id="chartBox"></div>
        <div class="legend" id="chLegend"></div>
      </div>
    </section>
  </div>
</div>

<footer id="foot"></footer>

let LANG = "cn";
const t = (k, v) => {
  let s = (I[LANG][k] != null ? I[LANG][k] : k);
  if (v) for (const x in v) s = s.replace("{" + x + "}", v[x]);
  return s;
};

/* ---------- 状态 ---------- */
let PUB = null, PRIV = null;
let TAB = "watch";
let SORT_W = { key: "pct", dir: -1 };      // 默认：涨跌% 由高到低
let SORT_P = { key: "value", dir: -1 };    // 默认：市值由大到小
let FILTER = "all", QUERY = "";
let CHART_SYM = null, CHART_RANGE = 120;
const HIST = {};
/* 近即时报价（CNBC）：LIVE[sym] = {price, prev}；QSTATE: wait | live | fail */
let LIVE = {}, QSTATE = "wait", QMETA = null, QFETCHED = null;                            // sym -> bars | "fail"
let HOVER = null;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ---------- 数字格式 ---------- */
const nf = (v, d) => v.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const fmt = (v, d = 2) => v == null || !isFinite(v) ? "—" : nf(v, d);
const fmtS = (v, d = 2) => {       // 带正负号
  if (v == null || !isFinite(v)) return "—";
  const r = Math.round(v * Math.pow(10, d));
  return (r > 0 ? "+" : r < 0 ? "-" : "") + nf(Math.abs(v), d);
};
const fmtP = (v, d = 2) => v == null || !isFinite(v) ? "—" : fmtS(v, d) + "%";
const dirOf = (v, d = 2) => {      // 以「显示出来的四舍五入值」判方向，避免 +0.00% 却标绿
  if (v == null || !isFinite(v)) return 0;
  const r = Math.round(v * Math.pow(10, d));
  return r > 0 ? 1 : r < 0 ? -1 : 0;
};
const cls = (v, d = 2) => ["down", "flat", "up"][dirOf(v, d) + 1];
const arrow = (v, d = 2) => ["▼", "–", "▲"][dirOf(v, d) + 1];

/* ---------- 解密（与 index.html 的 decryptEnvelope 同一格式） ---------- */
async function decryptEnvelope(envText, password) {
  const env = JSON.parse(envText);
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const keyMat = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(env.salt), iterations: env.iter, hash: "SHA-256" },
    keyMat, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(env.nonce) }, key, b64(env.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

let PW_ERR = "";
async function unlockWith(password, silent) {
  let envText;
  try {
    const r = await fetch("data-private.enc", { cache: "no-store" });
    if (!r.ok) throw new Error("noPriv");
    envText = await r.text();
  } catch (e) {
    if (!silent) PW_ERR = t("noPriv");
    return false;
  }
  try {
    PRIV = await decryptEnvelope(envText, password);
  } catch (e) {
    PRIV = null;
    if (!silent) PW_ERR = t("pwBad");
    return false;
  }
  try { localStorage.setItem(PW_KEY, password); } catch (e) {}
  PW_ERR = "";
  return true;
}
async function tryUnlock() {
  const pw = ($("pwInput").value || "").trim();
  if (!pw) return;
  await unlockWith(pw, false);
  renderAll();
}
function doLock() {
  try { localStorage.removeItem(PW_KEY); } catch (e) {}
  PRIV = null; PW_ERR = "";
  if (FILTER === "held") FILTER = "all";
  renderAll();
}

/* ---------- 数据 ---------- */
function tickers() { return (PUB && PUB.tickers) || []; }
function row(tk) {
  const L = LIVE[tk.symbol];
  const price = L ? L.price : tk.price, prev = L ? L.prev : tk.prev_close;
  const ok = typeof price === "number" && typeof prev === "number" && prev > 0;
  const chg = ok ? price - prev : null;
  const pct = ok ? (price / prev - 1) * 100 : (typeof tk.chg1d === "number" ? tk.chg1d : null);
  return { tk, sym: tk.symbol, price: typeof price === "number" ? price : null, chg, pct, late: QSTATE === "live" && !L };
}
const heldSet = () => new Set(PRIV ? (PRIV.positions || []).map(p => p.symbol) : []);

function filteredRows() {
  const held = heldSet(), q = QUERY.trim().toLowerCase();
  const buy = new Set(PUB.opportunities || []), weak = new Set(PUB.weak || []);
  let rows = tickers().map(row);
  rows = rows.filter(r => {
    if (FILTER === "stock" && r.tk.etf) return false;
    if (FILTER === "etf" && !r.tk.etf) return false;
    if (FILTER === "buy" && !buy.has(r.sym)) return false;
    if (FILTER === "weak" && !weak.has(r.sym)) return false;
    if (FILTER === "held" && !held.has(r.sym)) return false;
    if (q) {
      const hay = (r.sym + " " + r.tk.name + " " + (EN_NAMES[r.sym] || "")).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  const { key, dir } = SORT_W;
  rows.sort((a, b) => {
    if (key === "sym") return dir * a.sym.localeCompare(b.sym);
    const av = a[key], bv = b[key];
    if (av == null && bv == null) return 0;
    if (av == null) return 1;      // 缺值永远排最后
    if (bv == null) return -1;
    return dir * (av - bv) || a.sym.localeCompare(b.sym);
  });
  return rows;
}

/* 持仓：只用 qty / avg_price / price / daily_pnl 四个原始字段现算，不信任别处四舍五入过的小计 */
function positionRows() {
  const byTk = {};
  tickers().forEach(tk => { byTk[tk.symbol] = tk; });
  const rows = (PRIV.positions || []).map(p => {
    const tk = byTk[p.symbol];
    const L = LIVE[p.symbol];                 // 有近即时价就用它重算；没有的沿用每小时 IBKR 价与今日损益
    const price = L ? L.price : p.price;
    const value = p.qty * price;
    const cost = p.qty * p.avg_price;
    const todayPnl = L ? p.qty * (L.price - L.prev) : (p.daily_pnl || 0);
    const prevValue = value - todayPnl;
    return {
      sym: p.symbol, name: tk ? nameOf(tk) : "", qty: p.qty, avg: p.avg_price, price,
      value, cost, todayPnl, todayPct: prevValue > 0 ? todayPnl / prevValue * 100 : null,
      pnl: value - cost, pnlPct: cost > 0 ? (value - cost) / cost * 100 : null
    };
  });
  const { key, dir } = SORT_P;
  rows.sort((a, b) => {
    if (key === "sym") return dir * a.sym.localeCompare(b.sym);
    const av = a[key], bv = b[key];
    if (av == null && bv == null) return 0;
    if (av == null) return 1;
    if (bv == null) return -1;
    return dir * (av - bv) || a.sym.localeCompare(b.sym);
  });
  return rows;
}
function totals(rows) {
  const s = k => rows.reduce((x, r) => x + r[k], 0);
  const value = s("value"), cost = s("cost"), today = s("todayPnl"), prevValue = value - today;
  return {
    value, cost, today, pnl: value - cost,
    todayPct: prevValue > 0 ? today / prevValue * 100 : null,
    pnlPct: cost > 0 ? (value - cost) / cost * 100 : null
  };
}

async function loadHist(sym) {
  if (HIST[sym]) return HIST[sym];
  try {
    const r = await fetch("history/" + encodeURIComponent(sym) + ".json", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    HIST[sym] = (j.bars || []).filter(b => b.length >= 6 && b.slice(1, 5).every(x => typeof x === "number"));
  } catch (e) { HIST[sym] = "fail"; }
  return HIST[sym];
}
function sma(closes, n) {
  const out = []; let s = 0;
  for (let i = 0; i < closes.length; i++) {
    s += closes[i]; if (i >= n) s -= closes[i - n];
    out.push(i >= n - 1 ? s / n : null);
  }
  return out;
}

async function drawChart() {
  const sym = CHART_SYM, box = $("chartBox");
  if (!sym) return;
  box.innerHTML = `<div class="empty">${esc(t("loading"))}</div>`;
  const bars = await loadHist(sym);
  if (sym !== CHART_SYM || TAB !== "chart") return;     // 等待期间用户已切走
  if (bars === "fail" || !bars.length) { box.innerHTML = `<div class="empty">${esc(t("chartFail"))}</div>`; $("chHead").textContent = ""; $("chInfo").textContent = ""; return; }
  const closes = bars.map(b => b[4]), m20 = sma(closes, 20), m50 = sma(closes, 50);
  const n = Math.min(CHART_RANGE, bars.length), off = bars.length - n;
  const win = bars.slice(off);
  const W = Math.max(280, box.clientWidth || 360), narrow = W < 520;
  const H1 = narrow ? 230 : 330, H2 = narrow ? 50 : 64, GAP = 8, L = 4, R = 52, T = 8, B = 20;
  const pw = W - L - R, slot = pw / n, bw = Math.max(1, Math.min(slot * 0.7, 14));
  let lo = Infinity, hi = -Infinity, vmax = 0;
  win.forEach(b => { lo = Math.min(lo, b[3]); hi = Math.max(hi, b[2]); vmax = Math.max(vmax, b[5] || 0); });
  const pad = (hi - lo) * 0.06 || 1; lo -= pad; hi += pad;
  const y = v => T + (hi - v) / (hi - lo) * H1;
  const x = i => L + slot * (i + 0.5);
  const volTop = T + H1 + GAP, totalH = T + H1 + GAP + H2 + B;
  let g = "";
  for (let k = 0; k <= 4; k++) {
    const v = lo + (hi - lo) * k / 4, yy = y(v);
    g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}"/><text class="axis" x="${W - R + 5}" y="${(yy + 3.5).toFixed(1)}">${fmt(v)}</text>`;
  }
  let candles = "", vols = "";
  win.forEach((b, i) => {
    const up = b[4] >= b[1], c = up ? "up" : "down", xx = x(i);
    const top = y(Math.max(b[1], b[4])), bot = y(Math.min(b[1], b[4]));
    candles += `<g class="k ${c}" data-i="${i}"><line x1="${xx.toFixed(1)}" x2="${xx.toFixed(1)}" y1="${y(b[2]).toFixed(1)}" y2="${y(b[3]).toFixed(1)}" stroke-width="1"/>` +
      `<rect x="${(xx - bw / 2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1, bot - top).toFixed(1)}"/></g>`;
    if (vmax > 0) {
      const vh = (b[5] || 0) / vmax * H2;
      vols += `<rect class="k ${c}" opacity=".55" x="${(xx - bw / 2).toFixed(1)}" y="${(volTop + H2 - vh).toFixed(1)}" width="${bw.toFixed(1)}" height="${vh.toFixed(1)}"/>`;
    }
  });
  const line = (arr, c) => {
    let d = "", pen = false;
    for (let i = 0; i < n; i++) { const v = arr[off + i]; if (v == null) { pen = false; continue; } d += (pen ? "L" : "M") + x(i).toFixed(1) + "," + y(v).toFixed(1); pen = true; }
    return d ? `<path class="${c}" d="${d}"/>` : "";
  };
  let xl = "";
  [0, 1, 2, 3].forEach(k => {
    const i = Math.round((n - 1) * k / 3);
    xl += `<text class="axis" text-anchor="${k === 0 ? "start" : k === 3 ? "end" : "middle"}" x="${(k === 0 ? L : k === 3 ? W - R : x(i)).toFixed(1)}" y="${totalH - 5}">${narrow ? win[i][0].slice(2) : win[i][0]}</text>`;
  });
  box.innerHTML = `<svg id="chartSvg" viewBox="0 0 ${W} ${totalH}" width="${W}" height="${totalH}" role="img" aria-label="${esc(sym)} candles">
    <defs><clipPath id="clip"><rect x="${L}" y="${T}" width="${pw}" height="${H1}"/></clipPath></defs>
    ${g}<g clip-path="url(#clip)">${candles}${line(m20, "ma20")}${line(m50, "ma50")}</g>${vols}${xl}
    <line id="cross" class="grid" y1="${T}" y2="${T + H1}" x1="0" x2="0" style="display:none"/></svg>`;
  CHART_CTX = { win, bars, off, slot, L, W, R };
  const svg = $("chartSvg");
  const move = ev => {
    const rect = svg.getBoundingClientRect(), px = (ev.clientX - rect.left) * (W / rect.width);
    const i = Math.max(0, Math.min(n - 1, Math.floor((px - L) / slot)));
    showInfo(i, true);
  };
  svg.addEventListener("pointermove", move);
  svg.addEventListener("pointerdown", move);
  svg.addEventListener("pointerleave", () => showInfo(n - 1, false));
  showInfo(n - 1, false);
}
let CHART_CTX = null;
function showInfo(i, cross) {
  if (!CHART_CTX) return;
  const { win, bars, off, slot, L } = CHART_CTX, b = win[i], prev = bars[off + i - 1];
  const tk = tickers().find(x => x.symbol === CHART_SYM);
  const chg = prev ? b[4] - prev[4] : null, pct = prev ? (b[4] / prev[4] - 1) * 100 : null;
  $("chHead").innerHTML = `<span class="sym" style="font-size:18px">${esc(CHART_SYM)}</span><span class="nm">${esc(tk ? nameOf(tk) : "")}</span>` +
    `<span class="big ${cls(chg)}" id="chClose">${fmt(b[4])}</span><span class="${cls(chg)}" id="chChg">${arrow(chg)} ${fmtS(chg)} (${fmtP(pct)})</span>`;
  $("chInfo").textContent = `${b[0]}  ${t("o")} ${fmt(b[1])}  ${t("h")} ${fmt(b[2])}  ${t("l")} ${fmt(b[3])}  ${t("c")} ${fmt(b[4])}  ${t("vol")} ${nf(b[5] || 0, 0)}  · ${t("bars", { n: win.length })}`;
  const c = $("cross");
  if (c) { if (cross) { const xx = L + slot * (i + 0.5); c.setAttribute("x1", xx); c.setAttribute("x2", xx); c.style.display = ""; } else c.style.display = "none"; }
}

/* ---------- 页脚：如实标注数据来源与时间 ---------- */
function renderFoot() {
  const gen = (PUB && PUB.generated_at) || "—";
  let ago = "";
  const ts = Date.parse(String(gen).replace(" UTC", "Z").replace(" ", "T"));
  if (isFinite(ts)) {
    const h = Math.max(0, Math.floor((Date.now() - ts) / 3600000));
    ago = h < 1 ? t("justNow") : h < 48 ? t("ago", { n: h }) : t("agoD", { n: Math.floor(h / 24) });
  }
  if (QSTATE === "live" && QFETCHED) {
    const when = QFETCHED.toLocaleString(LANG === "en" ? "en-US" : "zh-CN", { hour12: false });
    $("foot").innerHTML = `<p>${t("fl1", { s: Math.round(CFG.pollMs / 1000) })}</p><p>${t("fl2", { t: esc(when), d: delayText() })}</p>` +
      `<p>${t("fl3", { gen: esc(gen), ago })}</p><p>${t("foot3")}</p>`;
    return;
  }
  const failP = QSTATE === "fail" ? `<p>${t("ffail")}</p>` : "";
  $("foot").innerHTML = `${failP}<p>${t("foot1")}</p><p>${t("foot2", { t: esc(gen), ago })}</p><p>${t("foot3")}</p>`;
}

/* ---------- 近即时报价：浏览器直连 CNBC，请求里只带代号，不带任何持仓信息 ---------- */
const CFG = Object.assign({
  url: "https://quote.cnbc.com/quote-html-webservice/restQuote/symbolType/symbol",
  pollMs: 45000,       // 常规交易时段轮询间隔
  offPollMs: 300000,   // 非常规时段（休市/盘前盘后）
  retryMs: 120000,     // 失败后重试间隔
  staleMs: 150000,     // 失败后最多沿用上一次好报价这么久，再退回每小时价（避免偶发一次失败就闪烁）
  timeoutMs: 10000
}, window.BOARD_CFG || {});
const numOf = v => { const x = parseFloat(String(v == null ? "" : v).replace(/,/g, "")); return isFinite(x) ? x : null; };
const timeOf = s => Date.parse(String(s || "").replace(/([+-]\d\d)(\d\d)$/, "$1:$2"));   // 2026-10-07T09:52:11.126-0400
function parseQuotes(json) {
  const list = json && json.FormattedQuoteResult && json.FormattedQuoteResult.FormattedQuote;
  if (!Array.isArray(list)) throw new Error("format");
  const out = {}, ages = [], now = Date.now(); let status = null;
  list.forEach(q => {
    if (!q || q.code !== 0) return;
    const price = numOf(q.last), chg = /^UNCH/i.test(String(q.change || "")) ? 0 : numOf(q.change);
    // 前收 = 现价 - 涨跌（CNBC 收盘后 previous_day_closing 会变成当天收盘价，不能直接用）
    const prev = chg != null ? price - chg : numOf(q.previous_day_closing);
    if (!(price > 0) || !(prev > 0)) return;
    out[q.symbol] = { price, prev };
    if (q.symbol === "SPY" || !status) status = q.curmktstatus || status;
    if (q.curmktstatus === "REG_MKT") { const ts = timeOf(q.last_time); if (isFinite(ts)) ages.push(Math.max(0, now - ts)); }
  });
  ages.sort((a, b) => a - b);
  const delayMin = ages.length ? ages[Math.floor(ages.length / 2)] / 60000 : null;   // 中位数，个别冷门档久不成交不拖累
  return { quotes: out, status, delayMin };
}
function delayText() {
  if (QMETA && QMETA.status && QMETA.status !== "REG_MKT") return t("qClosed");
  const d = QMETA ? QMETA.delayMin : null;
  return d == null ? t("qDelayUnk") : d < 1 ? t("qDelay0") : t("qDelay", { n: Math.round(d) });
}
function renderStatus() {
  const el = $("qstatus");
  if (QSTATE === "live") { el.className = "qstatus live"; el.innerHTML = `<span class="dot"></span><span>${esc(t("qLive"))} · ${esc(delayText())}</span>`; }
  else if (QSTATE === "fail") { el.className = "qstatus fail"; el.innerHTML = `<span class="dot"></span><span>${esc(t("qFail"))}</span>`; }
  else { el.className = "qstatus"; el.innerHTML = `<span class="dot"></span><span>${esc(t("qWait"))}</span>`; }
}
let pollTimer = null, inflight = false;
function schedule(ms) {
  clearTimeout(pollTimer); pollTimer = null;
  if (document.hidden) return;                                   // 页面不可见：暂停，回来时 visibilitychange 立即补抓
  pollTimer = setTimeout(pollQuotes, ms);
}
function repaintLive(changed) {
  renderStatus(); renderFoot();
  if (!changed) return;
  renderIndices(); renderWatch();
  if (PRIV) renderPnl();                                          // 未解锁时不重绘，免得清掉正在输入的密码
}
async function pollQuotes() {
  if (document.hidden || inflight || !PUB) return;
  inflight = true;
  let next = CFG.retryMs;
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), CFG.timeoutMs);
  try {
    const symbols = tickers().map(tk => tk.symbol).join("|");    // 只带代号（整个 58 档名单，不是持仓）
    const url = CFG.url + "?symbols=" + encodeURIComponent(symbols) + "&requestMethod=itv&noform=1&partnerId=2&fund=1&exthrs=1&output=json&events=1";
    const r = await fetch(url, { cache: "no-store", credentials: "omit", referrerPolicy: "no-referrer", signal: ctl.signal });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const P = parseQuotes(await r.json());
    if (!Object.keys(P.quotes).length) throw new Error("empty");
    const changed = JSON.stringify(P.quotes) !== JSON.stringify(LIVE) || QSTATE !== "live";
    LIVE = P.quotes; QMETA = P; QFETCHED = new Date(); QSTATE = "live";
    repaintLive(changed);
    next = P.status === "REG_MKT" ? CFG.pollMs : CFG.offPollMs;
  } catch (e) {
    const stale = !QFETCHED || Date.now() - QFETCHED.getTime() > CFG.staleMs;
    if (stale && QSTATE !== "fail") { LIVE = {}; QMETA = null; QSTATE = "fail"; repaintLive(true); }
    else if (QSTATE === "wait") { QSTATE = "fail"; repaintLive(false); }
  } finally {
    clearTimeout(to); inflight = false; schedule(next);
  }
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { clearTimeout(pollTimer); pollTimer = null; } else if (PUB) pollQuotes();
});

/* ---------- 事件 ---------- */
document.addEventListener("click", ev => {
  const el = ev.target.closest("button, th[data-sort], tr.row");
  if (!el) return;
  if (el.classList.contains("tab")) { TAB = el.dataset.tab; renderTabs(); if (TAB === "chart") drawChart(); return; }
  if (el.dataset.f) { FILTER = el.dataset.f; renderChips(); renderWatch(); return; }
  if (el.dataset.r) { CHART_RANGE = +el.dataset.r; renderChartShell(); drawChart(); return; }
  if (el.id === "pwBtn") { tryUnlock(); return; }
  if (el.id === "lockBtn") { doLock(); return; }
  if (el.matches("th[data-sort]")) {
    const inPnl = !!el.closest("#pnlTable"), S = inPnl ? SORT_P : SORT_W, k = el.dataset.sort;
    if (S.key === k) S.dir = -S.dir; else { S.key = k; S.dir = k === "sym" ? 1 : -1; }
    inPnl ? renderPnl() : renderWatch();
    return;
  }
  if (el.matches("tr.row")) { CHART_SYM = el.dataset.sym; TAB = "chart"; renderTabs(); renderChartShell(); drawChart(); window.scrollTo({ top: 0 }); }
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Enter" && ev.target.id === "pwInput") tryUnlock();
  else if (ev.key === "Enter" && ev.target.matches && ev.target.matches("tr.row")) ev.target.click();
});
$("q").addEventListener("input", e => { QUERY = e.target.value; renderWatch(); });
$("chartSel").addEventListener("change", e => { CHART_SYM = e.target.value; drawChart(); });
window.matchMedia("(min-width: 980px)").addEventListener("change", () => { if (PUB) renderWatch(); });
let rzT = null;
window.addEventListener("resize", () => { clearTimeout(rzT); rzT = setTimeout(() => { if (PUB && TAB === "chart") drawChart(); }, 150); });

/* ---------- 启动 ---------- */
(async function boot() {
  try {
    const r = await fetch("data-public.json", { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    PUB = await r.json();
    if (!PUB.tickers || !PUB.tickers.length) throw new Error("tickers");
  } catch (e) {
    $("err").style.display = "block"; $("err").textContent = t("loadFail") + e.message;
    return;
  }
  $("main").style.display = "";
  let saved = null;
  try { saved = localStorage.getItem(PW_KEY); } catch (e) {}
  if (saved) {                                  // 只有存过密码才去抓加密档：没密码时不发这个请求
    const ok = await unlockWith(saved, true);
    if (!ok) { try { localStorage.removeItem(PW_KEY); } catch (e) {} }
  }
  renderAll();
  pollQuotes();
})();
</script>
