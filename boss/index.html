/** 条目表单「更多」里的「航班日期」小块：航班号已经挪到紧凑行去了，这里只剩日期 +
 * 查询按钮；已关联航班时多显示一行「已关联航班...清除航班」。用 outerHTML 整块替换
 * 刷新（跟其它条目字段用 oninput/onchange 直接改 value 不同），因为查到/清除后要
 * 连带切换这一小块本身的展示形态。
 * ⚠️ 航班号输入框（id ...-flightno）不在这个块里——它在紧凑行，这个函数替换
 * outerHTML 时碰不到它，所以查询失败/成功/清除时要另外用 classList 去改它的错误态
 * （见 adminFlightLookup / adminFlightLookupFailed / adminClearFlight 里的 noEl）。 */
function flightLookupBlockHtml(trip, tripIdx, itemIdx){
  const it = trip.items[itemIdx];
  const f = it.flight || null;
  // f.unresolved 标记「查过但没查到」——查询失败也会把 no/date 存进 it.flight（见
  // adminFlightLookup 的失败分支），不然「填过航班号但查询失败」这件事在重新渲染
  // （切换条目、保存后刷新）之后就彻底没有痕迹，用户根本不知道自己填过、也不知道
  // 要自己手动填时间。这就是这次要修的事故本身：失败是无声的（2026-08-28）。
  const failed = !!(f && f.unresolved);
  // 航班日期**只跟条目日期走**，不再有独立的日期框（2026-08-28 事故：他把回程条目
  // 的日期改成 27 号，但航班日期框还停在 23 号——两个日期各走各的，查回来的是 23 号
  // 那班的时间，于是「去程 23 号 22:00 落地、回程 23 号 12:25 起飞」，算出负数等待，
  // 页面报「转机时间异常」。唯一的日期只有一个，就不可能对不上）。
  const dateVal = it.date || '';
  // 旧数据可能留着跟条目日期对不上的 f.date，这种要显眼提示他点一次查询更新。
  const staleDate = !!(f && !failed && f.date && dateVal && f.date !== dateVal);
  const persistentHint = failed
    ? pick('这条航班还没查到资料，时间要自己填', 'This flight has not been resolved yet — please fill in the time yourself')
    : '';
  return `<div class="flight-lookup-block${failed ? ' flight-lookup-block-err' : ''}" id="admin-item-${tripIdx}-${itemIdx}-flightblock">
      <div class="flight-lookup-hd">✈️ ${pick('航班','Flight')}</div>
      ${ f && !failed ? `<div class="flight-lookup-current">
          <span>${pick('已关联航班','Linked flight')} <b>${escapeHtml(f.no||'')}</b>（${escapeHtml(f.date||'')}）</span>
          <button type="button" class="admin-btn-sm" onclick="adminClearFlight(${tripIdx},${itemIdx})">${pick('清除航班','Clear flight')}</button>
        </div>` : '' }
      ${ failed ? `<div class="flight-lookup-current flight-lookup-current-err">
          <span>⚠️ ${pick('没查到，时间要自己填','Not found — please fill in the time yourself')}</span>
          <button type="button" class="admin-btn-sm" onclick="adminClearFlight(${tripIdx},${itemIdx})">${pick('清除航班','Clear flight')}</button>
        </div>` : '' }
      <div class="flight-lookup-date">${
        dateVal ? `${pick('用上面填的日期','Uses the date above')}：<b>${escapeHtml(dateVal)}</b>`
                : `⚠️ ${pick('上面的「日期」还没填，填了才能查','Fill in the Date field above first')}` }</div>
      ${ staleDate ? `<div class="flight-lookup-current flight-lookup-current-err">
          <span>⚠️ ${pick('这条航班是按 ' + escapeHtml(f.date) + ' 查的，跟上面的日期对不上','Looked up for ' + escapeHtml(f.date) + ', which differs from the date above')}</span>
        </div>` : '' }
      <button type="button" class="admin-btn-sm" id="admin-item-${tripIdx}-${itemIdx}-flightbtn" onclick="adminFlightLookup(${tripIdx},${itemIdx})">🔍 ${pick('查询','Look up')}</button>
      <div id="admin-item-${tripIdx}-${itemIdx}-flightstatus" class="flight-lookup-status${failed ? ' err' : ''}">${persistentHint}</div>
    </div>`;
}
/** 航班号／日期两个输入框失焦或改动时自动触发——**用户要的是填完就自动查，
 * 不是填完还要再点一次「查询」按钮**（2026-08-28 教训：上一版只绑了按钮的
 * onclick，输入框本身没绑任何事件，用户填完号码直接保存，查询压根没跑过，
 * 两条航班全程没时间、没 ✈️ 标记，也没有任何报错——因为根本没查过）。
 * 「查询」按钮继续保留，当作日期改了想手动重查一次的备用入口。 */
function adminFlightAutoTrigger(tripIdx, itemIdx){
  const trip = adminTripsDraft && adminTripsDraft[tripIdx];
  const it = trip && trip.items && trip.items[itemIdx];
  if(!it) return;
  const noInput = document.getElementById(`admin-item-${tripIdx}-${itemIdx}-flightno`);
  const no = ((noInput && noInput.value) || '').trim().toUpperCase();
  const date = (it.date || '').trim(); // 日期只有一个来源：条目自己的日期
  if(!no || !date) return; // 两个都有才查，缺一个先不动，等填完/交给「查询」按钮手动点
  const comboKey = no + '|' + date;
  const key = `${tripIdx}:${itemIdx}`;
  const state = flightLookupState[key] || (flightLookupState[key] = {});
  if(state.inFlight) return; // 防重入：正在查就别再触发一次
  // it.flight 里已经存的组合（不管当年查到还是没查到）跟当前一样，就当作「查过了」，
  // 不用真的再打一次请求——覆盖「页面刚打开」「收起再展开」这类没经过下面成功/失败
  // 分支、但值其实没变的场景。
  if(!state.lastComboKey && it.flight){
    const savedComboKey = String(it.flight.no || '').toUpperCase() + '|' + (it.flight.date || '');
    if(savedComboKey === comboKey) state.lastComboKey = comboKey;
  }
  if(state.lastComboKey === comboKey) return; // 同一组合查过了，别再花额度重查
  adminFlightLookup(tripIdx, itemIdx);
}
/** 直接写某个已渲染 input 的 value（跟 adminItemMapInput() 自动填地图链接同一手法），
 * 不整段重渲染表单——避免打断正在编辑其它条目的人、也不丢焦点/滚动位置。 */
function setInputVal(id, val){
  const el = document.getElementById(id);
  if(el) el.value = val == null ? '' : val;
}
/** 航班号+日期 → 查一次（会花 AeroDataBox 额度，所以要记住查过的组合、别重复打），
 * 查到后自动填这个条目的标题/时间/备注，并把 {no,date,trackId} 存进 it.flight——
 * 填完仍可手改，不锁死（不覆盖用户后续手动改动，只在本次查询成功那一刻写入）。
 * 查不到也不会什么都不留：把 {no,date,unresolved:true} 存进 it.flight，让
 * flightLookupBlockHtml() 能在任何一次重渲染里都继续显眼提示「没查到」
 * （见该函数顶部注释，2026-08-28 事故教训）。
 * 由 adminFlightAutoTrigger()（失焦/改动自动触发）或「查询」按钮（手动重试）调用，
 * 两条路都走这一个函数，保证行为一致。 */
async function adminFlightLookup(tripIdx, itemIdx){
  const trip = adminTripsDraft && adminTripsDraft[tripIdx];
  const it = trip && trip.items && trip.items[itemIdx];
  if(!it) return;
  const noInput = document.getElementById(`admin-item-${tripIdx}-${itemIdx}-flightno`);
  const statusEl = document.getElementById(`admin-item-${tripIdx}-${itemIdx}-flightstatus`);
  const btn = document.getElementById(`admin-item-${tripIdx}-${itemIdx}-flightbtn`);
  const no = ((noInput && noInput.value) || '').trim().toUpperCase();
  const date = (it.date || '').trim(); // 同上：只认条目日期
  if(!no || !date){
    if(statusEl){ statusEl.className = 'flight-lookup-status err'; statusEl.textContent = pick('请先填航班号和日期','Please fill in the flight number and date'); }
    return;
  }
  const key = `${tripIdx}:${itemIdx}`;
  const state = flightLookupState[key] || (flightLookupState[key] = {});
  if(state.inFlight) return; // 防重入：查询进行中，按钮点两下/失焦+点按钮撞一起都不重复打请求
  const comboKey = no + '|' + date;
  state.inFlight = true;
  if(btn) btn.disabled = true;
  if(statusEl){ statusEl.className = 'flight-lookup-status'; statusEl.textContent = pick('查询中…','Looking up…'); }
  let res;
  try{
    res = await bossCall('flightLookup', { no, date });
  }catch(err){
    state.inFlight = false;
    state.lastComboKey = comboKey; // 失败也算查过这组合，不重复打请求；号或日期改了才会再查
    if(btn) btn.disabled = false;
    adminFlightLookupFailed(tripIdx, itemIdx, it, trip, no, date,
      (err && err.message) || pick('查不到这个航班号，确认一下日期对不对','Could not find this flight — please check the number and date'));
    return;
  }
  state.inFlight = false;
  if(btn) btn.disabled = false;
  const f = res && res.flight;
  if(!f){
    state.lastComboKey = comboKey;
    adminFlightLookupFailed(tripIdx, itemIdx, it, trip, no, date,
      pick('查不到这个航班号，确认一下日期对不对','Could not find this flight — please check the number and date'));
    return;
  }
  state.lastComboKey = comboKey;
  const title = flightTitleFromLookup(f);
  const note = flightNoteFromLookup(f);
  const time = extractHM(f.sched_dep) || it.time || '';
  it.title = title;
  it.note = note;
  it.time = time;
  it.flight = { no: f.no || no, date: date, trackId: f.trackId || '' };
  markTripsDirty();

  setInputVal(`admin-item-${tripIdx}-${itemIdx}-time`, time);
  setInputVal(`admin-item-${tripIdx}-${itemIdx}-title-zh`, title.zh);
  // 注：title.en / note.en 不再有对应输入框（2026-08-28 简化表单砍掉了），但 it.title/
  // it.note 仍然是完整的 {zh,en} 对象、上面几行已经整个赋值过了——查到的英文描述照样
  // 存进数据里，只是没有 UI 能看/改它，不是丢了。
  // ⚠️ 先整块重画（要连带切换出「已关联航班...清除航班」那一行），确认消息必须在
  // 重画**之后**再写一次——不然新画出来的状态栏是空的，用户点完查询什么反馈都看不到
  // （跟 adminSaveTripsForm() 里「存完刷新会冲掉提示」是同一类坑，2026-08-27 踩过一次）。
  const block = document.getElementById(`admin-item-${tripIdx}-${itemIdx}-flightblock`);
  if(block) block.outerHTML = flightLookupBlockHtml(trip, tripIdx, itemIdx);
  // 航班号输入框（id ...-flightno）不在上面这个块里——它挪到紧凑行去了，outerHTML
  // 替换碰不到它，查到了要单独把之前可能留下的错误态红边框摘掉。
  const noElOk = document.getElementById(`admin-item-${tripIdx}-${itemIdx}-flightno`);
  if(noElOk) noElOk.classList.remove('flight-input-err');
  const afterStatusEl = document.getElementById(`admin-item-${tripIdx}-${itemIdx}-flightstatus`);
  if(afterStatusEl){
    afterStatusEl.className = 'flight-lookup-status ok';
    afterStatusEl.textContent = pick('已查到并自动填入','Found — filled in automatically');
  }
}
/** 查询失败的收尾：把 {no,date,unresolved:true} 记进 it.flight（不碰 title/time/note，
 * 那些要用户自己填），整块重画让红边和警示行显眼地留下来，再补一次状态字——
 * 跟成功分支同一坑：重画会冲掉状态栏，必须在重画**之后**再写一次。 */
function adminFlightLookupFailed(tripIdx, itemIdx, it, trip, no, date, message){
  it.flight = { no, date, unresolved: true };
  markTripsDirty();
  const block = document.getElementById(`admin-item-${tripIdx}-${itemIdx}-flightblock`);
  if(block) block.outerHTML = flightLookupBlockHtml(trip, tripIdx, itemIdx);
  // 航班号输入框不在上面那个块里（挪到紧凑行了），红边框要单独补上——
  // 这正是「查询失败要显眼」这条要求落到紧凑行上唯一能看见的痕迹。
  const noEl = document.getElementById(`admin-item-${tripIdx}-${itemIdx}-flightno`);
  if(noEl) noEl.classList.add('flight-input-err');
  const statusEl = document.getElementById(`admin-item-${tripIdx}-${itemIdx}-flightstatus`);
  if(statusEl){
    statusEl.className = 'flight-lookup-status err';
    statusEl.textContent = message;
  }
}
/** 清除已关联的航班——标题/时间/备注是用户可能已经手改过的内容，原样保留，只去掉 flight。 */
function adminClearFlight(tripIdx, itemIdx){
  const trip = adminTripsDraft && adminTripsDraft[tripIdx];
  const it = trip && trip.items && trip.items[itemIdx];
  if(!it) return;
  delete it.flight;
  delete flightLookupState[`${tripIdx}:${itemIdx}`]; // 清掉记忆，改完号码重新失焦要能再查
  markTripsDirty();
  const block = document.getElementById(`admin-item-${tripIdx}-${itemIdx}-flightblock`);
  if(block) block.outerHTML = flightLookupBlockHtml(trip, tripIdx, itemIdx);
  const noEl = document.getElementById(`admin-item-${tripIdx}-${itemIdx}-flightno`);
  if(noEl) noEl.classList.remove('flight-input-err');
}
/** 行程层「更多」：只剩地点（中文）。英文标题/英文地点的输入框整个不再渲染
 * （2026-08-28，跟条目层同一条规则）——地点已经填过（旧数据或本仓库带来的）时
 * 默认展开，不藏。 */
function adminTripMoreHtml(trip, idx){
  const hasLoc = !!(trip.location && ((trip.location.zh||'').trim() || (trip.location.en||'').trim()));
  return `<details class="admin-trip-more" id="admin-trip-${idx}-more"${hasLoc ? ' open' : ''}>
      <summary>⋯ ${pick('更多','More')}${hasLoc ? ` <span class="admin-more-badge">${pick('（有地点）','(has location)')}</span>` : ''}</summary>
      <div class="admin-field"><label>${pick('地点（中文）','Location (Chinese)')}</label>
        <input type="text" data-trip="${idx}" data-field="location.zh" value="${escapeHtml(trip.location && trip.location.zh || '')}" oninput="adminTripFieldInput(this)"></div>
    </details>`;
}
/** 某个日期是这趟行程的第几天（从出发日算起，出发日 = 第 1 天）；算不出就返回 null。 */
function dayNumberInTrip(trip, dateIso){
  if(!trip || !trip.start || !dateIso) return null;
  const a = Date.parse(trip.start + 'T00:00:00Z');
  const b = Date.parse(dateIso + 'T00:00:00Z');
  if(isNaN(a) || isNaN(b)) return null;
  const n = Math.round((b - a) / 86400000) + 1;
  return n >= 1 ? n : null; // 早于出发日（前站）就不编号，免得出现「第 0 天」
}
/** 直接把某个条目的某个输入框推到眼前：展开「更多」、滚过去、聚焦、闪一下。 */
function adminFocusItemField(tripIdx, itemIdx, field){
  const more = document.getElementById(`admin-item-${tripIdx}-${itemIdx}-more`);
  if(more) more.open = true;
  const el = document.getElementById(`admin-item-${tripIdx}-${itemIdx}-${field}`);
  if(!el) return;
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  try{ el.focus({ preventScroll: true }); }catch(e){ try{ el.focus(); }catch(e2){} }
  el.classList.remove('admin-jump-flash');
  void el.offsetWidth;
  el.classList.add('admin-jump-flash');
}
function adminItemsListHtml(trip, tripIdx){
  const items = trip.items || [];
  if(!items.length){
    // 空条目列表不能只留一句灰字——这正是用户反馈「没得填时间」的根源，

        </div>`;
    }
    html += adminItemRowHtml(trip, tripIdx, i);
  });
  return html;

/** 「试一下本机通知」：绕开推送服务，直接让本机的 Service Worker 弹一条通知。
 *  这一步是把「手机能不能显示通知」和「推送能不能送到手机」拆开——
 *  2026-08-29 遇到的正是这个岔路：FCM 回 201（收下了），手机却什么都没跳，
 *  光看服务端日志分不出是投递没到还是显示被挡。
 *  弹得出来 → 显示这一段没问题，要查的是投递（省电优化、Google 服务、后台限制）；
 *  弹不出来 → 根本不是推送的事，是这台手机/浏览器不让显示通知。 */
async function adminTestLocalNotification(){
  const el = document.getElementById('admin-push-local-status');
  const say = (msg, cls) => { if(el){ el.className = 'admin-status' + (cls ? ' ' + cls : ''); el.textContent = msg; } };
  if(typeof Notification === 'undefined' || !('serviceWorker' in navigator)){
    say(pick('这个浏览器不支持通知','This browser does not support notifications'), 'err');
    return;
  }
  try{
    let perm = Notification.permission;
    if(perm === 'default') perm = await Notification.requestPermission();
    if(perm !== 'granted'){
      say(pick('通知权限没给，先在手机设置里允许','Permission not granted — allow notifications in your phone settings'), 'err');
      return;
    }
    const reg = await navigator.serviceWorker.ready;
    await reg.showNotification(pick('本机通知测试','Local test'), {
      body: pick('看到这条＝这台手机能显示通知','If you see this, this phone can show notifications'),
      data: { url: './' },
    });
    say(pick('已经让手机弹了——现在去看通知栏。没看到就说明是手机/浏览器挡掉了显示，跟推送无关。',
             'Fired — check your notification shade. Nothing there means this device is blocking display, not push.'), 'ok');
  }catch(err){
    say(pick('弹不出来：','Failed: ') + ((err && err.message) || String(err)), 'err');
  }
}

/* ===================== 机票识别：丢进 PDF/照片，自动生成一趟行程 =====================
 * 分工是刻意的（2026-08-28 建）：
 *   AI 只负责认出「航班号 + 日期」——读错了你一眼看得出来；
 *   时间/航站楼/登机口一律拿这两个去查真航班接口（既有的 flightLookup）。
 * 反过来让 AI 报时间的话，它会编出一份看起来跟真的一样的资料（这个坑今天刚踩过）。
 * 票面上的时间照样带回来，但只在真接口查不到时垫底，并且标明「票面」。
 * ⚠️ 机票原件不上传存档（上面有护照号/订位号），识别完就丢。 */
let adminTicketBusy = false;
function adminTicketStatus(msg, cls){
  const el = document.getElementById('admin-ticket-status');
  if(!el) return;
  el.className = 'admin-status' + (cls ? ' ' + cls : '');
  el.textContent = msg || '';

function adminPickTicket(){
  if(adminTicketBusy) return;
  const el = document.getElementById('admin-ticket-input');
  if(el){ el.value = ''; el.click(); }
}
function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onerror = () => reject(new Error('读不出这个文件'));
    r.onload = () => {
      const s = String(r.result || '');
      const i = s.indexOf(',');
      resolve(i >= 0 ? s.slice(i + 1) : s);
    };
    r.readAsDataURL(file);
  });
}
async function adminTicketPicked(input){
  const files = Array.from((input && input.files) || []);
  if(!files.length || adminTicketBusy) return;
  adminTicketBusy = true;
  adminTicketStatus(pick(`正在识别 ${files.length} 个文件…`, `Reading ${files.length} file(s)…`));
  try{
    const payload = [];
    for(const f of files){
      payload.push({ contentBase64: await fileToBase64(f), mime: f.type || 'application/octet-stream' });
    }
    const res = await bossCall('ticketParse', { files: payload });
    const legs = (res && res.legs) || [];
    if(!legs.length){
      adminTicketStatus(pick('没认出航班号，可能是图太糊或不是机票——手动填一下吧',
                             'No flights found — the file may be blurry or not a ticket; please fill it in manually'), 'err');
      return;
    }
    adminTicketBuildTrip(res, legs);
  }catch(err){
    adminTicketStatus((err && err.message) || pick('识别失败','Failed to read the ticket'), 'err');
  }finally{
    adminTicketBusy = false;
    if(input) input.value = '';
  }
}
/** 把识别出来的航段变成一趟新行程，然后逐段去查真航班资料。 */
async function adminTicketBuildTrip(res, legs){
  ensureAdminTripsDraft();
  const id = 'trip-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const items = legs.map(l => {
    const route = (l.from && l.to) ? `${l.from} → ${l.to}` : '';
    // 票面信息先当垫底填上——真接口查到了会被覆盖成真数据（见 adminFlightLookup）
    const noteZh = l.terminal ? `${terminalLabel(l.terminal, 'zh')}（${pick('票面','from ticket')}）` : '';
    const noteEn = l.terminal ? `${terminalLabel(l.terminal, 'en')} (from ticket)` : '';
    return { date: l.date, time: l.dep_time || '', title: { zh: route, en: route },
             note: { zh: noteZh, en: noteEn }, mapUrl: '',
             flight: { no: l.flight_no, date: l.date } };
  });
  const title = res.title || pick('新行程', 'New trip');
  adminTripsDraft.push({ id, title: { zh: title, en: '' },
    start: res.start || (items[0] && items[0].date) || '',
    end: res.end || (items[items.length - 1] && items[items.length - 1].date) || '',
    location: { zh: '', en: '' }, guideUrl: '', items });
  const tripIdx = adminTripsDraft.length - 1;
  adminExpandedTrip = tripIdx;
  markTripsDirty();
  rerenderAdminTripsSection();

  // 逐段查真数据。一段一段来（不并发）：额度是按次算的，也免得同时改同一份草稿。
  adminTicketStatus(pick(`认出 ${legs.length} 段航班，正在查真实时间…`,
                         `Found ${legs.length} flight(s) — looking up real times…`));
  for(let i = 0; i < items.length; i++){
    delete flightLookupState[`${tripIdx}:${i}`];   // 这是全新的条目，别沿用别人的「查过了」
    const ticketNote = items[i].note;              // 查成功会整个覆盖 note，先留一份
    await adminFlightLookup(tripIdx, i);
    // 真接口没给航站楼、但票面上写了的话，把票面那条留着（标了「票面」，不会被当成已核对）
    const after = adminTripsDraft[tripIdx].items[i];
    if(after && ticketNote && ticketNote.zh && !(after.note && after.note.zh)) after.note = ticketNote;
  }
  const unresolved = adminTripsDraft[tripIdx].items.filter(it => it.flight && it.flight.unresolved).length;
  adminTicketStatus(unresolved
    ? pick(`已填好 ${items.length} 段，其中 ${unresolved} 段没查到真实时间（用的是票面时间，请核对）`,
           `Filled ${items.length} leg(s); ${unresolved} could not be verified — ticket times used, please check`)
    : pick(`已填好 ${items.length} 段航班，确认后按「保存全部行程」`,
           `Filled ${items.length} leg(s) — press "Save all trips" when it looks right`),
    unresolved ? 'err' : 'ok');
  const card = document.getElementById('admin-trip-' + tripIdx + '-items');
  if(card) card.scrollIntoView({ block: 'center' });
}

/* ============================= 行程表单：校验与保存 ============================= */
/** 全空条目（标题/时间/备注/地点全没填）——新行程/新条目默认带的那种，用户没动过就
 * 保存的话，不该拦人报错，直接悄悄丢掉。 */
function isEmptyTripItem(it){
  if(!it) return true;
  const hasTitle = !!((it.title && (it.title.zh||'').trim()) || (it.title && (it.title.en||'').trim()));
  const hasNote = !!((it.note && (it.note.zh||'').trim()) || (it.note && (it.note.en||'').trim()));
  // 有 it.flight（哪怕是查询失败留下的 unresolved 标记）也不算空——不然填了航班号但
  // 没查到、又没顺手填别的字段时，保存会把这条连同「查询失败」的痕迹一起悄悄丢掉，
  // 用户完全不知道自己填过东西（2026-08-28：这正是这次事故「失败无声」的另一种翻版）。
  return !hasTitle && !hasNote && !(it.time||'').trim() && !(it.mapUrl||'').trim() && !it.flight;
}
/** 每条错误都带「在哪儿」，保存被拦下时才能做成可点击的跳转
 *  （2026-08-29 用户：「有什么填了显示警告的地方，直接跳转去那个错误的地方能吗」）。 */
function adminValidateTripsDraft(){
  const errors = [];
  adminTripsDraft.forEach((t, idx) => {
    const label = (t.title && (t.title.zh || t.title.en)) || pick('第 ' + (idx+1) + ' 个行程', 'Trip #' + (idx+1));
    const push = (msg, where) => errors.push(Object.assign({ msg: msg, tripIdx: idx }, where || {}));
    const hasTitle = !!((t.title && (t.title.zh||'').trim()) || (t.title && (t.title.en||'').trim()));
    if(!hasTitle) push(pick(label + '：标题不能为空', label + ': title cannot be empty'), { tripField: 'title.zh' });
    if(!t.start) push(pick(label + '：请填开始日期', label + ': please fill in the start date'), { tripField: 'start' });
    if(!t.end) push(pick(label + '：请填结束日期', label + ': please fill in the end date'), { tripField: 'end' });
    if(t.start && t.end && t.end < t.start){
      push(pick(label + '：结束日期不能早于开始日期', label + ': end date cannot be before the start date'), { tripField: 'end' });
    }
    // 填了内容却没日期的条目：拦下来，不许存。老板的「今日」分页是按日期抓条目的，
    // 没日期的条目在那里永远不会出现，行程里也只掉进「日期待定」一组——存进去等于
    // 悄悄丢掉。2026-08-29 在真实数据里逮到两条（「出发机场」「金边家里出发」）。
    (t.items || []).forEach(it => {
      if(isEmptyTripItem(it)) return;
      if((it.date||'').trim()) return;
      const name = (it.title && (it.title.zh || it.title.en)) || (it.time||'') || pick('某个条目','an item');
      push(pick(`${label}：「${name}」还没填日期`, `${label}: "${name}" has no date yet`),
           { itemIdx: (t.items || []).indexOf(it), itemField: 'date' });
    });
  });
  return errors;
}
/** 保存被拦下时记住每条错误在哪儿，供 adminJumpToError() 用。 */
let adminSaveErrors = [];
/** 跳到出问题的那个输入框：先把行程展开、把「更多」打开，再滚过去、聚焦、闪一下。
 *  「闪一下」不是装饰——手机屏幕小，滚过去之后不给个记号，人不知道该看哪一格。 */
function adminJumpToError(i){
  const e = adminSaveErrors[i];
  if(!e) return;
  const go = () => {
    let el = null;
    if(e.itemField != null && e.itemIdx != null){
      const more = document.getElementById(`admin-item-${e.tripIdx}-${e.itemIdx}-more`);
      if(more) more.open = true;
      el = document.getElementById(`admin-item-${e.tripIdx}-${e.itemIdx}-${e.itemField}`);
    }else if(e.tripField){
      el = document.querySelector(`input[data-trip="${e.tripIdx}"][data-field="${e.tripField}"]`);
    }
    if(!el) return;
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    try{ el.focus({ preventScroll: true }); }catch(err){ try{ el.focus(); }catch(e2){} }
    el.classList.remove('admin-jump-flash');
    void el.offsetWidth; // 强制重排，同一个元素连点两次也要重新播动画
    el.classList.add('admin-jump-flash');
  };
  if(adminExpandedTrip !== e.tripIdx){
    adminExpandedTrip = e.tripIdx;
    rerenderAdminTripsSection();
    // 重渲染是同步的，但 <details>/滚动要等这一帧画完才有正确位置
    requestAnimationFrame(go);
  }else{
    go();
  }
}
async function adminSaveTripsForm(){
  ensureAdminTripsDraft();
  const statusEl = document.getElementById('admin-trips-form-status');
  const errors = adminValidateTripsDraft();
  if(errors.length){
    // 每条错误做成可点的一行：点了直接跳到出问题的那个输入框并高亮
    // ——不能只报「某某没填」然后让人自己在 5 个条目里翻。
    statusEl.className = 'admin-status err';
    adminSaveErrors = errors;
    statusEl.innerHTML = `<div class="admin-err-hd">${pick('还差这些才能存：','Fix these before saving:')}</div>` +
      errors.map((e, i) => `<button type="button" class="admin-err-item" onclick="adminJumpToError(${i})">
          ${escapeHtml(e.msg)} <span class="admin-err-go">${pick('去修 ›','fix ›')}</span>
        </button>`).join('');
    adminJumpToError(0); // 直接把人送到第一个问题跟前，不用自己找
    return;
  }
  adminSaveErrors = [];
  statusEl.className = 'admin-status';
  statusEl.textContent = pick('保存中…','Saving…');

  // 全空条目（新行程/新条目自带的默认那条，用户没填就点保存）在这里悄悄丢掉，
  // 不进 adminValidateTripsDraft() 的报错——只影响发给服务器的内容，不改屏幕上
  // 的工作副本，避免中途报错时把还在编辑的东西也一起改没了。
  const tripsForSave = adminTripsDraft.map(t => Object.assign({}, t,
    { items: (t.items || []).filter(it => !isEmptyTripItem(it)) }));

  // 「存」和「拉最新」分成两段 try，不许合在一起：合起来的话，存成功但刷新时断网
  // 会被 catch 成「保存失败」——用户以为没存上，回头再存一次。谎报失败比不报还糟。
  try{
    await bossCall('tripsSave', { trips: tripsForSave });
  }catch(err){
    statusEl.className = 'admin-status err';
    statusEl.textContent = (err && err.message) || pick('保存失败','Save failed');
    return;
  }

  adminTripsDirty = false;
  adminTripsDraft = null;   // 用服务器最新数据重新建立工作副本
  adminExpandedTrip = null;
  try{
    await refreshFeed();
  }catch(e){
    // 已经存进服务器了，只是没拉回最新的。不影响正确性，下次进这一页自然会拉到。
  }

  // refreshFeed() 会用最新数据整块重建 #tab-admin，上面那个 statusEl 已经被换掉了，
  // 所以确认消息必须在重建之后重新写一次。用户是非工程师，点完保存什么反馈都没有的话，
  // 他会以为没存上而反复点。
  const afterEl = document.getElementById('admin-trips-form-status');
  if(afterEl){
    afterEl.className = 'admin-status ok';
    afterEl.textContent = pick('已保存','Saved');
  }
}

function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => {
      const result = String(r.result || '');
      const idx = result.indexOf(',');
      resolve(idx >= 0 ? result.slice(idx + 1) : result);
    };
    r.onerror = () => reject(r.error);
    r.readAsDataURL(file);
  });
}

/* ============================= 推送通知 ============================= */
function pushSupported(){
  return ('serviceWorker' in navigator) && ('PushManager' in window) && (typeof Notification !== 'undefined');
}
/** iPhone / iPad。iPadOS 13+ 的 Safari 谎报成 Macintosh，靠触点数补一刀。 */
function isIosLike(){
  try{
    const ua = navigator.userAgent || '';
    return /iPad|iPhone|iPod/.test(ua) || (/Macintosh/.test(ua) && (navigator.maxTouchPoints || 0) > 1);
  }catch(e){ return false; }
}
/** iOS 上「还没加到主屏」时，window.PushManager 根本不存在——pushSupported() 是 false，
 *  于是整条提示被移除，老板打开 Safari 什么都看不到，也就永远不知道要先加到主屏。
 *  这个函数专门认这种情况：现在不支持，但装上就支持。 */
function pushNeedsInstallFirst(){
  return !pushSupported() && isIosLike() && !isStandalonePwa();
}
/** iOS 硬约束：只有「已加到主屏」的 PWA 才能收 Web Push。 */
function isStandalonePwa(){
  try{
    return window.navigator.standalone === true ||
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  }catch(e){ return false; }
}
/** VAPID 公钥 base64url → Uint8Array，subscribe() 要这个格式。 */
function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  const arr = new Uint8Array(raw.length);
  for(let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
  return arr;
}
/** 拿本机浏览器当前真实的订阅状态（不依赖服务端说法），刷新完重画一次推送条。 */
async function refreshPushSubscriptionState(){
  if(!pushSupported()){ pushSubscription = null; ensurePushUI(); return; }
  try{
    const reg = await navigator.serviceWorker.getRegistration();
    pushSubscription = reg ? await reg.pushManager.getSubscription() : null;
  }catch(e){ pushSubscription = null; }
  ensurePushUI();
}

      ${dismissBtn}
    </div>${hint}`;
}
/** 建立/更新/拆掉顶部的推送条。浏览器不支持 PushManager 时整块不渲染（不是 CSS 隐藏）。 */
/** 只重画管理页里那一行，不整块重建管理页——重建会把正在编辑的行程表单冲掉。 */
function refreshAdminPushRow(){
  if(role !== 'admin') return;
  const sec = document.getElementById('admin-push-section');
  if(!sec) return;
  const tmp = document.createElement('div');
  tmp.innerHTML = adminPushSectionHtml();
  const next = tmp.firstElementChild;
  if(next) sec.replaceWith(next);
}
function ensurePushUI(){
  const app = document.getElementById('app');
  if(!app) return;
  let bar = document.getElementById('pushBar');
  if(!pushSupported() && !pushNeedsInstallFirst()){
    if(bar) bar.remove();
    refreshAdminPushRow();
    return;
  }
  // admin（YANG 自己）：**整条不渲染**。这是一个提醒老板去开通知的提示，
  // 他不是老板；之前想着「他可能要在自己手机上试一下通知发不发得出来」而留在管理页，
  // 结果他连着三轮反映「还是看得见」（2026-08-28）。不是他要的东西就别放。
  // viewer（老板本人）：挂在最顶上——他就是要被提醒开通知的那个人；
  //   已经开好了、或者他自己按过 × 关掉，就不再挂。
  if(role === 'admin'){
    if(bar) bar.remove();
    refreshAdminPushRow(); // 顶部不挂，但管理页那一行的状态要跟着变
    return;
  }
  let host = app;
  if(pushSubscription || safeGet(PUSH_BAR_DISMISS_KEY) === '1') host = null;
  if(!host){ if(bar) bar.remove(); return; }
  if(!bar || bar.parentElement !== host){
    if(bar) bar.remove();
    bar = document.createElement('div');
    bar.id = 'pushBar';
    bar.className = 'push-bar';
    host.insertBefore(bar, host.firstChild);
  }
  bar.innerHTML = pushBarInnerHtml();
  bar.classList.toggle('push-bar-mini', !!pushSubscription);
}
/** 老板手动关掉顶部推送条，记住不再弹。 */
function dismissPushBar(){
  safeSet(PUSH_BAR_DISMISS_KEY, '1');
  const bar = document.getElementById('pushBar');
  if(bar) bar.remove();
}
/** 开关按钮：iOS 的两条硬约束在这里守——非主屏环境不弹权限，
 *  requestPermission() 必须由这个点击回调直接触发（用户手势），不能异步绕一圈再弹。 */
async function togglePush(){
  if(pushBusy || !pushSupported()) return;
  if(pushSubscription){
    pushBusy = true; ensurePushUI();
    try{
      const endpoint = pushSubscription.endpoint;
      await pushSubscription.unsubscribe();
      pushSubscription = null;
      await bossCall('pushUnsubscribe', { endpoint });
    }catch(e){ /* 本机已经取消订阅了，服务端没删也不影响——下次订阅会覆盖同一 endpoint */ }
    pushBusy = false; ensurePushUI();
    return;
  }
  if(!isStandalonePwa()) return; // 提示已经在 pushBarInnerHtml() 里，不弹权限
  if(typeof Notification !== 'undefined' && Notification.permission === 'denied') return; // 浏览器不会再弹第二次
  if(!pushInfo || !pushInfo.publicKey){
    alert(pick('服务器还没准备好推送功能，请稍后再试','Push isn’t ready on the server yet — please try again later'));
    return;
  }
  pushBusy = true; ensurePushUI();
  try{
    const perm = await Notification.requestPermission();
    if(perm !== 'granted'){ pushBusy = false; ensurePushUI(); return; }
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(pushInfo.publicKey)
    });
    const j = sub.toJSON();
    await bossCall('pushSubscribe', { subscription: { endpoint: j.endpoint, keys: j.keys } });
    pushSubscription = sub;
  }catch(e){
    alert((e && e.message) || pick('开启通知失败，请稍后再试','Failed to enable notifications — please try again later'));
  }
  pushBusy = false; ensurePushUI();
}

/* ============================= 管理面板：老板的访问码 ============================= */
async function adminLoadAccessCode(){
  const el = document.getElementById('admin-access-code');
  if(!el) return;
  try{
    const res = await bossCall('accessCode', {});
    adminAccessCode = res.code || '';
    el.textContent = adminAccessCode || pick('（服务器未返回访问码）','(server did not return a code)');
  }catch(err){
    el.textContent = (err && err.message) || pick('读取失败','Failed to load');
  }
}
function adminCopyAccessCode(){
  if(!adminAccessCode) return;
  const s = document.getElementById('admin-access-code-status');
  try{
    navigator.clipboard.writeText(adminAccessCode).then(() => {
      if(s){ s.textContent = pick('已复制','Copied'); setTimeout(() => { if(s) s.textContent = ''; }, 2000); }
    }).catch(() => {});
  }catch(e){}
}

/* 从推送通知点进来时，url 若带 #trips / #bills / #inventory / #today 这样的锚点，
   直接切到对应分页——「点通知能带到对应分页」。 */
function applyHashTab(){
  const h = (location.hash || '').replace('#', '');
  const qAdmin = new URLSearchParams(location.search).get('admin') === '1';
  if(h === 'admin' || qAdmin){
    // 记账 app 的「行程管理」入口用 ?admin=1，直接落到管理页并定位到行程表单。
    // 不是 admin 的人带这个参数进来（例如误点了链接）——安静忽略，留在默认分页，
    // 绝不能因此暴露任何管理 UI（此时 #tab-admin 仍是空容器，见 ensureAdminUI）。
    if(role !== 'admin') return;
    switchTab('admin');
    const tripsSection = document.getElementById('admin-trips-section');
    if(tripsSection) tripsSection.scrollIntoView({ block: 'start' });
    return;
  }
  if(['trips','bills','inventory','today'].indexOf(h) !== -1) switchTab(h);
}

/* ensureAdminUI：管理入口按钮 + 面板内容只在 role==='admin' 时存在于 DOM 里，
   viewer 身份下这个函数什么都不建立（如果之前是 admin 现在变回 viewer，还要负责拆掉）。 */
function ensureAdminUI(){
  const nav = document.getElementById('bottomNav');
  let btn = document.getElementById('nav-admin-btn');
  if(role === 'admin'){
    if(!btn){
      btn = document.createElement('button');
      btn.className = 'nav-btn';
      btn.id = 'nav-admin-btn';
      btn.setAttribute('data-tab', 'admin');
      btn.onclick = function(){ switchTab('admin'); };
      btn.innerHTML = '<span class="nav-icon-wrap"><span class="nav-icon">🛠️</span></span>' + bl('管理','Admin');
      nav.appendChild(btn);
    }
  }else if(btn){
    btn.remove();
    const pane = document.getElementById('tab-admin');
    if(pane) pane.innerHTML = '';
  }
}

/* ============================= 启动 ============================= */
async function init(){
  TOKEN = safeGet(TOKEN_KEY) || '';
  if(!TOKEN){
    // 没存过自己的访问码：先试试记账 app 那把钥匙（同源共用 localStorage）。
    // 拿不到、无效、或不是 admin，都安静回退到正常闸门，不弹错误——那把钥匙
    // 本来就可能没配，不算异常。成功也不落地进 bossApp_token，保持单一来源。
    const borrowed = safeGet(EXPENSE_TOKEN_KEY);
    if(borrowed){
      TOKEN = borrowed;
      try{
        const feed = await fetchFeed();
        if(feed.role === 'admin'){
          handleFeed(feed, { fromNetwork:true });
          showBorrowedTokenBanner();
          return;
        }
      }catch(e){ /* 安静回退 */ }
      TOKEN = '';
    }
    openGate();
    return;
  }
  const cached = loadCachedFeed();
  if(cached && cached.data){ handleFeed(cached.data, { fromNetwork:false, fetchedAt: cached.fetchedAt }); }
  try{
    const feed = await fetchFeed();
    handleFeed(feed, { fromNetwork:true });
  }catch(err){
    if(err && err.kind === 'http' && err.status === 401){
      clearToken();
      safeRemove(FEED_CACHE_KEY);
      feedData = null;
      document.getElementById('app').classList.add('app-hidden');
      openGate();
      document.getElementById('gate-msg').textContent = pick('访问码已失效，请重新输入','Access code expired — please re-enter it');
    }else if(!cached){
      document.getElementById('app').classList.remove('app-hidden');
      document.getElementById('tab-today').innerHTML =
        `<div class="empty-card"><div class="empty-icon">📡</div><div>${bl('连不上服务器，请稍后再试','Cannot reach the server — please try again later')}</div></div>`;
    }else{
      markOffline(feedFetchedAt);
    }
  }
}
document.addEventListener('DOMContentLoaded', init);

// 行程表单有未保存改动时，关闭/刷新页面前提醒一下（切 tab 的提醒在 switchTab() 里）。
window.addEventListener('beforeunload', function(e){
  if(adminTripsDirty){ e.preventDefault(); e.returnValue = ''; }
});

/* ============================= Service Worker ============================= */
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('boss-sw.js').catch(() => {});
  });
}
</script>
