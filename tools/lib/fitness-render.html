<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>健身动图渲染台</title>
<!-- 只给 tools/render-fitness-anim.mjs 用：把 fitness App 的动作（ANIM 引擎算的关节）套到女性健身体型模型
     （tools/lib/models/fitness-female.glb，CC0）上，深色背景＋按肌肉发光，逐格渲染成循环动图。不上线、不进 App。
     每个动作的标题／次数／要领／肌肉／机位来自 tools/lib/fitness-anim-spec.json（研究员查证过的规格）。 -->
<script type="importmap">{"imports":{"three":"../../vendor/three/three.module.min.js"}}</script>
<style>
html,body{margin:0;background:#0a1226}
#stage{position:relative;overflow:hidden;font-family:"WenQuanYi Zen Hei","Noto Sans CJK SC",sans-serif;
  background:radial-gradient(ellipse 34% 62% at 50% -8%,rgba(170,200,255,.38),rgba(170,200,255,0) 70%),linear-gradient(#1d2d4f,#0d1730 70%,#0a1226)}
canvas{display:block;position:absolute;left:0;top:0}
#band,#strip,#title,#cue{z-index:2}
#band{position:absolute;left:0;right:0;top:0;background:linear-gradient(rgba(10,18,40,.9),rgba(10,18,40,.72) 75%,rgba(10,18,40,0))}
#strip{position:absolute;left:50%;top:7px;transform:translateX(-50%);display:flex;gap:4px;padding:3px 6px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
#strip div{width:44px;text-align:center;color:#8b97b0;font-size:10px;line-height:1.1;border-radius:7px;border:2px solid transparent;padding:1px 0 2px}
#strip div.on{border-color:#7be04a;color:#fff;box-shadow:0 0 8px rgba(123,224,74,.6)}
#strip img{width:40px;height:40px;display:block;margin:0 auto;opacity:.5}
#strip div.on img{opacity:1}
#title{position:absolute;left:0;right:0;text-align:center;color:#fff;font-weight:bold;font-size:19px;letter-spacing:1px;text-shadow:0 2px 6px rgba(0,0,0,.6);white-space:nowrap}
#title b{color:#ff9a3c}
#cue{position:absolute;left:0;right:0;text-align:center;color:#c9d3e6;font-size:12px;white-space:nowrap}
</style>
</head>
<body>
<div id="stage"><div id="band"></div><div id="strip"></div><div id="title"></div><div id="cue"></div></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from '../../vendor/three/addons/loaders/GLTFLoader.js';
const Q = new URLSearchParams(location.search);

// ---- 1. 从 App 本体抽出动作引擎（同一份 ANIM，不复制一份到这里，免得两边对不上） ----
const html = await (await fetch('../../fitness/index.html')).text();
const src = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(m => m[1]).find(s => s.includes('var ANIM ='));
(0, eval)(src);
const ANIM = window.ANIM;

// ---- 2. 场景：深色渐层背景（CSS）＋顶光，人物是雕像白 ----
const W = +Q.get('w') || 480, H = +Q.get('h') || 360;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.3;
const stage = document.getElementById('stage');
stage.append(renderer.domElement); Object.assign(stage.style, { width: W + 'px', height: H + 'px' });
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(26, W / H, 5, 4000);
scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x1a2338, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 2.6); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -130, right: 130, top: 130, bottom: -130, near: 10, far: 700 }); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.5;
scene.add(sun, sun.target);
const rim = new THREE.DirectionalLight(0x9fc0ff, 1.1); scene.add(rim, rim.target);

const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const std = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.65 }, o));
const M = {
  prop: std(0x5d6878, { roughness: 0.6 }), pad: std(0x2b3340, { roughness: 0.8 }), iron: std(0x30353b, { roughness: 0.35, metalness: 0.6 }),
  wood: std(0x9c7a55, { roughness: 0.75 }), plate: std(0x6b7584, { roughness: 0.35, metalness: 0.6 }), board: std(0xf2b33d, { roughness: 0.55 }),
  chrome: std(0xb9c2cc, { roughness: 0.25, metalness: 0.85 }), cable: std(0x1b1f25, { roughness: 0.5 }),
  tile: std(0x123a55, { roughness: 0.9 }), wall: std(0x8fc7dc, { roughness: 0.85 }),
  water: new THREE.MeshStandardMaterial({ color: 0x2a8fd6, emissive: 0x062a44, transparent: true, opacity: 0.26, roughness: 0.15, depthWrite: false }),
  surf: new THREE.MeshStandardMaterial({ color: 0x7fd4ff, emissive: 0x0d4a6a, transparent: true, opacity: 0.3, roughness: 0.08, metalness: 0.1, side: THREE.DoubleSide, depthWrite: false }),
};
const add = (geo, mat, cast = true) => { const m = new THREE.Mesh(geo, mat); m.castShadow = cast; m.receiveShadow = true; scene.add(m); return m; };
const catcher = add(new THREE.PlaneGeometry(900, 900), new THREE.ShadowMaterial({ opacity: 0.45 }), false); catcher.rotation.x = -Math.PI / 2; catcher.position.y = 0.05;
const mat = add(new THREE.BoxGeometry(1, 1.2, 1), std(0x0e1116, { roughness: 0.8 }), false); mat.position.y = -0.6;
const tile = add(new THREE.PlaneGeometry(900, 500), M.tile, false); tile.rotation.x = -Math.PI / 2; tile.position.y = -0.05;
const water = add(new THREE.BoxGeometry(900, 1, 320), M.water, false); water.renderOrder = 2;
const surfGeo = new THREE.PlaneGeometry(900, 320, 90, 32); surfGeo.rotateX(-Math.PI / 2);
const surf = add(surfGeo, M.surf, false); surf.renderOrder = 3;
const boxes = []; for (let i = 0; i < 8; i++) boxes.push(add(new THREE.BoxGeometry(1, 1, 1), M.prop));
let nb = 0;
function box(x0, x1, y0, y1, depth, mat_, rotZ = 0, cx = null, cy = null, cz = 0) {
  const b = boxes[nb++]; if (!b) return; b.visible = true; b.material = mat_;
  b.scale.set(Math.max(0.5, Math.abs(x1 - x0)), Math.max(0.5, Math.abs(y1 - y0)), depth);
  b.position.set(cx ?? (x0 + x1) / 2, cy ?? (y0 + y1) / 2, cz); b.rotation.set(0, 0, rotZ);
}
// 圆柱（横杆、钢索）：两点之间
const rods = []; for (let i = 0; i < 4; i++) { const m = add(new THREE.CylinderGeometry(1, 1, 1, 14), M.chrome); m.visible = false; rods.push(m); }
let nr = 0;
function rod(a, b, r, mat_) {
  const m = rods[nr++]; if (!m) return; m.visible = true; m.material = mat_;
  const d = b.clone().sub(a), L = d.length(); m.scale.set(r, L, r); m.position.copy(a).add(b).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(V(0, 1, 0), d.normalize());
}
function dumbbell() {
  const g = new THREE.Group();
  const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, 12, 12), M.iron); bar.rotation.x = Math.PI / 2; bar.castShadow = true; g.add(bar);
  for (const z of [-5, 5]) { const p = new THREE.Mesh(new THREE.CylinderGeometry(3.6, 3.6, 3.4, 6), M.plate); p.rotation.x = Math.PI / 2; p.position.z = z; p.castShadow = true; g.add(p); }
  scene.add(g); return g;
}
const DB = [dumbbell(), dumbbell()];

// ---- 3. 人物：缩放到跟引擎一样高（头顶到脚底约 98 单位），面向 +x ----
const gltf = await new GLTFLoader().loadAsync(Q.get('model') || '/tools/lib/models/fitness-female.glb');
const root = gltf.scene; scene.add(root);
root.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false; } });
// 雕像白＋按肌肉发光：着色器里按离肌肉中心的距离混入颜色（红＝发力、蓝＝被拉伸）
// 每个发光点有自己的强度 w 与半径 r：主力肌肉 1.0，协同肌肉约 0.4
const MAXG = 32;
const GLOW = { c: { value: Array.from({ length: MAXG }, () => V()) }, w: { value: new Array(MAXG).fill(0) }, r: { value: new Array(MAXG).fill(7) }, n: { value: 0 }, k: { value: 0 },
  dc: { value: new THREE.Color(0.95, 0.28, 0.22) }, ec: { value: new THREE.Color(1.0, 0.16, 0.06) } };
const statue = new THREE.MeshStandardMaterial({ color: 0xe6e9ee, roughness: 0.42, metalness: 0.02 });
const glowify = m => (m.onBeforeCompile = sh => {
  Object.assign(sh.uniforms, { gC: GLOW.c, gW: GLOW.w, gR: GLOW.r, gN: GLOW.n, gK: GLOW.k, gD: GLOW.dc, gE: GLOW.ec });
  sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vGW;')
    .replace('#include <skinning_vertex>', '#include <skinning_vertex>\nvGW = (modelMatrix * vec4(transformed, 1.0)).xyz;');
  sh.fragmentShader = sh.fragmentShader.replace('#include <common>', `#include <common>
      varying vec3 vGW; uniform vec3 gC[${MAXG}]; uniform float gW[${MAXG}]; uniform float gR[${MAXG}]; uniform int gN; uniform float gK; uniform vec3 gD; uniform vec3 gE;`)
    .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
      float gg = 0.0;
      for (int i = 0; i < ${MAXG}; i++) { if (i >= gN) break; gg = max(gg, gW[i] * (1.0 - smoothstep(gR[i] * 0.25, gR[i], distance(vGW, gC[i])))); }
      diffuseColor.rgb = mix(diffuseColor.rgb, gD, gg * gK * 0.85);
      totalEmissiveRadiance += gE * gg * gK * 0.9;`);
}, m);
const cloth = new THREE.MeshStandardMaterial({ color: 0x22262e, roughness: 0.8 }); // 运动内衣与短裤保持深色，被盖住的肌肉（臀、胸）照样发光
glowify(statue); glowify(cloth);
// 造型样品（2026-11-03，?style=statue|skin|sport，配 build 脚本 style=glam 产出的模型）：不给 style＝原样（上面那两种材质）。
//   statue＝雕像白＋浅灰头发；skin＝真人肤色（MakeHuman 皮肤贴图）＋深色马尾＋黑色运动服；sport＝小麦肤色＋珊瑚色运动服＋白球鞋。
//   头发／眉毛／睫毛／眼球／球鞋不发光（肌肉光只上皮肤与衣服）。贴图目录 ?tex=（皮肤、马尾、眉、睫毛、眼球、球鞋各一张）。
const STYLE = Q.get('style');
let SOLE = 0; // 穿鞋时鞋底厚度（落地要多抬这么多）
if (!STYLE) root.traverse(o => { if (o.isMesh) o.material = /Shorts|Bra/.test(o.name) ? cloth : statue; });
else {
  const TEX = (Q.get('tex') || '/.photos/fitness-style/tex') + '/', tl = new THREE.TextureLoader();
  const files = ['skin.png', 'hair.png', 'hair_grey.png', 'brow.png', 'lash.png', 'eye.png', 'shoes.png'], TX = {};
  await Promise.all(files.map(async f => { const t = await tl.loadAsync(TEX + f); t.flipY = false; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; TX[f] = t; }));
  const tx = f => TX[f];
  const S = {
    statue: { skin: null, skinCol: 0xe6e9ee, rough: 0.42, cloth: 0x22262e, hair: 0xd4d8e0, brow: 0x5f6570, exp: 1.3 },
    skin: { skin: 'skin.png', skinCol: 0xfff0e6, rough: 0.55, cloth: 0x141518, hair: 0x8a6a58, brow: 0x3a2a22, exp: 1.1 },
    sport: { skin: 'skin.png', skinCol: 0xf6d2b8, rough: 0.5, cloth: 0xf0606e, hair: 0x2e1d14, brow: 0x2e1d14, exp: 1.05, shoes: 0xffffff },
  }[STYLE];
  renderer.toneMappingExposure = S.exp;
  statue.color.set(S.skinCol); statue.roughness = S.rough;
  if (S.skin) { statue.map = tx(S.skin); statue.metalness = 0; }
  cloth.color.set(S.cloth); cloth.roughness = STYLE === 'sport' ? 0.6 : 0.75;
  const card = (map, col, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ map, color: col, alphaTest: 0.45, side: THREE.DoubleSide, roughness: 0.6 }, o));
  const hairM = card(tx(STYLE === 'statue' ? 'hair_grey.png' : 'hair.png'), S.hair, { roughness: 0.45 });
  const browM = card(tx('brow.png'), S.brow, { alphaTest: 0.3, roughness: 0.9 }), lashM = card(tx('lash.png'), S.brow, { alphaTest: 0.3, roughness: 0.9 });
  const eyeM = new THREE.MeshStandardMaterial({ map: tx('eye.png'), roughness: 0.15, color: STYLE === 'statue' ? 0xd8dbe2 : 0xffffff });
  const shoeM = new THREE.MeshStandardMaterial({ map: tx('shoes.png'), roughness: 0.6 });
  root.traverse(o => { if (!o.isMesh) return; const n = o.name;
    o.material = /Shorts|Bra/.test(n) ? cloth : /^Hair/.test(n) ? hairM : /^Brows/.test(n) ? browM : /^Lashes/.test(n) ? lashM : /^Eyes/.test(n) ? eyeM : /^Shoes/.test(n) ? shoeM : statue;
    if (/^(Brows|Lashes|Eyes)/.test(n)) o.castShadow = false;
    if (/^Shoes/.test(n) && !S.shoes) o.visible = false; });
}
const B = n => root.getObjectByName('mixamorig' + n);
root.updateMatrixWorld(true);
const bodyOnly = STYLE ? root.getObjectByName('Body') : root; // 有头发时只量身体（马尾不算身高）
const box0 = new THREE.Box3().setFromObject(bodyOnly); const h0 = box0.max.y - box0.min.y;
root.scale.setScalar(98 / h0); root.updateMatrixWorld(true);

const NAMES = ['Hips', 'Spine', 'Spine1', 'Spine2', 'Neck', 'Head', 'LeftShoulder', 'RightShoulder', 'LeftArm', 'LeftForeArm', 'LeftHand', 'RightArm', 'RightForeArm', 'RightHand',
  'LeftUpLeg', 'LeftLeg', 'LeftFoot', 'LeftToeBase', 'RightUpLeg', 'RightLeg', 'RightFoot', 'RightToeBase', 'HeadTop_End', 'LeftToe_End', 'RightToe_End'];
const bone = {}; NAMES.forEach(n => (bone[n] = B(n)));
const W3 = n => bone[n].getWorldPosition(V());
const REST = {}; for (const n of NAMES) REST[n] = bone[n].getWorldQuaternion(new THREE.Quaternion()); // 静止时（面向 +z）的世界旋转
const restDir = (a, b) => W3(b).sub(W3(a)).normalize();
const SEG = { RightUpLeg: 'RightLeg', RightLeg: 'RightFoot', RightFoot: 'RightToeBase', LeftUpLeg: 'LeftLeg', LeftLeg: 'LeftFoot', LeftFoot: 'LeftToeBase',
  RightArm: 'RightForeArm', RightForeArm: 'RightHand', LeftArm: 'LeftForeArm', LeftForeArm: 'LeftHand' };
const RD = {}; for (const k in SEG) RD[k] = restDir(k, SEG[k]);
RD.RightHand = RD.RightForeArm.clone(); RD.LeftHand = RD.LeftForeArm.clone();
const LEN = {}; for (const k of ['RightArm', 'RightForeArm', 'LeftArm', 'LeftForeArm', 'RightUpLeg', 'RightLeg', 'LeftUpLeg', 'LeftLeg']) LEN[k] = W3(k).distanceTo(W3(SEG[k]));
const BODY_UP = V(0, 1, 0), BODY_FWD = V(0, 0, 1);
const REST_RIGHT = W3('RightArm').sub(W3('LeftArm')).normalize(); // 静止时右手在哪一侧
const UP = V(0, 1, 0), DOWN = V(0, -1, 0);
// 穿鞋：落地原本是「脚的关节往下 2.5」，改成鞋底（静止站姿量：脚关节最低点到鞋底的距离，扣掉原本的 2.5）
if (STYLE) { const sh = root.getObjectByName('Shoes'); if (sh && sh.visible) SOLE = Math.max(0, Math.min(...['RightToe_End', 'RightFoot'].map(n => W3(n).y)) - new THREE.Box3().setFromObject(sh).min.y - 2.5); }

const v2 = (P, a, b) => V(P[b][0] - P[a][0], P[b][1] - P[a][1], 0).normalize();
function setWorldQuat(name, q) {
  const b = bone[name]; const pq = b.parent.getWorldQuaternion(new THREE.Quaternion());
  b.quaternion.copy(pq.invert().multiply(q)); b.updateMatrixWorld(true);
}
function rotWorld(name, axis, deg) { // 在世界座标里再多转一下（脊椎弯曲、转体、肩胛）
  const q = bone[name].getWorldQuaternion(new THREE.Quaternion());
  setWorldQuat(name, new THREE.Quaternion().setFromAxisAngle(axis.clone().normalize(), THREE.MathUtils.degToRad(deg)).multiply(q));
}
const curFront = n => BODY_FWD.clone().applyQuaternion(bone[n].getWorldQuaternion(new THREE.Quaternion()).multiply(REST[n].clone().invert())).normalize();
// 身体座标：T＝躯干往头、F＝脸朝的方向、OR＝身体右侧（都用骨头现在的位置算）
function frameNow() {
  const T = W3('Neck').sub(W3('Hips')).normalize();
  const r = W3('RightArm').sub(W3('LeftArm')); const OR = r.sub(T.clone().multiplyScalar(r.dot(T))).normalize();
  const F = T.clone().cross(OR).multiplyScalar(SIDE).normalize();
  return { T, F, OR };
}
let SIDE = 1; // 摆成面向 +x 后，右手在 +z（1）还是 -z（-1）；第一次摆姿势后量出来

// 两节骨头的 IK（模型自己的骨长）：根部 a → 目标点，pole 决定手肘／膝盖往哪边弯。回传两段的世界方向
function ik(side, kind, target, pole) {
  const a = side + (kind === 'arm' ? 'Arm' : 'UpLeg'), b = side + (kind === 'arm' ? 'ForeArm' : 'Leg');
  const S = W3(a), l1 = LEN[a], l2 = LEN[b];
  const d = target.clone().sub(S); let dist = d.length(); dist = Math.min(l1 + l2 - 0.05, Math.max(Math.abs(l1 - l2) + 0.05, dist));
  const dn = d.normalize();
  const ca = (l1 * l1 + dist * dist - l2 * l2) / (2 * l1 * dist), A = Math.acos(Math.max(-1, Math.min(1, ca)));
  let pp = pole.clone().sub(dn.clone().multiplyScalar(pole.dot(dn))); if (pp.lengthSq() < 1e-6) pp = V(0, 1, 0); pp.normalize();
  const E = S.clone().add(dn.clone().multiplyScalar(l1 * Math.cos(A))).add(pp.multiplyScalar(l1 * Math.sin(A)));
  const Tg = S.clone().add(dn.clone().multiplyScalar(dist));
  return { [a]: E.clone().sub(S).normalize(), [b]: Tg.sub(E).normalize() };
}
const nrm = (...vs) => { const o = V(); for (let i = 0; i < vs.length; i += 2) o.add(vs[i].clone().multiplyScalar(vs[i + 1])); return o.normalize(); };
const slerpDir = (a, b, t) => { const q = new THREE.Quaternion().setFromUnitVectors(a.clone().normalize(), b.clone().normalize()); return a.clone().normalize().applyQuaternion(new THREE.Quaternion().slerp(q, t)); };
const ease = x => 0.5 - 0.5 * Math.cos(Math.PI * Math.max(0, Math.min(1, x)));

// ---- 4. 各动作在 2D 引擎表达不了的部分（往两侧开合、转体、脊椎弯曲、肩胛）：3D 覆盖 ----
// kp：每个关键帧的进度值，按 ANIM 的插值走（默认 [0,1]）。spine(c) 在四肢之前做；legs(c)／arms(c) 回传各段世界方向。
// c.p 进度、c.T/F/OR 身体座标、c.os(side) 该侧往外、c.def(side,'arm'|'leg') 2D 姿势下手／脚该在的位置（模型骨长）。
const SLED_N = V(0.95, 0.31, 0).normalize(), SLED_UP = V(-0.31, 0.95, 0).normalize(); // 腿举机踏板：法线（往脚的方向）与板面往上
const OS = (c, side) => side === 'Right' ? c.OR.clone() : c.OR.clone().negate();
function armPress(c, side, up, fo, fwd) { // 站／坐姿推举：up＝上臂离水平线几度、fo＝前臂、fwd＝手肘在身体前方几度（肩胛骨平面）
  const d = (deg) => { const t = THREE.MathUtils.degToRad(deg), f = THREE.MathUtils.degToRad(fwd), hz = Math.cos(t); return nrm(c.F, hz * Math.sin(f), c.T, Math.sin(t), OS(c, side), hz * Math.cos(f)); };
  return { [side + 'Arm']: d(up), [side + 'ForeArm']: d(fo) };
}
function both(fn) { return Object.assign({}, fn('Right'), fn('Left')); }
function lyingPress(c, { drop, top, abd = 45 }) { // 卧推类：底部上臂与躯干约 45°、前臂垂直；顶部手在肩正上方
  return both(side => {
    const o = OS(c, side), a = THREE.MathUtils.degToRad(abd), dr = THREE.MathUtils.degToRad(drop);
    const ua = nrm(c.T, -Math.cos(a), o, Math.sin(a), c.F, -Math.tan(dr));
    const sh = W3(side + 'Arm'), L1 = LEN[side + 'Arm'], L2 = LEN[side + 'ForeArm'];
    const hb = sh.clone().add(ua.clone().multiplyScalar(L1)).add(UP.clone().multiplyScalar(L2 * 0.97));
    const ht = sh.clone().add(nrm(top, 1, o, -0.06).multiplyScalar((L1 + L2) * 0.97));
    const hand = hb.lerp(ht, c.p);
    return ik(side, 'arm', hand, ua);
  });
}
function flatHands(c, sides = ['Right', 'Left']) { const f = c.T.clone(); f.y = 0; if (f.lengthSq() < 1e-4) return {}; f.normalize(); const o = {}; sides.forEach(s => (o[s + 'Hand'] = f.clone())); return o; }
const OV = {
