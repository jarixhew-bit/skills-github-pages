<head>

     逐格渲染成循环动图。不上线、不进 App。人物模型不进仓库（授权不允许转发原档），由渲染脚本临时下载。 -->
<script type="importmap">{"imports":{"three":"../../vendor/three/three.module.min.js"}}</script>
<style>
html,body{margin:0}

  background:radial-gradient(ellipse 34% 62% at 50% -8%,rgba(170,200,255,.38),rgba(170,200,255,0) 70%),linear-gradient(#1d2d4f,#0d1730 70%,#0a1226)}

#title b{color:#ff9a3c}

</style>
</head>
<body>

<script type="module">

  'LeftUpLeg', 'LeftLeg', 'LeftFoot', 'LeftToeBase', 'RightUpLeg', 'RightLeg', 'RightFoot', 'RightToeBase', 'HeadTop_End', 'LeftToe_End', 'RightToe_End'];

// 模型摆好后的关节位置，换成引擎的名字，给器材定位用（器材要贴着「这个人」而不是贴着火柴人）
function modelP() {

  return { hip: g('Hips'), sh: mid(g('RightArm'), g('LeftArm')), nk: g('RightLeg'), nf: g('RightFoot'), fk: g('LeftLeg'), ff: g('LeftFoot'),
    ne: g('RightForeArm'), nh: g('RightHand'), fe: g('LeftForeArm'), fh: g('LeftHand'), hd: g('Head') };
}
function props(s, P) {

  const X = n => P[n][0], Y = n => P[n][1];

    if (pr === 'pad') { const x1 = Math.min(X('sh'), X('nk')) - 3, x2 = Math.max(X('sh'), X('nk')) + 3, top = Math.min(Y('sh'), Y('hip')) - 6; box(x1, x2, top - 5, top, 26, M.prop); box((x1 + x2) / 2 - 2, (x1 + x2) / 2 + 2, 0, top - 5, 14, M.iron); }
    if (pr === 'seat') { const sx = X('hip'), top = Y('hip') - 7; box(sx - 13, sx + 14, top - 5, top, 30, M.prop); box(sx - 2, sx + 2, 0, top - 5, 10, M.iron); }
    if (pr === 'back') { const x = X('hip') - 10; box(x - 2.5, x + 2.5, Y('hip') - 3, Y('sh') + 8, 26, M.prop); }

const FING = ['Index', 'Middle', 'Ring', 'Pinky'];
const fingerRest = {};
for (const side of ['Left', 'Right']) for (const f of FING.concat(['Thumb'])) for (const k of [1, 2, 3]) { const b = B(side + 'Hand' + f + k); if (b) fingerRest[b.name] = b.quaternion.clone(); }

// ---- 4. 深色样品：背后机位、手肘朝外的肩推、按用力程度发红光 ----
floorVisible(true);
const mat = add(new THREE.BoxGeometry(70, 1.2, 46), std(0x0e1116, { roughness: 0.8 }), false); mat.position.y = -0.6;

function setGlow(pts, k, r = 7) { GLOW.n.value = pts.length; pts.forEach((p, i) => GLOW.c.value[i].copy(p)); GLOW.k.value = k; GLOW.r.value = r; }
function setHalos(pts, k, toCam, size = 14) { halos.forEach((h, i) => { h.visible = i < pts.length && k > 0.05; if (!h.visible) return;
  h.position.copy(pts[i]).add(toCam.clone().multiplyScalar(5)); h.scale.setScalar(size); h.material.opacity = 0.45 * k; }); }

// 手臂在「正面」平面里的方向：θ 是离水平线的角度（往外为 0°、朝天为 90°），side=+1 右手
const armDir = (deg, side) => { const t = THREE.MathUtils.degToRad(deg); return V(0.12, Math.sin(t), side * SIDE * Math.cos(t)).normalize(); };
const ease = x => 0.5 - 0.5 * Math.cos(Math.PI * x);
function pressArms(p) { // p: 0 底部（手肘略低于肩）→ 1 推到顶
  const up = -14 + 86 * p, fo = 94 - 10 * p;
  return { RightArm: armDir(up, 1), LeftArm: armDir(up, -1), RightForeArm: armDir(fo, 1), LeftForeArm: armDir(fo, -1) };
}

async function miniShots() {
  // 顶部四个部位小图：同一个模型，正面或背面，只亮那一块
  const keep = { w: renderer.domElement.width, h: renderer.domElement.height, a: cam.aspect };
  renderer.setSize(80, 80); cam.aspect = 1; cam.updateProjectionMatrix();
  const s = ANIM.sample('ohp', 0); s.arms = { RightArm: armDir(-70, 1), LeftArm: armDir(-70, -1), RightForeArm: armDir(-80, 1), LeftForeArm: armDir(-80, -1) };
  pose(s, false); dumbbells(null); props({ props: [] }, modelP());
  DB.forEach(d => (d.visible = false)); mat.visible = catcher.visible = false;
  const F = V(1, 0, 0), out = {};
  for (const [g, back] of [['chest', 0], ['shoulder', 1], ['back', 1], ['leg', 0]]) {
    const c = g === 'leg' ? W3('RightLeg').lerp(W3('LeftLeg'), 0.5).add(V(0, 4, 0)) : W3('Spine2').add(V(0, 4, 0));
    const dir = back ? -1 : 1; cam.fov = 26; cam.position.set(c.x + dir * 125, c.y + 6, c.z); cam.lookAt(c); cam.updateProjectionMatrix();
    const pts = centers(g, F); setGlow(pts, 1, g === 'leg' ? 9 : 7); setHalos([], 0, V());
    renderer.render(scene, cam); out[g] = renderer.domElement.toDataURL('image/png');
  }
  renderer.setSize(keep.w, keep.h); cam.aspect = keep.a; cam.updateProjectionMatrix(); mat.visible = catcher.visible = true;
  return out;
}

window.renderDark = async function ({ name, reps, cue, group, fps = 12 }) {
  const mini = await miniShots();
  const LBL = { chest: '胸', shoulder: '肩', back: '背', leg: '腿' };
  document.getElementById('strip').innerHTML = Object.keys(LBL).map(g => `<div class="${g === group ? 'on' : ''}"><img src="${mini[g]}">${LBL[g]}</div>`).join('');
  document.getElementById('title').innerHTML = `${name} · <b>×${reps}</b>`;
  document.getElementById('cue').textContent = cue;
  const T = ANIM.cycleLen('ohp') * 1.6, n = Math.round(T * fps);
  // 取景：固定在背后偏上，框住全身＋推到顶的哑铃；画面上方留给标题
  const s0 = ANIM.sample('ohp', 0); s0.arms = pressArms(1); pose(s0, false);
  const top = W3('RightHand').y + 8, hip = W3('Hips');
  const c = V(hip.x, top / 2, 0), yaw = THREE.MathUtils.degToRad(14), pitch = THREE.MathUtils.degToRad(8);
  cam.fov = 26; const t = Math.tan(THREE.MathUtils.degToRad(13)), usable = (H - 122) / H; // 上方 122px 是文字
  const D = (top / 2 + 4) / (t * usable);
  cam.position.set(c.x - D * Math.cos(yaw) * Math.cos(pitch), c.y + D * Math.sin(pitch), c.z + D * Math.sin(yaw));
  cam.lookAt(c.x, c.y, c.z); cam.updateProjectionMatrix();
  cam.setViewOffset(W, H, 0, -(H * (1 - usable)) / 2, W, H); // 人物整体往下移，让出标题区
  sun.position.set(c.x - 30, 260, 40); sun.target.position.set(c.x, 0, 0);
  rim.position.set(c.x + 160, c.y + 60, -60); rim.target.position.set(c.x, c.y, 0);
  const toCam = cam.position.clone().sub(c).normalize();
  const frames = [];
  for (let i = 0; i < n; i++) {
    const ph = i / n, p = ease(ph < 0.5 ? ph * 2 : 2 - ph * 2); // 推上去、放下来
    const s = ANIM.sample('ohp', 0); s.arms = pressArms(p); pose(s, false); props({ props: [] }, modelP()); dumbbells('hands');
    // 底部肩膀负荷最大：越低越红
    const k = 0.25 + 0.75 * (1 - p), pts = centers('shoulder', V(1, 0, 0));
    setGlow(pts, k, 7.5); setHalos(pts, k, toCam);
    renderer.render(scene, cam);
    frames.push(i);
  }
  return { n, ms: Math.round(T * 1000 / n) };
};
window.frameAt = function (i, n) { // 给截图用：把第 i 格摆好
  const ph = i / n, p = ease(ph < 0.5 ? ph * 2 : 2 - ph * 2);
  const s = ANIM.sample('ohp', 0); s.arms = pressArms(p); pose(s, false); props({ props: [] }, modelP()); dumbbells('hands');
  const k = 0.25 + 0.75 * (1 - p), pts = centers('shoulder', V(1, 0, 0));
  const toCam = cam.position.clone().normalize();
  setGlow(pts, k, 7.5); setHalos(pts, k, cam.position.clone().sub(pts[0]).normalize());
  renderer.render(scene, cam);
};
window.ready = true;
</script>
