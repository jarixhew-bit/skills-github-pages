<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>月度报告</title>
<!--
  老板月度报告（只读快照页）
  ================================================================
  这一页存在的理由（2026-08-10 与用户确认后建立）：

  老板每月底要看账。原本是发一份报告给他。想给他「随时能看」的便利，但**不做实时
  监控 App**——月中的数字是半成品（待 claim 的、没对账的、收据没传的），让人看正在
  施工的工地，只会换来解释成本。折中做法就是这一页：

    只给**已经过去的月份**，一个数都不算，只画服务端送来的数。

  所以这页只有「上个月」和更早，永远看不到当月。当月的数还在动，动的数不叫报告。

  三条设计铁律（改这页时不准破）：
  1. **只读**。没有任何表单、按钮、写入路径。老板拿到的是一面窗，不是一支笔。
  2. **一个数都不在这边算**。合计、分组、余额全部由服务端（butler）算好送来，
     这边只负责排版。记账 App 里同一条铁律的理由写在 expense-tracker.html 的
     备用金注释里：算法住两处，迟早分岔，分岔那天钱的数会有两个版本。
  3. **不看当月**。见上。

  钥匙怎么给（重要，发出去之前必读）：
  链接形如  .../boss-report/#k=钥匙
  页面读到 #k= 就存进 localStorage 并把地址栏里的钥匙抹掉（免得截图外泄），之后
  刷新不用再填。**给老板的必须是一把只读钥匙**，不能是记账 App 里那把公司报账
  密钥——那把还能写。只读钥匙要在 butler-bot 那边加，没加之前这页只能看示例数据。
-->
<style>
:root{
  --p:#6c63ff; --bg:#f5f6fa; --card:#fff; --txt:#1a1a2e; --sub:#7a7a8c;
  --line:#ececf3; --warn:#e07a3f; --ok:#2fa36b;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15151f; --card:#1e1e2b; --txt:#f0f0f5; --sub:#9a9ab0; --line:#2b2b3c;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  -webkit-font-smoothing:antialiased;padding:0 0 40px}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}

/* 顶栏 */
.top{background:var(--p);color:#fff;padding:22px 0 26px;margin-bottom:-14px}
.top .wrap{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.top-title{font-size:15px;opacity:.9}
.top-month{font-size:26px;font-weight:700;margin-top:2px;letter-spacing:.5px}
.badge{background:rgba(255,255,255,.2);border-radius:999px;padding:5px 11px;
  font-size:12px;white-space:nowrap;margin-top:4px}

/* 卡片 */
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px;
  box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card-title{font-size:13px;color:var(--sub);margin-bottom:10px;font-weight:600}
.big{font-size:34px;font-weight:700;letter-spacing:-.5px}
.sub{font-size:13px;color:var(--sub);margin-top:4px;line-height:1.6}
.warn{color:var(--warn)}
.hr{height:1px;background:var(--line);margin:12px 0}

/* 行 */
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0}
.row+.row{border-top:1px solid var(--line)}
.row-name{font-size:14px}
.row-meta{font-size:12px;color:var(--sub);margin-top:2px}
.row-amt{font-size:15px;font-weight:600;white-space:nowrap}
.row-amt.low{color:var(--warn)}

/* 类别条 */
.bar-row{padding:8px 0}
.bar-top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.bar-track{height:7px;background:var(--line);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;background:var(--p);border-radius:99px}
.bar-pct{font-size:12px;color:var(--sub);margin-left:6px}

/* 每日明细 */
details{margin-bottom:12px}
summary{list-style:none;cursor:pointer;background:var(--card);border-radius:14px;
  padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.06);
  display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
summary::-webkit-details-marker{display:none}
summary .chev{color:var(--sub);font-size:13px}
details[open] summary{border-radius:14px 14px 0 0}
.day-body{background:var(--card);border-radius:0 0 14px 14px;padding:0 16px 12px;
  box-shadow:0 1px 3px rgba(0,0,0,.06)}
.day{padding:10px 0}
.day+.day{border-top:1px solid var(--line)}
.day-head{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:6px}
.item{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:13px}
.item-sub{font-size:11px;color:var(--sub);margin-top:1px}

/* 状态条 */
.note{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:12px;
  font-size:13px;color:var(--sub);line-height:1.7;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.note b{color:var(--txt)}
.demo{background:#fff4e6;color:#8a5a1e;border-radius:14px;padding:12px 16px;
  margin-bottom:12px;font-size:13px;line-height:1.6}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .demo{background:#3a2c17;color:#e8c48c}
}
.foot{text-align:center;font-size:12px;color:var(--sub);margin-top:18px;line-height:1.8}
</style>

<div class="top">
  <div class="wrap">
    <div>
      <div class="top-title">公司月度报告</div>
      <div class="top-month" id="hd-month">—</div>
    </div>
    <div class="badge" id="hd-badge">只读</div>
  </div>
</div>

<div class="wrap">
  <div id="banner"></div>
  <div id="body"></div>
  <div class="foot" id="foot"></div>
</div>

<script>
/* ===================== 常量 ===================== */
const API = 'https://butler-bot.jarixhew.workers.dev/company-expense';
const KEY_STORE = 'bossReport_key';
const fmt = n => '$' + (Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/** 只给已经过去的月份。当月的数还在动，动的数不叫报告。 */
function lastMonth(){
  const d = new Date();
  return new Date(Date.UTC(d.getFullYear(), d.getMonth()-1, 1)).toISOString().slice(0,7);
}
function monthLabel(m){
  const [y,mm] = String(m).split('-');
  return `${y} 年 ${Number(mm)} 月`;
}
/** ?m=2026-07 可以看更早的月份，但不接受当月或未来 */
function wantedMonth(){
  const q = new URLSearchParams(location.search).get('m');
  const max = lastMonth();
  return (q && /^\d{4}-\d{2}$/.test(q) && q <= max) ? q : max;
}

/**
 * 钥匙从链接的 #k= 进来，存起来后立刻把它从地址栏抹掉。
 * 为什么要抹：这页老板多半在手机上开，地址栏带着钥匙，随手一张截图就外泄了。
 */
function takeKey(){
  const m = location.hash.match(/[#&]k=([^&]+)/);
  if(m){
    try{ localStorage.setItem(KEY_STORE, decodeURIComponent(m[1])); }catch(e){}
    history.replaceState(null, '', location.pathname + location.search);
  }
  try{ return localStorage.getItem(KEY_STORE) || ''; }catch(e){ return ''; }
}

/* ===================== 示例数据 =====================
 * 没有钥匙时用它撑满整页，让人看得出这页长什么样。名字金额都是编的。
 * 结构照抄服务端 action:"ledger" / "petty" 的真实回传，换成真数据不用改渲染。 */
const DEMO = {
  ledger: {
    // 总额、笔数、每个人的小计跟下面的明细是对得上的——示例数据自己先不能自相矛盾，
    // 否则第一眼看到的就是「这页算错了」
    status:'ok', month:'—', total:238.40, count:7, missingPhoto:1, orphan:0,
    byReporter:[
      { name:'阿明', total:174.40, count:5 },
      { name:'阿华', total: 32.50, count:1 },
      { name:'阿强', total: 31.50, count:1 },
    ],
    days:[
      { date:'—-28', total:96.30, count:3, missingPhoto:0, byReporter:[
        { name:'阿明', total:63.80, count:2, missingPhoto:0, records:[
          { billNo:'B-1042', categoryEn:'Lunch',  note:'客户饭局', reporter:'阿明', person:'老板', side:'boss', hasPhoto:true, amountUsd:48.00 },
          { billNo:'B-1043', categoryEn:'Petrol', note:'', reporter:'阿明', person:'阿明', side:'staff', hasPhoto:true, amountUsd:15.80 },
        ]},
        { name:'阿华', total:32.50, count:1, missingPhoto:0, records:[
          { billNo:'B-1044', categoryEn:'Store', note:'办公室用品', reporter:'阿华', person:'阿华', side:'staff', hasPhoto:true, amountUsd:32.50 },
        ]},
      ]},
      { date:'—-27', total:142.10, count:4, missingPhoto:1, byReporter:[
        { name:'阿明', total:110.60, count:3, missingPhoto:1, records:[
          { billNo:'B-1038', categoryEn:'Dinner',  note:'', reporter:'阿明', person:'老板', side:'boss', hasPhoto:false, amountUsd:78.00 },
          { billNo:'B-1039', categoryEn:'Parking', note:'', reporter:'阿明', person:'阿明', side:'staff', hasPhoto:true, amountUsd:2.60 },
          { billNo:'B-1040', categoryEn:'Car Wash', note:'', reporter:'阿明', person:'阿明', side:'staff', hasPhoto:true, amountUsd:30.00 },
        ]},
        { name:'阿强', total:31.50, count:1, missingPhoto:0, records:[
          { billNo:'B-1041', categoryEn:'Beverage', note:'会议茶水', reporter:'阿强', person:'阿强', side:'staff', hasPhoto:true, amountUsd:31.50 },
        ]},
      ]},
    ],
  },
  // 三个人刚好各示范一种状态：够用、快没了、垫了钱。已花的数跟上面的明细对得上。
  petty: [
    { person:'阿明', status:'ok', balance: 325.60, opened:500, openedDate:'—-01', spent:174.40, topups:[] },
    { person:'阿华', status:'ok', balance:  67.50, opened:100, openedDate:'—-01', spent: 32.50, topups:[] },
    { person:'阿强', status:'ok', balance: -11.50, opened: 20, openedDate:'—-01', spent: 31.50, topups:[] },
  ],
};

/* ===================== 取数 ===================== */
async function call(token, payload){
  const res = await fetch(API, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(Object.assign({ token }, payload))
  });
  const body = await res.json().catch(()=>({}));
  if(!res.ok || body.status !== 'ok'){
    const why = body.status === 'forbidden' ? '这把钥匙没有看全员账本的权限'
              : (body.message || `拉不到（${res.status}）`);
    throw new Error(why);
  }
  return body;
}

/* ===================== 汇总（只做分组，不重算任何总额） =====================
 * 类别汇总服务端没给，只能在这边按笔加。这是唯一的例外，而且加的是它自己送来的
 * 每一笔 amountUsd——总额仍然用服务端的 d.total，不用这里加出来的数去覆盖它。 */
function byCategory(d){
  const map = new Map();
  (d.days||[]).forEach(day =>
    (day.byReporter || [{records: day.records||[]}]).forEach(g =>
      (g.records||[]).forEach(r => {
        const k = r.categoryEn || '其他';
        const cur = map.get(k) || { name:k, total:0, count:0 };
        cur.total += Number(r.amountUsd)||0; cur.count++;
        map.set(k, cur);
      })));
  return [...map.values()].sort((a,b)=>b.total-a.total);
}
function bySide(d){
  let boss = 0, other = 0;
  (d.days||[]).forEach(day =>
    (day.byReporter || [{records: day.records||[]}]).forEach(g =>
      (g.records||[]).forEach(r => {
        if(r.side === 'boss') boss += Number(r.amountUsd)||0;
        else other += Number(r.amountUsd)||0;
      })));
  return { boss, other };
}

/* ===================== 画 ===================== */
function render(d, petty, opts){
  const demo = !!(opts && opts.demo);
  const cats = byCategory(d);
  const sides = bySide(d);
  const catMax = cats.length ? cats[0].total : 1;

  const html = [];

  // 总额
  html.push(`
    <div class="card">
      <div class="card-title">本月公司支出</div>
      <div class="big">${fmt(d.total)}</div>
      <div class="sub">${d.count} 笔${d.missingPhoto ? `　·　<span class="warn">${d.missingPhoto} 笔没有收据照片</span>` : '　·　收据齐全'}</div>
      ${d.orphan ? `<div class="sub warn">另有 ${d.orphan} 笔归属人不在名册里，没进表</div>` : ''}
      <div class="hr"></div>
      <div class="row">
        <div class="row-name">算老板的<div class="row-meta">Excel 左表</div></div>
        <div class="row-amt">${fmt(sides.boss)}</div>
      </div>
      <div class="row">
        <div class="row-name">算同事的<div class="row-meta">Excel 右表</div></div>
        <div class="row-amt">${fmt(sides.other)}</div>
      </div>
    </div>`);

  // 谁报的
  html.push(`
    <div class="card">
      <div class="card-title">谁报的</div>
      ${(d.byReporter||[]).map(x => `
        <div class="row">
          <div class="row-name">${esc(x.name)}<div class="row-meta">${x.count} 笔</div></div>
          <div class="row-amt">${fmt(x.total)}</div>
        </div>`).join('') || '<div class="sub">这个月没有记录</div>'}
    </div>`);

  // 花在哪
  html.push(`
    <div class="card">
      <div class="card-title">花在哪</div>
      ${cats.map(c => `
        <div class="bar-row">
          <div class="bar-top">
            <div>${esc(c.name)}<span class="bar-pct">${c.count} 笔</span></div>
            <div>${fmt(c.total)}</div>
          </div>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.max(3, c.total/catMax*100)}%"></div></div>
        </div>`).join('') || '<div class="sub">这个月没有记录</div>'}
    </div>`);

  // 备用金
  if(petty && petty.length){
    const set = petty.filter(p => p.status === 'ok');
    html.push(`
      <div class="card">
        <div class="card-title">备用金（月底手上还剩）</div>
        ${set.map(p => `
          <div class="row">
            <div class="row-name">${esc(p.person)}<div class="row-meta">已花 ${fmt(p.spent)}</div></div>
            <div class="row-amt ${p.balance < 100 ? 'low' : ''}">${fmt(p.balance)}</div>
          </div>`).join('')}
        ${set.some(p=>p.balance<0) ? `<div class="sub warn">负数 = 他自己先垫了钱，公司欠他</div>` : ''}
      </div>`);
  }

  // 每日明细（默认收起，要看才展开）
  html.push(`
    <details>
      <summary><span>每一笔明细（${d.count} 笔）</span><span class="chev">展开 ▾</span></summary>
      <div class="day-body">
        ${(d.days||[]).map(day => `
          <div class="day">
            <div class="day-head">
              <div>${esc(day.date)}<span class="row-meta">　${day.count} 笔</span></div>
              <div>${fmt(day.total)}</div>
            </div>
            ${(day.byReporter || [{name:null, records:day.records||[]}]).map(g =>
              (g.records||[]).map(r => `
                <div class="item">
                  <div>
                    <div>${esc(r.categoryEn)}${r.note ? ` — ${esc(r.note)}` : ''}</div>
                    <div class="item-sub">${g.name ? esc(g.name)+' 记　·　' : ''}算 ${esc(r.person)} 的${
                      r.hasPhoto ? '' : '　·　<span class="warn">缺收据</span>'}</div>
                  </div>
                  <div>${fmt(r.amountUsd)}</div>
                </div>`).join('')).join('')}
          </div>`).join('') || '<div class="sub" style="padding:12px 0">这个月没有记录</div>'}
      </div>
    </details>`);

  document.getElementById('body').innerHTML = html.join('');
  document.getElementById('foot').innerHTML = demo
    ? '示例数据 · 这一页只显示已经过去的月份'
    : `这一页只显示已经过去的月份，数字不会再变动<br>打开时间 ${new Date().toLocaleString('zh-CN')}`;
}

function showMessage(title, lines){
  document.getElementById('body').innerHTML =
    `<div class="note"><b>${esc(title)}</b><br>${lines.map(esc).join('<br>')}</div>`;
}

/* ===================== 启动 ===================== */
(async function init(){
  const month = wantedMonth();
  document.getElementById('hd-month').textContent = monthLabel(month);
  const key = takeKey();

  if(!key){
    document.getElementById('hd-badge').textContent = '示例';
    document.getElementById('banner').innerHTML =
      `<div class="demo">下面是<b>示例数据</b>，不是真的账。<br>
       要看真数据，请用带钥匙的链接打开（形如 …/boss-report/#k=钥匙）。</div>`;
    const demo = JSON.parse(JSON.stringify(DEMO.ledger));
    demo.month = month;
    demo.days.forEach(d => { d.date = month + d.date.slice(1); });
    render(demo, DEMO.petty, {demo:true});
    return;
  }

  showMessage('正在拉取…', ['第一次打开会慢一点']);
  let ledger = null, petty = null;
  try{
    ledger = await call(key, { action:'ledger', month });
  }catch(e){
    showMessage('看不到这个月的账', [e.message, '如果一直这样，跟 Yang 说一声。']);
    return;
  }
  // 备用金拿不到不算致命：账本才是主角，少一张卡也要把报告显示出来
  try{ const p = await call(key, { action:'petty' }); petty = p.people || []; }catch(e){ petty = null; }
  document.getElementById('banner').innerHTML = '';
  render(ledger, petty, {demo:false});
})();
</script>
