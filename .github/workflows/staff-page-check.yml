# 同事版报账页（staff/）的自检（真浏览器）。
# 这个页面装在同事自己的手机里、直接往公司账本写数据，出问题的形式是
# 「静静记错人」或「离线时静静丢掉一笔」——两种都不会报错，只能靠断言守。
# 测试全程把 localhost 以外的网域断掉，等于复现工地/路上没信号那种网络。
name: staff expense page check

# staff/index.html 是从 expense-tracker.html 生成的，所以改 App 也要跑这套——
# 不然 App 改了、同事版没重新生成，两边就静静分岔了。
on:
  # 只在推上 main 之后再验一次（合并后的安全网）。
  # 分支上的验证由下面的 pull_request 负责——两个都开着的话，同一份代码会跑两遍
  # （推分支一遍、开 PR 又一遍），白烧一倍时间。2026-08-11 收掉。
  push:
    branches: [main]
    paths:
      - 'staff/**'
      - 'expense-tracker.html'
      - 'tools/build-staff-page.py'
      - 'tools/check-staff-page.mjs'
      - '.github/workflows/staff-page-check.yml'
  pull_request:
    paths:
      - 'staff/**'
      - 'expense-tracker.html'
      - 'tools/build-staff-page.py'
      - 'tools/check-staff-page.mjs'
  workflow_dispatch:

# 同一分支的 push 与 pull_request 会各触发一次，这个检查要装 Chromium（约 1 分钟），
# 跑两遍纯属浪费。新的一跑就取消同组里还没跑完的旧的。
concurrency:
  group: staff-page-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # 这份自检整份要跑近两分钟，是四个浏览器 job 里最慢的一个，CI 的墙上时间由它决定。
    # 拆成两条并行的腿（脚本里的 PART 开关，两半加起来 = 整份 289 项），
    # 最慢那条降到约 70 秒。本地不设 PART 仍然是整份跑，不影响手动验证。
    strategy:
      fail-fast: false          # 一半红了，另一半也要跑完，才知道是不是同一个问题
      matrix:
        part: [1, 2]
    name: check (前后半 ${{ matrix.part }}/2)
    steps:
      - uses: actions/checkout@v4
      # 先确认交上来的 staff/index.html 真的是当前 expense-tracker.html 生成出来的。
      # 手改同事版、或改了 App 忘了重新生成，都在这一步就红——不必等浏览器测试。
      - name: 同事版是不是最新生成的
        run: python3 tools/build-staff-page.py --check
      - uses: ./.github/actions/browser-check-setup
        with:
          health-url: http://localhost:8899/staff/index.html
      - name: 跑同事版报账页自检（第 ${{ matrix.part }} 半）
        run: node tools/check-staff-page.mjs
        env:
          PART: ${{ matrix.part }}
      # 结构检查很快，只在第一条腿跑一次就够
      - name: HTML 结构检查
        if: matrix.part == 1
        run: python3 tools/check-html.py staff/index.html
