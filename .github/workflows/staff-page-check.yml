# 同事版报账页（staff/）的自检（真浏览器）。
# 这个页面装在同事自己的手机里、直接往公司账本写数据，出问题的形式是
# 「静静记错人」或「离线时静静丢掉一笔」——两种都不会报错，只能靠断言守。
# 测试全程把 localhost 以外的网域断掉，等于复现工地/路上没信号那种网络。
name: staff expense page check

on:
  push:
    paths:
      - 'staff/**'
      - 'tools/check-staff-page.mjs'
      - '.github/workflows/staff-page-check.yml'
  pull_request:
    paths:
      - 'staff/**'
      - 'tools/check-staff-page.mjs'
  workflow_dispatch:

# 同一分支的 push 与 pull_request 会各触发一次，这个检查要装 Chromium（约 1 分钟），
# 跑两遍纯属浪费。新的一跑就取消同组里还没跑完的旧的。
concurrency:
  group: staff-page-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 装 playwright
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: 起本地服务器
        run: |
          # 输出必须重定向、还要 disown：后台进程只要还占着这个步骤的 stdout，
          # Actions 就会一直等它、整个步骤挂住不结束（见 expense-company-check.yml 的注释）。
          nohup python3 -m http.server 8899 > /tmp/httpserver.log 2>&1 &
          disown || true
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://localhost:8899/staff/index.html && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:8899/staff/index.html \
            || { echo "本地服务器没起来"; cat /tmp/httpserver.log; exit 1; }
      - name: 跑同事版报账页自检
        run: node tools/check-staff-page.mjs
      - name: HTML 结构检查
        run: python3 tools/check-html.py staff/index.html
