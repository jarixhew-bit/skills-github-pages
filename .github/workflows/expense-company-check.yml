# expense-tracker.html 公司报账功能的自检（真浏览器）。
# 这块管的是钱——送进公司账本的金额、币种、算谁头上，错一个就是账目对不上，
# 所以不接受"看起来对"，每次改到这个页面都用真浏览器实跑一遍。
# 测试全程把 localhost 以外的网域断掉，等于复现酒店/商家白名单 WiFi 那种网络。
name: expense tracker company check

on:
  # 只挂 pull_request，不挂 push（2026-08-11 用户看到「一次出现 4 条」后收掉）：
  # 本仓库所有改动都走 PR，合并前已经验过一遍；再挂 push 的话，合并进 main 又跑一遍，
  # Actions 页面上每个改动就出现两批记录。要手动补跑用上面 Actions 页的 Run workflow。
  pull_request:
    paths:
      - 'expense-tracker.html'
      - 'tools/check-expense-company.mjs'
      - '.github/workflows/expense-company-check.yml'
      - '.github/actions/browser-check-setup/action.yml'
  workflow_dispatch:

# 同一个分支上 push 与 pull_request 会各触发一次，这个检查要装 Chromium（约 1 分钟），
# 跑两遍纯属浪费。新的一跑就取消同组里还没跑完的旧的。
concurrency:
  group: expense-company-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/browser-check-setup
        with:
          health-url: http://localhost:8899/expense-tracker.html
      - name: 跑公司报账自检
        run: node tools/check-expense-company.mjs
