# expense-tracker.html 公司报账功能的自检（真浏览器）。
# 这块管的是钱——送进公司账本的金额、币种、算谁头上，错一个就是账目对不上，
# 所以不接受"看起来对"，每次改到这个页面都用真浏览器实跑一遍。
# 测试全程把 localhost 以外的网域断掉，等于复现酒店/商家白名单 WiFi 那种网络。
name: expense tracker company check

on:
  push:
    paths:
      - 'expense-tracker.html'
      - 'tools/check-expense-company.mjs'
      - '.github/workflows/expense-company-check.yml'
  pull_request:
    paths:
      - 'expense-tracker.html'
      - 'tools/check-expense-company.mjs'
  workflow_dispatch:

# 同一个分支上 push 与 pull_request 会各触发一次，这个检查要装 Chromium（约 1 分钟），
# 跑两遍纯属浪费。新的一跑就取消同组里还没跑完的旧的。
concurrency:
  group: expense-company-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Chromium 有 150MB 左右，每个 job 每次都重下要 30 秒上下（2026-08-11 量过：
      # 同事版那个 job 整段「装 playwright」34 秒）。缓存住之后只有 playwright 版本
      # 变了才会重下——所以 key 跟着 package.json 走。
      - name: 缓存 Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}
      - name: 装 playwright
        run: |
          npm install
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            # 浏览器本体已经从缓存拿回来了，只要补系统依赖（这一步很快）
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
      - name: 起本地服务器
        run: |
          # 输出必须重定向、还要 disown：后台进程只要还占着这个步骤的 stdout，
          # Actions 就会一直等它、整个步骤挂住不结束（2026-08-03 踩到，一个 run 卡了 20 分钟，
          # 同一个 commit 上另一个 run 却 79 秒跑完——这种时好时坏正是没重定向的典型表现）。
          nohup python3 -m http.server 8899 > /tmp/httpserver.log 2>&1 &
          disown || true
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://localhost:8899/expense-tracker.html && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:8899/expense-tracker.html \
            || { echo "本地服务器没起来"; cat /tmp/httpserver.log; exit 1; }
      - name: 跑公司报账自检
        run: node tools/check-expense-company.mjs
