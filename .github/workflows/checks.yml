# 本仓库全部 PR 检查，合并成这一个 workflow。
#
# 建立原因（2026-08-11 用户要求）：「我不要再看到下一个指令就跑好几条一样的 workflow」。
# 原本每项检查各是一个独立 workflow，Actions 页面上一个改动就摊开成五到八行，
# 看着像在重复。现在只有这一行，点进去才看得到里面跑了哪几项。
#
# 怎么决定跑哪几项：第一个 job（决定跑什么）用 tools/ci-decide.py 比对这次改了哪些文件，
# 后面每个 job 靠 needs.decide.outputs.* 决定要不要跑。不需要的 job 显示成「跳过」，
# 不占运行时间、也不另开一行记录。加新检查改 ci-decide.py 的 RULES ＋ 这里加一个 job，
# **不要再开新的 workflow 文件**。
#
# 只挂 pull_request：所有改动都走 PR，合并前已经验过；再挂 push 的话合并后又跑一批，
# 页面上就又变成两批记录。要补跑用 Actions 页的 Run workflow。
name: Checks

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  decide:
    name: 决定跑什么
    runs-on: ubuntu-latest
    outputs:
      html: ${{ steps.d.outputs.html }}
      secrets: ${{ steps.d.outputs.secrets }}
      pwa: ${{ steps.d.outputs.pwa }}
      ainote: ${{ steps.d.outputs.ainote }}
      declog: ${{ steps.d.outputs.declog }}
      notify: ${{ steps.d.outputs.notify }}
      morningpos: ${{ steps.d.outputs.morningpos }}
      generated: ${{ steps.d.outputs.generated }}
      rules: ${{ steps.d.outputs.rules }}
      workflows: ${{ steps.d.outputs.workflows }}
      company: ${{ steps.d.outputs.company }}
      inventory: ${{ steps.d.outputs.inventory }}
      boss: ${{ steps.d.outputs.boss }}
      fund: ${{ steps.d.outputs.fund }}
      news: ${{ steps.d.outputs.news }}
      prices: ${{ steps.d.outputs.prices }}
      staff: ${{ steps.d.outputs.staff }}
      gamebot: ${{ steps.d.outputs.gamebot }}
      weather: ${{ steps.d.outputs.weather }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 要拿得到 base 分支才算得出改动范围
      - id: d
        run: |
          base="origin/${{ github.base_ref || 'main' }}"
          git fetch origin "${{ github.base_ref || 'main' }}" --depth=1 || true
          python3 tools/ci-decide.py "$base...HEAD"

  html:
    name: HTML 结构
    needs: decide
    if: needs.decide.outputs.html == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check-html.py --all

  secrets:
    name: 秘钥扫描
    needs: decide
    if: needs.decide.outputs.secrets == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check-secrets.py

  pwa:
    name: PWA scope 不重叠
    needs: decide
    if: needs.decide.outputs.pwa == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check-pwa-scopes.py

  ainote:
    name: AI 笔记防编造
    needs: decide
    if: needs.decide.outputs.ainote == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check-ai-note.py

  declog:
    name: 决策日志
    needs: decide
    if: needs.decide.outputs.declog == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check-decision-log.py

  notify:
    name: 出事通知器
    needs: decide
    if: needs.decide.outputs.notify == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check-ci-notify.py

  morningpos:
    name: 早报读得懂持仓
    needs: decide
    if: needs.decide.outputs.morningpos == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install cryptography --quiet
      - run: python3 tools/check-morning-positions.py

  generated:
    name: 生成物没脱节
    needs: decide
    if: needs.decide.outputs.generated == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check-generated.py

  rules:
    name: 制度档体检
    needs: decide
    if: needs.decide.outputs.rules == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check-rules.py
      # 「一条规则只住一个家」的可执行版本：查同一条规则有没有被复述进第二个档案
      - run: python3 tools/check-rule-homes.py

  workflows:
    name: workflow 文件
    needs: decide
    if: needs.decide.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check-workflows.py

  company:
    name: 公司账（真浏览器）
    needs: decide
    if: needs.decide.outputs.company == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/browser-check-setup
        with:
          health-url: http://localhost:8899/expense-tracker.html
      - run: node tools/check-expense-company.mjs

  inventory:
    name: 库存分页（真浏览器）
    needs: decide
    if: needs.decide.outputs.inventory == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/browser-check-setup
        with:
          health-url: http://localhost:8899/expense-tracker.html
      - run: node tools/check-inventory.mjs

  boss:
    name: 老板 App（真浏览器）
    needs: decide
    if: needs.decide.outputs.boss == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/browser-check-setup
        with:
          health-url: http://localhost:8899/boss/index.html
      - run: node tools/check-boss.mjs

  news:
    name: 新闻抓取与翻译
    needs: decide
    if: needs.decide.outputs.news == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check-news.py

  prices:
    name: 行情校验
    needs: decide
    if: needs.decide.outputs.prices == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check-prices.py

  fund:
    name: 作业系统简报页（真浏览器）
    needs: decide
    if: needs.decide.outputs.fund == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/browser-check-setup
        with:
          health-url: http://localhost:8899/trading/fund.html
      - run: node tools/check-fund.mjs

  weather:
    name: 手册天气条（真浏览器）
    needs: decide
    if: needs.decide.outputs.weather == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/browser-check-setup
        with:
          health-url: http://localhost:8899/singapore-trip/
      - run: node tools/check-weather.mjs

  staff:
    # 名字里不放 matrix 变量：job 被跳过时 GitHub 不展开它，会原样显示 ${{ }}，
    # 看起来像坏了。分成哪两半在 job 内部的步骤名里写。
    name: 同事版（真浏览器）
    needs: decide
    if: needs.decide.outputs.staff == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    steps:
      - uses: actions/checkout@v4
      # 先确认同事版真的是当前 expense-tracker.html 生成出来的，
      # 手改或忘了重新生成都在这一步就红，不必等浏览器测试
      - run: python3 tools/build-staff-page.py --check
      - uses: ./.github/actions/browser-check-setup
        with:
          health-url: http://localhost:8899/staff/index.html
      - name: 跑第 ${{ matrix.part }}/2 半
        run: node tools/check-staff-page.mjs
        env:
          PART: ${{ matrix.part }}
      - if: matrix.part == 1
        run: python3 tools/check-html.py staff/index.html

  gamebot:
    name: 手机游戏脚本
    needs: decide
    if: needs.decide.outputs.gamebot == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check-gamebot.py
      # 步骤引擎的实跑测试：把安卓 API 打桩，用假屏幕真跑一遍 daily-login.js。
      # 语法检查看不出「板块失败会不会把后面带塌」这类行为问题，这个看得出。
      - run: node tools/check-gamebot-logic.mjs

  # 总闸：给分支保护用的唯一一个必过项目。
  #
  # 为什么需要它（2026-08-11）：上面十个 job 会按改动路径跳过用不到的，而分支保护
  # 若直接指定某个 job（例如「HTML 结构」），碰到那个 job 被跳过的 PR 就永远等不到
  # 它回报，PR 从此卡死。所以改成：分支保护只要求这一个 job，由它去看别人的结果。
  #
  # 判定：只要有任何一项 failure 或 cancelled 就红；skipped 不算失败（那是「这次
  # 不需要跑」，不是「没通过」）。`if: always()` 让它在前面有人红时照样执行——
  # 少了这一句，前面一红它会跟着被跳过，分支保护就永远等不到结果。
  all-green:
    name: all-green
    if: always()
    # 这一串必须列满同一个文件里的每个 job：漏掉的那项红了总闸照样绿、分支保护会放行
    # （2026-08-17 发现 fund 与 news 从来没被列进来）。已由 check-workflows.py 的
    # check_gate 断言守着，加 job 忘了回头改这里会在 CI 上被挡下。
    needs: [decide, html, secrets, pwa, ainote, declog, notify, morningpos, generated, rules, workflows, company, inventory, boss, staff, gamebot, fund, news, prices, weather]
    runs-on: ubuntu-latest
    steps:
      # 把判定用的原始值印出来。理由见 diagnosis.md：「绿灯本身要先被验证」——
      # 表达式写错时总闸会变成永远绿，那比没有总闸更危险，而光看结果看不出来。
      # 有了这行，任何一次运行都能直接核对「它看到的结果」和「它的判定」对不对得上。
      # 表达式一律走 env，不要直接插进 run: 的文字里。两个理由：
      # (1) `run: |` 是字面块，里面的 '' 不是「转义的单引号」而是两个引号，
      #     送进 GitHub 表达式解析器就是语法错误，整个文件变成「解析不了」
      #     （2026-08-11 踩过：名字显示成 .github/workflows/checks.yml）；
      # (2) toJSON 出来是多行含引号的 JSON，插进 shell 会把命令拆坏。
      - name: 印出各项结果（供核对）
        env:
          NEEDS: ${{ toJSON(needs) }}
          HAS_FAILURE: ${{ contains(needs.*.result, 'failure') }}
          HAS_CANCELLED: ${{ contains(needs.*.result, 'cancelled') }}
        run: |
          echo "各项结果：$NEEDS"
          echo "有 failure：$HAS_FAILURE"
          echo "有 cancelled：$HAS_CANCELLED"
      - name: 有任何一项没过就红
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "有检查没通过，点进这次 Checks 看是哪一项红的。"
          exit 1
      - name: 全部通过
        run: echo "全部通过（这次跳过的项目不算失败）"
