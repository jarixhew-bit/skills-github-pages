# 上线烟雾测试：每天确认线上页面（含各 PWA 的 Service Worker 档）真的是 main 里的那一版。
#
# 为什么需要它：CI 全绿只代表「代码进了 main」，不代表「线上换成了新版」。
# 2026-07 发生过 GitHub 故障期间 Pages 部署事件被整个丢掉——代码在 main、
# 检查全绿、线上还是旧版，最后是用户自己发现的（.claude/playbook/diagnosis.md）。
# 这里是每天的常驻守卫；合并后的即时验证 Claude 可在本地跑 check-live.py
# （2026-11-05 起网页版容器白名单含 github.io，见 publish-pages 第 6 步）。
#
# 放 CI 而不是 Claude 定时任务：检测不需要判断力，零 Claude 用量；
# 真的出事才开 issue 叫人上场（同 rules-check.yml 的取舍）。
name: Live Site Check

on:
  schedule:
    # 每天 UTC 01:30（柬埔寨 UTC+7 早上 08:30 前后），一天一次够用。
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: live-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 跑上线烟雾测试
        id: check
        run: |
          if python3 tools/check-live.py > result.txt 2>&1; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
            cat result.txt
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
            cat result.txt
          fi

      # 状态交给 tools/ci-notify.py：出事→没开过就开、开着就补评论；恢复→自动关掉旧 issue 并留言「已恢复」。
      # （2026-11-12 之前只开不关，而且「已有就 exit 0」——旧 issue 不关，下一次真出事就不会再通知。）
      - name: 出事开 issue／补评论，恢复自动关
        if: always() && steps.check.outputs.failed != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FAILED: ${{ steps.check.outputs.failed }}
        run: |
          if [ "$FAILED" = "true" ]; then STATE=bad; else STATE=ok; fi
          {
            echo "每日烟雾测试发现线上页面与 main 对不上："
            echo
            echo '```'
            cat result.txt
            echo '```'
            echo
            echo "## 怎么读这份报告"
            echo
            echo "- **✗ 打不开**：网址坏了或页面被删，先确认那个文件还在 main 里。"
            echo "- **! 是旧版**：代码在 main 但线上没换过来，多半是 Pages"
            echo "  部署事件被吞掉了。重跑别的 workflow **不会**补触发部署，"
            echo "  要到 Actions 页面手动重跑 pages-build-deployment："
            echo "  https://github.com/jarixhew-bit/skills-github-pages/actions"
            echo
            echo "自己看当前状况：\`python3 tools/check-live.py\`（本地或网页版容器都能跑）"
          } > body.md
          python3 tools/ci-notify.py --title "线上页面有问题（每日烟雾测试）" \
            --state "$STATE" --body-file body.md --comment-existing \
            --tg-bad "线上页面跟 main 对不上（每日烟雾测试），详情见 GitHub issue。" \
            --tg-ok "线上页面已恢复正常（每日烟雾测试通过）。" || true

      - name: 失败时让这次 run 显示红灯
        if: steps.check.outputs.failed == 'true'
        run: exit 1
