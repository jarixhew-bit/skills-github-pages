# 临时：合并前在功能分支上实跑查航班工具（workflow_dispatch 要文件在 main 才能触发）。合并前删除。
name: flight-probe-tmp
on:
  push:
    branches: [claude/flight-search-planning-2pmpag]
    paths: [.github/workflows/flight-probe-tmp.yml, tools/flight-probe.mjs]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - run: node tools/check-flight-probe.mjs
      - name: CGK-KTI
        run: node tools/flight-probe.mjs --from CGK --to KTI --date 2026-11-16 --out "$RUNNER_TEMP/a"
      - name: smoke SIN-KUL
        if: always()
        run: node tools/flight-probe.mjs --from SIN --to KUL --date "$(date -u -d '+30 days' +%F)" --smoke
      - name: adults 2 + airline MH
        if: always()
        run: node tools/flight-probe.mjs --from CGK --to PEN --date 2026-11-16 --adults 2 --airline MH
