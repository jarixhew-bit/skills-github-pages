# 减脂训练 App 的真人示范影片体检（影片是别人的 YouTube 片，会悄悄失效）。
# 每周一自动验「正在用的」那几支，失效才开 issue；零 Claude 用量。
# 手动跑 mode=report：验全部候选，并把每支影片的三格截图拼成对照图提交回触发分支，
# 让 Claude 亲眼看影片内容对不对（沙盒连不上 YouTube）。对照图是暂存档，合并前删掉。
name: Fitness videos

on:
  schedule:
    - cron: '20 1 * * 1'
  # 功能分支上改了影片清单 → 自动跑 report（手动触发要等 workflow 进了 main 才能用）
  push:
    branches-ignore: [main]
    paths: ['fitness/videos.json']
  workflow_dispatch:
    inputs:
      mode:
        description: "check＝只验正在用的；report＝验全部候选并产出截图对照图"
        required: false
        default: "check"
        type: choice
        options: [check, report]

permissions:
  contents: write
  issues: write

jobs:
  videos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 体检
        id: scan
        if: github.event_name != 'push' && github.event.inputs.mode != 'report'
        run: |
          if python3 tools/check-fitness-videos.py > result.txt 2>&1; then
            echo "broken=false" >> "$GITHUB_OUTPUT"
          else
            echo "broken=true" >> "$GITHUB_OUTPUT"
          fi
          cat result.txt

      - name: 失效则开 issue 通知
        if: steps.scan.outputs.broken == 'true' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="健身 App 示范影片失效（每周体检）"
          {
            echo "健身 App 有示范影片打不开了（作者删片或关了嵌入）。打开那个动作会看到「无法播放」，"
            echo "但照片／3D 示范还在，不影响训练。"
            echo
            echo '```'
            head -c 60000 result.txt
            echo '```'
            echo
            echo "跟 Claude 说一句「修一下健身 App 失效的影片」即可。"
          } > body.md
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" \
                       --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file body.md
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi

      - name: 体检失败要亮红灯
        if: steps.scan.outputs.broken == 'true'
        run: exit 1

      - name: 产出候选对照图
        if: github.event_name == 'push' || github.event.inputs.mode == 'report'
        run: |
          set -o pipefail
          python3 -m pip install --quiet pillow
          python3 tools/check-fitness-videos.py --report | tee report.txt

      - name: 把对照图提交回分支
        if: (github.event_name == 'push' || github.event.inputs.mode == 'report') && github.ref_name != 'main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f .photos/videos
          git commit -m "健身影片候选对照图（自动产生的暂存档）" || exit 0
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
