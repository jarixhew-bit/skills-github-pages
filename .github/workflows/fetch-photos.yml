name: Fetch place photos

# 抓 Google 地图的地点照片给手册卡片用（沙盒连不上 Google，只能在 CI 抓）。
# 抓取逻辑在 tools/fetch-photos.js，每家店进照片图库抓 5 张以上不重复照片。

on:
  workflow_dispatch:
    inputs:
      queries:
        description: "地图链接或店名，用 | 分隔"
        required: true
      want:
        description: "每家店要几张不重复照片"
        required: false
        default: "5"

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Playwright
        run: |
          npm i -g playwright@1.47.0
          npx playwright@1.47.0 install --with-deps chromium

      - name: Run scraper
        env:
          QUERIES: ${{ github.event.inputs.queries }}
          WANT: ${{ github.event.inputs.want }}
        run: |
          export NODE_PATH=$(npm root -g)
          node tools/fetch-photos.js | tee photos-output.txt

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photos
          path: photos-output.txt
