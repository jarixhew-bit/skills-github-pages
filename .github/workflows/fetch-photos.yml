name: Fetch place photos

# 抓 Google 地图的地点照片给手册卡片用（沙盒连不上 Google，只能在 CI 抓）。
# 抓取逻辑在 tools/fetch-photos.mjs，每家店进照片图库抓 5 张以上不重复照片。

on:
  workflow_dispatch:
    inputs:
      queries:
        description: "地图链接或店名，用 | 分隔"
        required: true
      want:
        description: "每家店要几张不重复照片"
        required: false
        default: "5"

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 缓存 Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: 装 playwright
        run: |
          npm install
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" != "true" ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install-deps chromium
          fi

      # pipefail 不可省：没有它时 `node ... | tee` 的退出码取自 tee，
      # 抓取脚本崩溃了这一步照样显示成功，绿灯是假的（2026-08-11 踩过）。
      - name: Run scraper
        env:
          QUERIES: ${{ github.event.inputs.queries }}
          WANT: ${{ github.event.inputs.want }}
        run: |
          set -o pipefail
          node tools/fetch-photos.mjs | tee photos-output.txt

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photos
          path: photos-output.txt
