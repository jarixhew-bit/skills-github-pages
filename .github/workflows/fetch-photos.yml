name: Fetch place photos

# 抓地点照片给手册卡片用（沙盒连不上 Google 与高德，只能在 CI 抓）。
# 抓取逻辑：Google 走 tools/fetch-photos.mjs（进照片图库抓），
# 高德走 tools/fetch-photos-amap.mjs（大陆中小店家 Google 常常无图，高德才有）。

on:
  workflow_dispatch:
    inputs:
      queries:
        description: "地图链接或店名，用 | 分隔"
        required: true
      want:
        description: "每家店要几张不重复照片"
        required: false
        default: "5"
      measure_only:
        description: "菜单过滤只量不改（校准用，填 true）"
        required: false
        default: "false"
      source:
        description: "从哪抓：google（预设）或 amap（大陆店家 Google 常常没图）"
        required: false
        default: "google"
        type: choice
        options: [google, amap]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 缓存 Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: 装 playwright
        run: |
          npm install
          # 不看 cache-hit 决定装不装浏览器：缓存键是 package.json 的哈希，而
          # package.json 里写的是 "playwright": "^1.62.1"（浮动版本、仓库没有 lock 档），
          # 所以 package.json 没变、npm 却可能装上新版 playwright——缓存「命中」，
          # 里面却是旧版的浏览器，脚本一启动就报「Please run npx playwright install」，
          # 整轮抓图产出空文件（2026-09-17 踩过，当时正在抢修全页破图）。
          # install 在浏览器已经就位时是秒过的，所以无条件跑才是对的。
          npx playwright install --with-deps chromium

      # pipefail 不可省：没有它时 `node ... | tee` 的退出码取自 tee，
      # 抓取脚本崩溃了这一步照样显示成功，绿灯是假的（2026-08-11 踩过）。
      - name: Run scraper
        env:
          QUERIES: ${{ github.event.inputs.queries }}
          WANT: ${{ github.event.inputs.want }}
        run: |
          set -o pipefail
          # 高德那条通道是给「Google 上一张照片都没有」的大陆店家用的
          # （2026-08-22 第稻客家菜馆，四组关键字全抓回别家同名店）。
          if [ "${{ github.event.inputs.source }}" = "amap" ]; then
            node tools/fetch-photos-amap.mjs | tee photos-output.txt
          else
            node tools/fetch-photos.mjs | tee photos-output.txt
          fi

      # 看图关卡：把「菜单照」排到每家最后（2026-09-19 用户要求「店＋食物，不要菜单」）。
      # 抓图器已改从「Food & drink」分类取图，但商场/庙/电玩城没有那个页签，
      # Google 自己也会把菜单归进食物分类，所以再用 OCR 数一次字：
      # 满屏文字＋一排价格＝菜单。Claude 看不到这些图（沙盒连不上 Google），
      # 但认字不需要审美，交给这台机器数。
      - name: 装 OCR
        if: ${{ github.event.inputs.source != 'amap' }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-chi-sim

      - name: 把菜单照排到最后
        if: ${{ github.event.inputs.source != 'amap' }}
        run: python3 tools/photo-filter.py photos-output.txt ${{ github.event.inputs.measure_only == 'true' && '--measure' || '' }}

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photos
          path: photos-output.txt

      # 结果同时提交回触发分支。artifact 要登录才能下载、日志尾部又常被
      # 收尾步骤淹掉，两条路 Claude 在沙盒里都读不到；提交回分支它 git pull
      # 就能拿到完整结果。这是暂存档，合并回 main 前要删掉。
      - name: 把结果提交回分支
        if: always() && github.ref_name != 'main'
        run: |
          # 抓取失败时产出的是空文件，照样 commit 会让人以为「抓到了但结果是空的」，
          # 而真相是根本没跑起来——2026-09-17 就这样多绕了一圈。空的就不提交。
          if [ ! -s photos-output.txt ]; then
            echo "抓图结果是空的，不提交（上一步应该已经报错，去看 Run scraper 那步的日志）"
            exit 0
          fi
          mkdir -p .photos
          cp photos-output.txt .photos/latest.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # -f 不可省：.photos/ 在 .gitignore 里（这是暂存档、不进 main），
          # 不加 -f 的话 git add 直接失败、整个任务红灯，明明图已经抓到了
          # （2026-08-19 踩过：SkyPark 那次抓图成功却显示 failure）。
          git add -f .photos/latest.txt
          git commit -m "抓图结果（自动产生的暂存档）" || exit 0
          git push origin HEAD:${{ github.ref_name }}
