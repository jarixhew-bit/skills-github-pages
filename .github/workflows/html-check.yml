# HTML 结构自动把关：每个改动 HTML 的 PR / push 都会跑 tools/check-html.py。
# 目的：哪怕改页面的模型忘了规则（div 平衡、siteLangUser 统一 key），
# CI 也会把不合格的改动拦在合并之前。零 Claude 用量消耗。
name: HTML Structure Check

on:
  pull_request:
    paths:
      - "**/*.html"
      - "tools/check-html.py"
      - "tools/jargon-whitelist.txt"
  # 只在推上 main 之后再验一次（合并后的安全网）。
  # 分支上的验证由下面的 pull_request 负责——两个都开着的话，同一份代码会跑两遍
  # （推分支一遍、开 PR 又一遍），白烧一倍时间。2026-08-11 收掉。
  push:
    branches: [main]
    branches: [main]
    paths:
      - "**/*.html"
      - "tools/check-html.py"
      - "tools/jargon-whitelist.txt"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check all HTML files
        run: python3 tools/check-html.py --all
