# HTML 结构自动把关：每个改动 HTML 的 PR / push 都会跑 tools/check-html.py。
# 目的：哪怕改页面的模型忘了规则（div 平衡、siteLangUser 统一 key），
# CI 也会把不合格的改动拦在合并之前。零 Claude 用量消耗。
name: HTML Structure Check

on:
  # 只挂 pull_request，不挂 push（2026-08-11 用户看到「一次出现 4 条」后收掉）：
  # 本仓库所有改动都走 PR，合并前已经验过一遍；再挂 push 的话，合并进 main 又跑一遍，
  # Actions 页面上每个改动就出现两批记录。要手动补跑用 Actions 页的 Run workflow。
  pull_request:
    paths:
      - "**/*.html"
      - "tools/check-html.py"
      - "tools/jargon-whitelist.txt"
      - '.github/workflows/html-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check all HTML files
        run: python3 tools/check-html.py --all
