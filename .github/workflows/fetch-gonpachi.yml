name: Fetch Gonpachi hours

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch official site
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          for u in "https://gonpachi.jp/shibuya/" "https://gonpachi.jp/en/shibuya/" "https://gonpachi.jp/"; do
            echo "########## $u"
            code=$(curl -s --max-time 30 -L -A "$UA" "$u" -o page.html -w "%{http_code}")
            echo "HTTP $code  bytes=$(wc -c < page.html)"
            python3 - <<'PY'
import re, html
try:
    s = open('page.html', encoding='utf-8', errors='replace').read()
except Exception as e:
    print('read fail', e); raise SystemExit
t = re.sub(r'<(script|style)[^>]*>.*?</\1>', ' ', s, flags=re.S | re.I)
t = re.sub(r'<[^>]+>', ' ', t)
t = html.unescape(t)
t = re.sub(r'[ \t　]+', ' ', t)
kws = ['営業時間', '営業', 'ランチ', 'ディナー', 'LUNCH', 'DINNER', 'L.O', 'ラストオーダー', '定休']
seen = set()
for m in re.finditer(r'\d{1,2}[:：]\d{2}', t):
    seg = re.sub(r'\s+', ' ', t[max(0, m.start() - 120): m.start() + 140].strip())
    if seg not in seen:
        seen.add(seg); print('TIME |', seg[:260])
for kw in kws:
    for m in re.finditer(re.escape(kw), t):
        seg = re.sub(r'\s+', ' ', t[max(0, m.start() - 100): m.start() + 200].strip())
        if seg not in seen:
            seen.add(seg); print(kw, '|', seg[:260])
        break
PY
          done
