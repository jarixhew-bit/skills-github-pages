# 密钥扫描：本仓库是公开仓库，任何 push / PR 都跑一次 tools/check-secrets.py，
# 防止误提交 API key、私钥等敏感信息。零 Claude 用量消耗。
name: Secrets Check

on:
  # 只挂 pull_request，不挂 push（2026-08-11 用户看到「一次出现 4 条」后收掉）：
  # 本仓库所有改动都走 PR，合并前已经验过一遍；再挂 push 的话，合并进 main 又跑一遍，
  # Actions 页面上每个改动就出现两批记录。要手动补跑用 Actions 页的 Run workflow。
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for hardcoded secrets
        run: python3 tools/check-secrets.py
