# 密钥扫描：本仓库是公开仓库，任何 push / PR 都跑一次 tools/check-secrets.py，
# 防止误提交 API key、私钥等敏感信息。零 Claude 用量消耗。
name: Secrets Check

on:
  pull_request:
  # 只在推上 main 之后再验一次（合并后的安全网）。
  # 分支上的验证由下面的 pull_request 负责——两个都开着的话，同一份代码会跑两遍
  # （推分支一遍、开 PR 又一遍），白烧一倍时间。2026-08-11 收掉。
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for hardcoded secrets
        run: python3 tools/check-secrets.py
