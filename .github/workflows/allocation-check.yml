# 配置偏离检查＋美国资产遗产税提醒（2026-10-29 建）：VOO / IBIT 市值占比偏离长期政策超过门槛就叫人。
# 政策在 trading/allocation-policy.json（只放目标，不放任何数量或金额）；
# 算法与自检在 tools/check-allocation.py。零 Claude 用量。
#
# 数据来源：解密 trading/data-private.enc（trading-daily 每小时用 Flex 刷新）。
# 刻意不另打 IBKR Flex——Flex 按 token 限流，多打一次就多一分踩 1018 的风险
# （见 .claude/notes/trading.md 的 1001/1018 条目）。
#
# 本仓库是公开的：Actions 日志与 issue 谁都看得到，所以脚本只印状态不印数字，
# issue 标题与内文也不含任何数字（tools/check-allocation.py --selftest 会拦）。
# 通知沿用 tools/ci-notify.py：坏了开 issue ＋ Telegram，已有就静默，好了自动关。
name: allocation-check

on:
  schedule:
    # 每月 1 号与 15 号 UTC 14:00（美股盘中，data-private.enc 已被当天的 trading-daily 刷过）
    - cron: '0 14 1,15 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: allocation-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet cryptography
      - name: 先跑自检（算法本身坏了就不要拿它的结论吓人）
        run: python3 tools/check-allocation.py --selftest
      - name: 算占比并判定（只印状态，不印数字）
        id: alloc
        env:
          ANALYZER_PW: ${{ secrets.ANALYZER_PW }}
        run: python3 tools/check-allocation.py --run --outdir "$RUNNER_TEMP/allocation"

      - name: 偏离通知（超限开 issue，回到范围内自动关）
        if: always() && steps.alloc.outputs.breach != '' && steps.alloc.outputs.breach != 'skip'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE: ${{ steps.alloc.outputs.breach }}
        run: |
          python3 tools/ci-notify.py \
            --title "$(python3 tools/check-allocation.py --text breach-title)" \
            --state "$STATE" --body-file "$RUNNER_TEMP/allocation/breach-body.md" \
            --tg-bad "$(python3 tools/check-allocation.py --text breach-tg-bad)" \
            --tg-ok "$(python3 tools/check-allocation.py --text breach-tg-ok)" || true

      - name: 数据缺失通知（Flex 失败等；同样不含数字）
        if: always() && steps.alloc.outputs.missing != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE: ${{ steps.alloc.outputs.missing }}
        run: |
          python3 tools/ci-notify.py \
            --title "$(python3 tools/check-allocation.py --text missing-title)" \
            --state "$STATE" --body-file "$RUNNER_TEMP/allocation/missing-body.md" \
            --tg-bad "$(python3 tools/check-allocation.py --text missing-tg-bad)" \
            --tg-ok "$(python3 tools/check-allocation.py --text missing-tg-ok)" || true

      # 美国资产遗产税提醒（2026-10-29 加）：同一份数据，独立 issue；文案同样不含数字
      - name: 美国资产超线通知（超线开 issue，回到线下自动关）
        if: always() && steps.alloc.outputs.us != '' && steps.alloc.outputs.us != 'skip'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE: ${{ steps.alloc.outputs.us }}
        run: |
          python3 tools/ci-notify.py \
            --title "$(python3 tools/check-allocation.py --text us-title)" \
            --state "$STATE" --body-file "$RUNNER_TEMP/allocation/us-body.md" \
            --tg-bad "$(python3 tools/check-allocation.py --text us-tg-bad)" \
            --tg-ok "$(python3 tools/check-allocation.py --text us-tg-ok)" || true

      - name: 美国资产检查缺数据通知
        if: always() && steps.alloc.outputs.usmissing != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE: ${{ steps.alloc.outputs.usmissing }}
        run: |
          python3 tools/ci-notify.py \
            --title "$(python3 tools/check-allocation.py --text us-missing-title)" \
            --state "$STATE" --body-file "$RUNNER_TEMP/allocation/us-missing-body.md" \
            --tg-bad "$(python3 tools/check-allocation.py --text us-missing-tg-bad)" \
            --tg-ok "$(python3 tools/check-allocation.py --text us-missing-tg-ok)" || true
