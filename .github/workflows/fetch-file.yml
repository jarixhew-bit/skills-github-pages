# 用 CI 把一个外部压缩包抓进仓库（沙盒出口代理挡掉该域名时的通道）。
#
# 为什么需要这个：Claude 的沙盒连不上 Higgsfield 的文件域名（cloudfront），生成好的
# 示范动图下载不回来；fetch-url.yml 只把网页文字打进日志，带不回二进制文件。
# 2026-11-10 做健身 App 真人示范动图时建立。
#
# 用法：在功能分支上提交 `.fetch/request.json` 再 push，内容：
#   {"url": "https://…/x.zip", "sha256": "<压缩包的 sha256>", "dest": "fitness/anim", "ext": [".webp"]}
# CI 下载、核对 sha256、只解出 ext 列出的扩展名到 dest，提交回同一个分支，并删掉请求档。
# 只在非 main 分支跑；网址只准白名单里的主机；dest 只准白名单里的目录。
name: Fetch file

on:
  push:
    branches-ignore: [main]
    paths: ['.fetch/request.json']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 下载、核对、解压
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, sys, urllib.parse, urllib.request, zipfile

          HOSTS = {"d2ol7oe51mr4n9.cloudfront.net", "d8j0ntlcm91z4.cloudfront.net"}
          DESTS = {"fitness/anim"}
          EXTS = {".webp", ".png", ".jpg"}

          req = json.load(open(".fetch/request.json"))
          url, want, dest = req["url"], req["sha256"].lower(), req["dest"].strip("/")
          exts = set(req.get("ext") or [".webp"])
          u = urllib.parse.urlparse(url)
          if u.scheme != "https" or u.hostname not in HOSTS:
              sys.exit(f"网址不在白名单：{u.hostname}")
          if dest not in DESTS:
              sys.exit(f"目的地不在白名单：{dest}")
          if not exts <= EXTS:
              sys.exit(f"扩展名不在白名单：{exts - EXTS}")

          raw = urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"}), timeout=120).read()
          got = hashlib.sha256(raw).hexdigest()
          print(f"[fetch] {len(raw):,} 字节 sha256 {got}")
          if got != want:
              sys.exit("sha256 对不上，不解压")

          n = 0
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              for info in z.infolist():
                  name = os.path.basename(info.filename)
                  if info.is_dir() or not name or os.path.splitext(name)[1].lower() not in exts:
                      print(f"[fetch] 跳过 {info.filename}")
                      continue
                  with open(os.path.join(dest, name), "wb") as f:
                      f.write(z.read(info))
                  n += 1
                  print(f"[fetch] 写入 {dest}/{name} {info.file_size:,} 字节")
          if not n:
              sys.exit("压缩包里没有可用的文件")
          PY

      - name: 提交回分支
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -q --cached .fetch/request.json
          rm -f .fetch/request.json
          git add -A fitness/anim
          if git diff --cached --quiet; then
            echo "没有变化，不提交"
            exit 0
          fi
          git commit -q -m "CI 抓回的文件（fetch-file）"
          if ! git push origin HEAD:${{ github.ref_name }}; then
            echo "推送失败（分支在这期间有新提交？）"
            exit 1
          fi
