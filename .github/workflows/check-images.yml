# 外链体检：手册的图片一律走 Google Places 外链、不进仓库（CLAUDE.md 媒体文件规则），
# 而外链会悄悄失效——页面还在、网址还通，只有打开的人看到破图，发手册的人不会知道。
# 2026-08-11 起除图片与地图外，也检查餐厅官网／tabelog：官网 404 通常等于**店歇业**，
# 是「该换这张卡片了」的早期警报（为免噪音，官网只有确定没了才算失效，见脚本注释）。
# 每周一自动扫一次全站外链，失效才开 issue 通知。零 Claude 用量消耗。
name: Check image links

on:
  schedule:
    # 每周一 UTC 01:00（柬埔寨 UTC+7 早上 08:00 前后）。
    - cron: '0 1 * * 1'
  workflow_dispatch:
    inputs:
      file:
        description: "只检查单一 HTML（留空 = 全站扫描）"
        required: false
        default: ""

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 扫描外链
        id: scan
        run: |
          FILE="${{ github.event.inputs.file }}"
          if [ -n "$FILE" ]; then
            TARGET="$FILE"
          else
            TARGET="--all"
          fi
          if python3 tools/check-images.py $TARGET > result.txt 2>&1; then
            echo "broken=false" >> "$GITHUB_OUTPUT"
          else
            echo "broken=true" >> "$GITHUB_OUTPUT"
          fi
          cat result.txt

      # 同一张卡里的重复照片（2026-11-05 用户抓到 Jewel 卡 1、2 号是同一张图）。
      # PR 上已由 checks.yml 把关；这里每周再扫一次，补上不经 PR 检查进来的改动
      # （例如机器人开的补图 PR 不会触发 pull_request 检查）。被 Google 挡时脚本自己罢工、不报红。
      - name: 同卡重复照片
        id: dupes
        if: github.event.inputs.file == ''
        run: |
          pip install --quiet pillow opencv-python-headless
          # 三种结果：通过→ok（关掉旧 issue）；退出码 1→bad；其余（被 Google 挡而罢工、缺套件）→
          # 不下结论，既不开也不关——罢工也是退出码 0，不能当成「已恢复」把旧 issue 关掉。
          rc=0
          python3 tools/check-photo-dupes.py > dupes.txt 2>&1 || rc=$?
          if [ "$rc" = "0" ] && grep -q "通过：没有卡片里有重复照片" dupes.txt; then
            echo "state=ok" >> "$GITHUB_OUTPUT"
          elif [ "$rc" = "1" ]; then
            echo "state=bad" >> "$GITHUB_OUTPUT"
          else
            echo "state=unknown" >> "$GITHUB_OUTPUT"
          fi
          cat dupes.txt

      # 状态交给 tools/ci-notify.py：有重复→没开过就开、开着就补评论；通过→自动关掉旧 issue 并留言「已恢复」。
      - name: 重复照片通知（有就开／补评论，好了自动关）
        if: github.event_name == 'schedule' && (steps.dupes.outputs.state == 'ok' || steps.dupes.outputs.state == 'bad')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE: ${{ steps.dupes.outputs.state }}
        run: |
          {
            echo "每周体检发现某张卡片里有两张照片是同一张图（网址不同、画面相同）。"
            echo
            echo '```'
            head -c 60000 dupes.txt
            echo '```'
            echo
            echo "跟 Claude 说一句「换掉重复的照片」即可。"
          } > body.md
          python3 tools/ci-notify.py --title "手册同一张卡里有重复照片（每周体检）" \
            --state "$STATE" --body-file body.md --comment-existing \
            --tg-bad "手册里有卡片出现重复照片（每周体检），详情见 GitHub issue。" \
            --tg-ok "手册重复照片已处理好，体检通过。" || true

      # 状态交给 tools/ci-notify.py：失效→没开过就开、开着就补评论；通过→自动关掉旧 issue 并留言「已恢复」。
      # （2026-11-12 之前只开不关：#417 修好后一直开着，分不清现在到底好没好。）
      - name: 外链失效通知（失效就开／补评论，好了自动关）
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BROKEN: ${{ steps.scan.outputs.broken }}
        run: |
          if [ "$BROKEN" = "true" ]; then STATE=bad; else STATE=ok; fi
          {
            echo "每周图片体检发现有外链失效。**页面本身没坏，是图片打不开**——"
            echo "家人打开手册会看到破图。"
            echo
            echo '```'
            head -c 60000 result.txt
            echo '```'
            echo
            echo "## 怎么处理"
            echo
            echo "跟 Claude 说一句「修一下失效的图片」即可。它会按 CLAUDE.md 的媒体文件规则"
            echo "重新抓 Google Places 图片链接替换（沙盒抓不到时走 fetch-photos.yml 这条 CI 通道）。"
            echo
            echo "自己重跑：Actions → Check image links → Run workflow"
          } > body.md
          python3 tools/ci-notify.py --title "手册图片链接失效（每周体检）" \
            --state "$STATE" --body-file body.md --comment-existing \
            --tg-bad "手册有图片／链接失效（每周体检），详情见 GitHub issue。" \
            --tg-ok "手册图片链接已恢复正常，每周体检通过。" || true
