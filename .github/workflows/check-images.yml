# 外链体检：手册的图片一律走 Google Places 外链、不进仓库（CLAUDE.md 媒体文件规则），
# 而外链会悄悄失效——页面还在、网址还通，只有打开的人看到破图，发手册的人不会知道。
# 2026-08-11 起除图片与地图外，也检查餐厅官网／tabelog：官网 404 通常等于**店歇业**，
# 是「该换这张卡片了」的早期警报（为免噪音，官网只有确定没了才算失效，见脚本注释）。
# 每周一自动扫一次全站外链，失效才开 issue 通知。零 Claude 用量消耗。
name: Check image links

on:
  schedule:
    # 每周一 UTC 01:00（柬埔寨 UTC+7 早上 08:00 前后）。
    - cron: '0 1 * * 1'
  workflow_dispatch:
    inputs:
      file:
        description: "只检查单一 HTML（留空 = 全站扫描）"
        required: false
        default: ""

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 扫描外链
        id: scan
        run: |
          FILE="${{ github.event.inputs.file }}"
          if [ -n "$FILE" ]; then
            TARGET="$FILE"
          else
            TARGET="--all"
          fi
          if python3 tools/check-images.py $TARGET > result.txt 2>&1; then
            echo "broken=false" >> "$GITHUB_OUTPUT"
          else
            echo "broken=true" >> "$GITHUB_OUTPUT"
          fi
          cat result.txt

      # 同一张卡里的重复照片（2026-11-05 用户抓到 Jewel 卡 1、2 号是同一张图）。
      # PR 上已由 checks.yml 把关；这里每周再扫一次，补上不经 PR 检查进来的改动
      # （例如机器人开的补图 PR 不会触发 pull_request 检查）。被 Google 挡时脚本自己罢工、不报红。
      - name: 同卡重复照片
        id: dupes
        if: github.event.inputs.file == ''
        run: |
          pip install --quiet pillow
          if python3 tools/check-photo-dupes.py > dupes.txt 2>&1; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
          cat dupes.txt

      - name: 有重复照片则开 issue
        if: steps.dupes.outputs.found == 'true' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="手册同一张卡里有重复照片（每周体检）"
          {
            echo "每周体检发现某张卡片里有两张照片是同一张图（网址不同、画面相同）。"
            echo
            echo '```'
            head -c 60000 dupes.txt
            echo '```'
            echo
            echo "跟 Claude 说一句「换掉重复的照片」即可。"
          } > body.md
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" \
                       --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file body.md
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi

      # 失效才开 issue。已有开着的同名 issue 就改为补一条评论，避免每周堆积。
      - name: 失效则开 issue 通知
        if: steps.scan.outputs.broken == 'true' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="手册图片链接失效（每周体检）"
          {
            echo "每周图片体检发现有外链失效。**页面本身没坏，是图片打不开**——"
            echo "家人打开手册会看到破图。"
            echo
            echo '```'
            head -c 60000 result.txt
            echo '```'
            echo
            echo "## 怎么处理"
            echo
            echo "跟 Claude 说一句「修一下失效的图片」即可。它会按 CLAUDE.md 的媒体文件规则"
            echo "重新抓 Google Places 图片链接替换（沙盒抓不到时走 fetch-photos.yml 这条 CI 通道）。"
            echo
            echo "自己重跑：Actions → Check image links → Run workflow"
          } > body.md
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" \
                       --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file body.md
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi
