# 老板月度报告页的自检（真浏览器）。
# 这一页是直接发给老板看的，错了不是「界面难看」而是「老板看到错的数」，
# 所以盯的是三条设计铁律：只读（没有任何能写的控件）、不看当月（当月的数还在动）、
# 一个数都不在这边算（总额必须是服务端送来的那个）。外加钥匙不能留在地址栏。
# 测试全程把 worker 请求拦下来假造返回，不打真实接口、不碰真实账目。
name: boss report check

on:
  push:
    paths:
      - 'boss-report/**'
      - 'tools/check-boss-report.mjs'
      - '.github/workflows/boss-report-check.yml'
  pull_request:
    paths:
      - 'boss-report/**'
      - 'tools/check-boss-report.mjs'
  workflow_dispatch:

# 同一个分支上 push 与 pull_request 会各触发一次，这个检查要装 Chromium（约 1 分钟），
# 跑两遍纯属浪费。新的一跑就取消同组里还没跑完的旧的。
concurrency:
  group: boss-report-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 装 playwright
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: 起本地服务器
        run: |
          # 输出必须重定向、还要 disown：后台进程只要还占着这个步骤的 stdout，
          # Actions 就会一直等它、整个步骤挂住不结束。
          nohup python3 -m http.server 8899 > /tmp/httpserver.log 2>&1 &
          disown || true
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://localhost:8899/boss-report/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:8899/boss-report/ \
            || { echo "本地服务器没起来"; cat /tmp/httpserver.log; exit 1; }
      - name: 跑老板报告页自检
        run: node tools/check-boss-report.mjs
      - name: HTML 结构检查
        run: python3 tools/check-html.py boss-report/index.html
