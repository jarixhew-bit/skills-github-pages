# AI 点评防编造逻辑把关：改动 ai_note.py 或其自检脚本时自动跑。
# 目的：这道防线拦的是「模型把一个不存在的金额写上私密页」，一旦被放宽就没人会发现，
# 所以让 CI 在合并前挡住。零 Claude 用量消耗。
name: AI Note Guard Check

on:
  # 只挂 pull_request，不挂 push（2026-08-11 用户看到「一次出现 4 条」后收掉）：
  # 本仓库所有改动都走 PR，合并前已经验过一遍；再挂 push 的话，合并进 main 又跑一遍，
  # Actions 页面上每个改动就出现两批记录。要手动补跑用 Actions 页的 Run workflow。
  pull_request:
    paths:
      - "trading/ai_note.py"
      - "tools/check-ai-note.py"
      - '.github/workflows/ai-note-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet cryptography
      - run: python3 tools/check-ai-note.py
