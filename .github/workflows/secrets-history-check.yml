# git 历史密钥月度扫描：每月 1 号跑 tools/check-secrets.py --history。
#
# 跟每个 PR 都跑的秘钥扫描（checks.yml 里的 secrets job）分开的原因：那个只看当前文件，**从文件里删掉的
# 密钥它查不到**。本仓库是公开的，历史永久可查——2026-08-05 就是这样发现一把早已从
# 旅游手册页面删除、却仍留在历史里的 Google Maps key。
# 历史扫描要读全部 blob（本仓库约 5 千个，几秒钟），不值得每次 push 都跑，每月一次足够。
#
# 零 Claude 用量：检测放 CI，只有「这把 key 该轮换还是该登记白名单」这种需要判断力的
# 部分才叫人（或 Claude）上场。
name: Secrets History Check

on:
  schedule:
    # 每月 1 号 UTC 02:00，跟 rules-check 的 01:00 错开一小时
    - cron: '0 2 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # 历史扫描必须拿到完整历史，默认的浅克隆只有最近一个提交
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 扫描 git 历史
        id: check
        run: |
          if python3 tools/check-secrets.py --history > result.txt 2>&1; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            cat result.txt
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            # 命中数写进输出，但**不把 key 原文放进 issue**——本仓库是公开的，
            # issue 也是公开的，没必要再把它复制一份到更显眼的地方
            COUNT=$(grep -c '✗' result.txt || echo "?")
            echo "count=$COUNT" >> "$GITHUB_OUTPUT"
            echo "发现 $COUNT 个可疑项（详情不打进公开日志，本地跑一次即可看到）"
          fi

      - name: 有可疑项则开 issue 通知
        if: steps.check.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="git 历史里有待确认的密钥（月度扫描）"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" \
                       --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "已有开着的 issue #$EXISTING，本月不重复开。"
            exit 0
          fi
          {
            echo "月度历史扫描发现 **${{ steps.check.outputs.count }} 个**待确认的密钥形态字串。"
            echo
            echo "具体是哪些**故意不写在这里**——本仓库和 issue 都是公开的，"
            echo "没必要把它们再复制一份到更显眼的位置。本地跑一次就能看到："
            echo
            echo '```'
            echo "python3 tools/check-secrets.py --history"
            echo '```'
            echo
            echo "## 怎么处理"
            echo
            echo "对每一条判断它属于哪种："
            echo
            echo "- **本来就该公开的**（Firebase 网页 apiKey、Google Maps 前端 key 这类"
            echo "  设计上要发给浏览器的）→ 登记进 \`tools/secrets-whitelist.txt\`，"
            echo "  并写清楚「为什么公开也没事」。注意 Maps key 仍要在 Google Cloud"
            echo "  后台加 HTTP 引用来源限制和用量上限，否则别人捡去用、账单算你的。"
            echo "- **真正的密钥**（服务端 API key、私钥）→ 先去对应后台**吊销并换新**，"
            echo "  再把旧值登记进白名单并注明「已于 YYYY-MM-DD 吊销」。"
            echo "  改历史（filter-repo）意义不大：公开仓库一旦被人抓取过就收不回来，"
            echo "  吊销才是真正有效的动作。"
            echo
            echo "跟 Claude 说一句「处理一下历史密钥扫描的 issue」它会照上面走。"
          } > body.md
          gh issue create --title "$TITLE" --body-file body.md
