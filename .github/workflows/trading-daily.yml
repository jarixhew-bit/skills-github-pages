name: trading-daily
# 股票交易分析器数据更新：抓行情 → 算信号 → 提交到 main（GitHub Pages 自动发布）
# 私密区加密需要仓库 Secret: ANALYZER_PW（缺失时只更新公开信号区）

on:
  schedule:
    # 仅美股交易时段内每小时跑一次：UTC 13:00-21:00（≈ 美东 9:00-17:00，覆盖开盘到收盘后缓冲）。
    # 用户 2026-07-18 要求周一至五每小时更新一次（用于 HTML 分析页），非交易时段不跑省 Actions 分钟数。
    # 同一小时内多次运行天然形成冗余，不再需要额外的次日补漏跑。
    - cron: '0 13-21 * * 1-5'
  workflow_dispatch:
    inputs:
      force_ai_note:
        description: '重新生成今天的 AI 点评（平时每天只生成一次，勾选可覆盖当天已有的）'
        type: boolean
        default: false
      force_flex:
        description: '这次也抓 IBKR 持仓（会消耗 Flex token 额度，只在确认要验证同步时勾）'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write          # Flex 持续失败时开 issue 叫人（见最后一个步骤）
  statuses: write        # 自己跑完检查后给数据 commit 盖 all-green（见「提交数据」）
  # 刻意不要 pull-requests 权限：这个流程不开 PR。开 PR 那条路已经证实
  # 会被仓库开关卡死（见「提交数据」步骤的注释），别再退回去。

concurrency:
  group: trading-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet cryptography requests feedparser
      - name: 抓取行情
        run: python trading/fetch_prices.py
      # 不阻断是对的（沿用旧底数比停更好），但**不能静默**：
      # 同一个 Flex 故障 2026-07、2026-08 初、2026-08-11 复发三次，每次都是
      # 工作流全绿、持仓底数偷偷停更，等用户自己发现。所以失败要写进步骤摘要
      # 与输出，由后面的步骤决定要不要开 issue 叫人。
      # 一天只在两个时段抓，不再每小时抓（2026-08-12 改）：
      # IBKR 按 token 限流，原本 9 次/天 × 4 次重试 = 约 36 次请求，加上早报
      # 共约 40 次，远超额度 → 一直回 1001（ndcdyn 主机才明说是 1018 超标）。
      # 而**持仓一天之内根本不会变**，每小时抓是纯浪费；抓不到时 analyzer 会
      # 沿用 state.enc 里的底数，页面不受影响。
      # 留两个时段（开盘后、收盘后）是为了留一次补救机会，不是为了更即时。
      # 抓持仓的节奏：**每小时试一次，抓到就停**（2026-08-12 定案，用户要求恢复每小时）。
      #
      # 为什么「抓到就停」不损失任何东西：Flex Query 的周期是 LastBusinessDay，
      # 给的是上一个交易日收盘的持仓——同一天抓第二次，拿到的数据一模一样。
      # 所以每小时抓在信息上是零收益，只是白烧请求。
      #
      # 但每小时「试」是有意义的：它就是重试机制本身。之前的写法是在同一次运行里
      # 连打 4 次（间隔 30 秒），那才是把偶发放大成永久故障的凶手；现在改成
      # 「这次不行，下个小时再来」，一天的请求数封顶在 9 次（一发就中则只有 1 次），
      # **失败不再产生额外流量**，所以循环点不着。
      #
      # 手动触发默认不抓（当天踩过：排查时手动跑七八次，每次都烧请求）；要抓得勾 force_flex。
      - name: 判断这次要不要抓持仓
        id: needflex
        run: |
          TODAY=$(date -u +%F)
          MARK=trading/.flex-fetched
          if [ "${{ inputs.force_flex }}" = "true" ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
            echo "这次要抓持仓（手动勾了 force_flex，会忽略「今天已抓到」的标记）"
          elif [ "$(cat $MARK 2>/dev/null)" = "$TODAY" ]; then
            echo "yes=false" >> "$GITHUB_OUTPUT"
            echo "今天（$TODAY）已经抓到过持仓了，跳过——同一天再抓拿到的是同一份数据。"
          else
            echo "yes=true" >> "$GITHUB_OUTPUT"
            echo "今天还没抓到持仓，这次试一次（不成功就下个小时再来，本次不重试）。"
          fi

      - name: IBKR Flex 账户同步（持仓/现金/净值，失败不阻断）
        id: flex
        if: steps.needflex.outputs.yes == 'true'
        env:
          IBKR_FLEX_TOKEN: ${{ secrets.IBKR_FLEX_TOKEN }}
          IBKR_FLEX_QUERY_ID: ${{ secrets.IBKR_FLEX_QUERY_ID }}
        run: |
          # pipefail 不可省：没有它，退出码取自 tee，Flex 崩了也会判成成功
          set -o pipefail
          if python trading/flex_account.py 2>&1 | tee flex.log; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            {
              echo "### ⚠ IBKR Flex 同步失败——持仓底数没有更新"
              echo
              echo '行情与信号照常更新，但持仓/现金/净值沿用上一次的底数。'
              echo
              echo '```'
              tail -20 flex.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
        continue-on-error: true
      # 新闻抓取（2026-08-16 加）。失败不阻断：新闻是加值资讯，抓不到就沿用上一份
      # （页面自己会按 generated_at 标示已过时），绝不该因为某个 RSS 源挂了
      # 就让整条行情管线红掉。
      #
      # **必须排在分析管线之前**（2026-08-16 调整）：analyzer 会读 news.json 算新闻
      # 因子与新闻量异常。摆在后面的话，analyzer 每次读到的都是上一小时的旧新闻，
      # 当天刚出的消息要等下一轮才进得了打分。
      - name: 抓新闻（失败不阻断）
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AGNES_MODEL: ${{ secrets.AGNES_MODEL }}
          AGNES_BASE_URL: ${{ secrets.AGNES_BASE_URL }}
        run: python .github/scripts/fetch_news.py || echo "新闻抓取失败，沿用上一份"
        continue-on-error: true

      - name: 运行分析管线
        env:
          ANALYZER_PW: ${{ secrets.ANALYZER_PW }}
        run: python trading/analyzer.py

      - name: 生成 AI 点评（Agnes，每天首次运行才生成，失败不阻断）
        env:
          ANALYZER_PW: ${{ secrets.ANALYZER_PW }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          # 下面两个是可选覆盖：不填就用 ai_note.py 里的默认值（与 butler-bot 一致）
          AGNES_MODEL: ${{ secrets.AGNES_MODEL }}
          AGNES_BASE_URL: ${{ secrets.AGNES_BASE_URL }}
          AI_NOTE_FORCE: ${{ inputs.force_ai_note && '1' || '' }}
        run: python trading/ai_note.py || echo "点评生成失败，沿用上次点评"
      # 数据怎么进 main（2026-08-12 定案，走了三轮才对）：
      #   第一轮 直接推 main → 被 required status check「all-green」挡下，
      #          因为直接推的 commit 身上没有这个状态。
      #   第二轮 改成机器人开 PR 自动合并 → 撞上 GitHub 的两道限制：
      #          (a) GITHUB_TOKEN 开的 PR 不触发任何 workflow，所以永远等不到
      #              all-green（要自己跑检查自己盖章，见下）；
      #          (b) 「Allow GitHub Actions to create and approve pull requests」
      #              这个仓库开关一关，gh pr create 直接报 not permitted——
      #              2026-08-12 03:59 就是这样挂的。**功能依赖一个人手开关，
      #              就等于随时会再坏一次。**
      #   第三轮（现在）不开 PR 了。GitHub 官方文档写明 required_status_checks
      #          的正规用法就是：先把 commit 推到别的分支 → 状态盖上去 →
      #          再直接推到受保护的 ref。SHA 不变，状态跟着走。
      # 好处：不依赖任何仓库开关、不需要 pull-requests 权限、不再每小时刷一个
      # PR 记录，而保护规则一条都没放宽（没盖章的 commit 照样推不进 main）。
      - name: 提交数据
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "trading-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trading/history trading/data-public.json trading/data-private.enc \
                  trading/state.enc trading/.flex-fetched trading/news.json trading/news-history.json
          # 提交判据：history 或 state.enc 有实质变化就提交。data-public.json/data-private.enc
          # 都含 generated_at 时间戳，每次运行必有差异，不能单独作为判据；但 state.enc
          # 不含时间戳，只要 Flex 刷新了持仓/现金/NAV 就会变——2026-07-14 曾发生 Flex
          # 拉到修正后的持仓但当天行情已抓过、history 无新增，导致修正被判据吞掉不提交
          # 注：state.enc 采用随机 salt/nonce 加密，即使底层数据完全不变，密文也会每次不同，
          # 因此改为每小时运行后，本步骤基本每次都会判定为「有变化」并提交——这是预期行为
          # （用户 2026-07-18 要求的就是 HTML 页面每小时刷新），不是 bug。
          # .flex-fetched 必须列进判据：它是「今天已抓到」的标记，不提交上去
          # 下一个小时就读不到，等于每小时都重抓——正好是要避免的那件事。
          if git diff --cached --quiet -- trading/history trading/state.enc trading/.flex-fetched; then
            echo "行情与持仓底数均无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(trading): hourly data update $(date -u +'%F %H:00 UTC')"
          # 运行期间 main 可能有新合并（2026-07-12 曾因此推送被拒），rebase 后再推
          git fetch origin main
          git rebase origin/main

          # 安全阀（盖章之前先查）：机器人只被允许认证**纯 trading/ 数据**的
          # 改动。碰到任何其他路径就停下来不盖章——那种改动该走人工 PR、
          # 跑完整的 checks.yml。这一条是整个自动盖章机制的唯一防线，别拿掉。
          CHANGED=$(git diff --name-only origin/main...HEAD)
          if echo "$CHANGED" | grep -qv '^trading/'; then
            echo "::error::这次改动碰到 trading/ 以外的文件，机器人不自己盖章："
            echo "$CHANGED" | grep -v '^trading/'
            exit 1
          fi

          # ci-decide.py 对纯 trading/ 数据改动只选出「秘钥扫描」一项，
          # 其余八项与这些文件无关（2026-08-12 用它的实际规则验证过）。
          # 盖 all-green 的资格就来自这一行**实跑**，不是凭空盖的。
          python3 tools/check-secrets.py

          # 三步一轮，整轮重试。**不能只重试最后那一下 push**：一旦中途 rebase，
          # HEAD 就是新的 SHA，旧 SHA 上的状态跟不过来，重试必然再被拒。
          BRANCH="bot/trading-data"
          for i in 1 2 3; do
            # (1) 推到暂存分支——目的只是让这个 SHA 在服务端存在，
            #     否则没有对象可以挂状态（状态挂在 commit 上，不是分支上）
            git push -f origin "HEAD:refs/heads/$BRANCH"

            # (2) 给这个 SHA 盖 all-green
            SHA=$(git rev-parse HEAD)
            gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
              -f state=success -f context=all-green \
              -f description="行情数据更新：已实跑 check-secrets"

            # (3) 带着状态直接快转推 main。状态写入到规则引擎认账之间有几秒
            #     延迟，第一轮被拒是正常的
            sleep 5
            if git push origin HEAD:main; then
              echo "已推进 main（第 $i 轮）"
              PUSHED=1
              break
            fi

            echo "推送被拒，重新对齐 main 后再来一轮…"
            git fetch origin main
            git rebase origin/main || exit 1
          done
          if [ -z "$PUSHED" ]; then
            echo "::error::盖了 all-green 仍推不进 main，请检查 main 的保护规则"
            exit 1
          fi

          # 暂存分支用完就删，不留痕迹（bot/* 不在保护规则范围内，删得掉）
          git push origin --delete "$BRANCH" || true

      # 这个工作流本身坏了要有人知道——**这才是这次故障拖一个多星期的病根**。
      # 08-11 21:17 起每小时红一次，红记录躺在 Actions 页面上没人会去翻，
      # 用户是隔了一星期自己发现数据不动才来问的。用户看的是 Telegram，
      # 所以状态变化要送到那里；去重与开关 issue 的逻辑在 tools/ci-notify.py。
      - name: 工作流失败通知
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # job.status 在最后一步读到的就是「前面所有步骤跑完的结果」。
          # Flex 那一步是 continue-on-error，不会让 job 变红——它自己有独立通知。
          if [ "${{ job.status }}" = "success" ]; then STATE=ok; else STATE=bad; fi
          {
            echo "\`trading-daily\` 跑失败了，**股票分析页的数据停止更新**。"
            echo
            echo "出事的这一次：$RUN_URL"
            echo
            echo "先看是哪一步红的。历史上最常见的两类："
            echo "- **推不进 main**——保护规则要求 commit 身上有 \`all-green\` 状态。"
            echo "  正常流程是「推暂存分支 → statuses API 盖章 → 直推 main」，"
            echo "  这一段坏了会卡在「提交数据」那一步（2026-08-11 连红一星期就是这个）。"
            echo "- **抓行情失败**——数据源挂了或改版，卡在「抓取行情」那一步。"
            echo
            echo "修好之后这个 issue 会在下一次跑绿时自动关闭。"
          } > job-issue.md
          python3 tools/ci-notify.py \
            --title "trading-daily 运行失败——股票数据停止更新" \
            --state "$STATE" --body-file job-issue.md \
            --tg-bad "⚠️ trading-daily 跑失败了，股票分析页的数据停止更新。详情：$RUN_URL" \
            --tg-ok "✅ trading-daily 已恢复正常，股票数据重新开始更新。" || true

      # Flex 坏了要有人知道。做法与上面同一套：坏了开 issue ＋ 发 Telegram
      #（已有开着的就静默），好了自动关掉 ＋ 报恢复。这样单次抖动最多留下一个
      # 会自己关闭的 issue，而持续故障不会再像前三次那样静悄悄拖上好几天。
      - name: Flex 故障通知
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # 这次没抓（不在抓取时段）就什么都别做。少了这一段，跳过的那几次
          # 会因为 outputs.ok 是空的而被当成失败，每小时开一次 issue。
          if [ "${{ steps.needflex.outputs.yes }}" != "true" ]; then
            echo "这次没抓持仓，不做通知判断。"
            exit 0
          fi
          {
            echo "\`trading-daily\` 的 IBKR Flex 同步失败了。"
            echo
            echo "**行情与信号照常更新**，但持仓／现金／净值沿用上一次的底数——"
            echo "也就是说页面上的股数和净值会停在旧的那一版，不会自己恢复。"
            echo
            echo "IBKR 回的原文："
            echo '```'
            tail -20 flex.log 2>/dev/null || echo "(没抓到日志)"
            echo '```'
            echo
            echo "## 怎么查（顺序别乱，2026-08-12 用错的顺序误诊了三次）"
            echo
            echo "**先别信上面那个错误码。** \`gdcdyn\` 主机会把限流含糊地回成"
            echo "\`1001 Statement could not be generated\`，看起来像报表定义坏了，"
            echo "其实不是。第一件事是换一台主机拿真错误码："
            echo
            echo "1. 到 Actions 跑一次 [\`flex-doctor\`](../actions/workflows/flex-doctor.yml)"
            echo "   （workflow_dispatch，不必贴任何凭证，它自己读 Secret）。"
            echo "   它会同时问 \`gdcdyn\` 与 \`ndcdyn\` 两台，后者才会说人话。"
            echo "2. 若 \`ndcdyn\` 回 **1018 Too many requests** → 是**限流**，"
            echo "   不是我们的设定坏了。等额度回来即可，别一直重跑（重跑会烧得更快）。"
            echo "3. 只有在两台都指向报表本身有问题时，才去"
            echo "   https://www.interactivebrokers.com/sso/Login → Performance & Reports"
            echo "   → Flex Queries 检查这三个 Section 是否齐全："
            echo "   Cash Report / Net Asset Value (NAV) in Base / Open Positions。"
            echo
            echo "完整排查记录见 \`.claude/notes/trading.md\`。"
            echo "修好之后这个 issue 会在下一次同步成功时自动关闭。"
          } > flex-issue.md
          if [ "${{ steps.flex.outputs.ok }}" = "true" ]; then STATE=ok; else STATE=bad; fi
          python3 tools/ci-notify.py \
            --title "IBKR Flex 同步失败——持仓底数停止更新" \
            --state "$STATE" --body-file flex-issue.md \
            --tg-bad "⚠️ IBKR 持仓同步失败，页面上的股数与净值会停在旧的那一版（行情与信号照常更新）。" \
            --tg-ok "✅ IBKR 持仓同步已恢复，股数与净值重新开始更新。" || true
