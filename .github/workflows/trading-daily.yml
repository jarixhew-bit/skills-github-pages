name: trading-daily
# 股票交易分析器数据更新：抓行情 → 算信号 → 提交到 main（GitHub Pages 自动发布）
# 私密区加密需要仓库 Secret: ANALYZER_PW（缺失时只更新公开信号区）

on:
  schedule:
    # 仅美股交易时段内每小时跑一次：UTC 13:00-21:00（≈ 美东 9:00-17:00，覆盖开盘到收盘后缓冲）。
    # 用户 2026-07-18 要求周一至五每小时更新一次（用于 HTML 分析页），非交易时段不跑省 Actions 分钟数。
    # 同一小时内多次运行天然形成冗余，不再需要额外的次日补漏跑。
    - cron: '0 13-21 * * 1-5'
  workflow_dispatch:
    inputs:
      force_ai_note:
        description: '重新生成今天的 AI 点评（平时每天只生成一次，勾选可覆盖当天已有的）'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write   # 改走 PR 自动合并后需要（见「提交数据」步骤的注释）
  issues: write          # Flex 持续失败时开 issue 叫人（见最后一个步骤）
  statuses: write        # 自己跑完检查后给数据 commit 盖 all-green（见「提交数据」）

concurrency:
  group: trading-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet cryptography requests
      - name: 抓取行情
        run: python trading/fetch_prices.py
      # 不阻断是对的（沿用旧底数比停更好），但**不能静默**：
      # 同一个 Flex 故障 2026-07、2026-08 初、2026-08-11 复发三次，每次都是
      # 工作流全绿、持仓底数偷偷停更，等用户自己发现。所以失败要写进步骤摘要
      # 与输出，由后面的步骤决定要不要开 issue 叫人。
      # 一天只在两个时段抓，不再每小时抓（2026-08-12 改）：
      # IBKR 按 token 限流，原本 9 次/天 × 4 次重试 = 约 36 次请求，加上早报
      # 共约 40 次，远超额度 → 一直回 1001（ndcdyn 主机才明说是 1018 超标）。
      # 而**持仓一天之内根本不会变**，每小时抓是纯浪费；抓不到时 analyzer 会
      # 沿用 state.enc 里的底数，页面不受影响。
      # 留两个时段（开盘后、收盘后）是为了留一次补救机会，不是为了更即时。
      - name: 判断这次要不要抓持仓
        id: needflex
        run: |
          H=$(date -u +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$H" = "13" ] || [ "$H" = "20" ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
            echo "这次要抓持仓（UTC ${H} 时）"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
            echo "这次跳过持仓同步（UTC ${H} 时不在抓取时段），沿用既有底数"
          fi

      - name: IBKR Flex 账户同步（持仓/现金/净值，失败不阻断）
        id: flex
        if: steps.needflex.outputs.yes == 'true'
        env:
          IBKR_FLEX_TOKEN: ${{ secrets.IBKR_FLEX_TOKEN }}
          IBKR_FLEX_QUERY_ID: ${{ secrets.IBKR_FLEX_QUERY_ID }}
        run: |
          # pipefail 不可省：没有它，退出码取自 tee，Flex 崩了也会判成成功
          set -o pipefail
          if python trading/flex_account.py 2>&1 | tee flex.log; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            {
              echo "### ⚠ IBKR Flex 同步失败——持仓底数没有更新"
              echo
              echo '行情与信号照常更新，但持仓/现金/净值沿用上一次的底数。'
              echo
              echo '```'
              tail -20 flex.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
        continue-on-error: true
      - name: 运行分析管线
        env:
          ANALYZER_PW: ${{ secrets.ANALYZER_PW }}
        run: python trading/analyzer.py
      - name: 生成 AI 点评（Agnes，每天首次运行才生成，失败不阻断）
        env:
          ANALYZER_PW: ${{ secrets.ANALYZER_PW }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          # 下面两个是可选覆盖：不填就用 ai_note.py 里的默认值（与 butler-bot 一致）
          AGNES_MODEL: ${{ secrets.AGNES_MODEL }}
          AGNES_BASE_URL: ${{ secrets.AGNES_BASE_URL }}
          AI_NOTE_FORCE: ${{ inputs.force_ai_note && '1' || '' }}
        run: python trading/ai_note.py || echo "点评生成失败，沿用上次点评"
      # 2026-08-11 改成走 PR：main 加了分支保护后，「required status check
      # all-green」只在 PR 上跑，直接推 main 永远拿不到这个检查、永远被拒
      # （规则上线当天 6 次全挂，数据停更整个交易日才被发现）。绕过名单里
      # 找不到 GitHub Actions 可选，所以改由机器人开 PR 自动合并——保护规则
      # 一条都不放宽，红的东西照样进不了 main。
      # 纯数据改动只会触发「秘钥扫描」一项（ci-decide.py 的路径规则），
      # 整个 PR 从开到合并约半分钟。
      - name: 提交数据
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "trading-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trading/history trading/data-public.json trading/data-private.enc trading/state.enc
          # 提交判据：history 或 state.enc 有实质变化就提交。data-public.json/data-private.enc
          # 都含 generated_at 时间戳，每次运行必有差异，不能单独作为判据；但 state.enc
          # 不含时间戳，只要 Flex 刷新了持仓/现金/NAV 就会变——2026-07-14 曾发生 Flex
          # 拉到修正后的持仓但当天行情已抓过、history 无新增，导致修正被判据吞掉不提交
          # 注：state.enc 采用随机 salt/nonce 加密，即使底层数据完全不变，密文也会每次不同，
          # 因此改为每小时运行后，本步骤基本每次都会判定为「有变化」并提交——这是预期行为
          # （用户 2026-07-18 要求的就是 HTML 页面每小时刷新），不是 bug。
          if git diff --cached --quiet -- trading/history trading/state.enc; then
            echo "行情与持仓底数均无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(trading): hourly data update $(date -u +'%F %H:00 UTC')"
          # 运行期间 main 可能有新合并（2026-07-12 曾因此推送被拒），rebase 后再推
          git fetch origin main
          git rebase origin/main

          # 固定分支名：每小时强推同一条，不会累积一堆分支。上一轮的 PR 若还没
          # 合并完，这次强推会直接更新它，不会开出第二个。
          BRANCH="bot/trading-data"
          git push -f origin "HEAD:refs/heads/$BRANCH"

          PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR" ]; then
            gh pr create --head "$BRANCH" --base main \
              --title "chore(trading): 行情数据更新" \
              --body "由 trading-daily 自动产生：抓行情 → 算信号 → 更新 trading/ 下的数据文件。检查通过后自动合并。"
            PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          fi
          echo "PR #$PR"

          # 为什么要自己跑检查、自己盖章：GitHub 规定「用 GITHUB_TOKEN 开的 PR
          # 不会触发任何 workflow」，所以 checks.yml 永远不会在这个 PR 上跑，
          # 光等 all-green 会等到天荒地老（2026-08-12 实测：机器人开的 PR
          # check run 数为 0）。所以由本步骤实际跑一遍该跑的检查，通过才盖状态。
          #
          # 安全阀：机器人只被允许认证**纯 trading/ 数据**的改动。碰到任何其他
          # 路径就停下来不盖章——那种改动该走人工 PR、跑完整的 checks.yml。
          CHANGED=$(git diff --name-only origin/main...HEAD)
          if echo "$CHANGED" | grep -qv '^trading/'; then
            echo "::error::这次改动碰到 trading/ 以外的文件，机器人不自己盖章："
            echo "$CHANGED" | grep -v '^trading/'
            exit 1
          fi

          # ci-decide.py 对纯 trading/ 数据改动只选出「秘钥扫描」一项，
          # 其余八项与这些文件无关（2026-08-12 用它的实际规则验证过）。
          python3 tools/check-secrets.py

          SHA=$(git rev-parse HEAD)
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state=success -f context=all-green \
            -f description="行情数据更新：已实跑 check-secrets"
          gh pr merge "$PR" --squash --delete-branch

      # Flex 坏了要有人知道。做法：坏了就开 issue（已有开着的就不重复开），
      # 好了就自动关掉。这样单次抖动最多留下一个会自己关闭的 issue，
      # 而持续故障永远不会像前三次那样静悄悄地拖上好几天。
      - name: Flex 故障通知
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 这次没抓（不在抓取时段）就什么都别做。少了这一段，跳过的那 7 次
          # 会因为 outputs.ok 是空的而被当成失败，每小时开一次 issue。
          if [ "${{ steps.needflex.outputs.yes }}" != "true" ]; then
            echo "这次没抓持仓，不做通知判断。"
            exit 0
          fi

          TITLE="IBKR Flex 同步失败——持仓底数停止更新"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" \
                       --json number --jq '.[0].number // empty')

          if [ "${{ steps.flex.outputs.ok }}" = "true" ]; then
            if [ -n "$EXISTING" ]; then
              gh issue close "$EXISTING" \
                --comment "Flex 同步已恢复正常，持仓底数重新开始更新。（由 trading-daily 自动关闭）"
            fi
            exit 0
          fi

          if [ -n "$EXISTING" ]; then
            echo "已有开着的 issue #$EXISTING，不重复开。"
            exit 0
          fi
          {
            echo "\`trading-daily\` 的 IBKR Flex 同步失败了。"
            echo
            echo "**行情与信号照常更新**，但持仓／现金／净值沿用上一次的底数——"
            echo "也就是说页面上的股数和净值会停在旧的那一版，不会自己恢复。"
            echo
            echo "IBKR 回的原文："
            echo '```'
            tail -20 flex.log 2>/dev/null || echo "(没抓到日志)"
            echo '```'
            echo
            echo "## 怎么处理"
            echo
            echo "这个故障 2026-07 与 2026-08 各发生过一次，两次根因都是**IBKR 帐户里的"
            echo "Flex Query 定义残缺**，不是我们这端的问题（排查记录见 \`.claude/notes/trading.md\`）。"
            echo
            echo "先去 https://www.interactivebrokers.com/sso/Login → Performance & Reports"
            echo "→ Flex Queries，把对应的 Query 手动「运行」一次，看它报什么错。"
            echo "Query 里这三个 Section 必须都在："
            echo
            echo "- **Cash Report**：Currency / Starting Cash / Ending Cash / Ending Settled Cash"
            echo "- **Net Asset Value (NAV) in Base**：至少 Report Date + Cash + Stock + Total"
            echo "- **Open Positions**：Currency / Asset Class / Symbol / Quantity / Cost Basis Price"
            echo "  / Position Value / Open Price / Mark Price"
            echo
            echo "修好之后这个 issue 会在下一次同步成功时自动关闭。"
          } > flex-issue.md
          gh issue create --title "$TITLE" --body-file flex-issue.md
