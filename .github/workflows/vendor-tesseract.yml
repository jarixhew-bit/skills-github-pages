name: Vendor tesseract.js

# 把 tesseract.js 的全部运行时文件抓进仓库，让本地 OCR 完全走同源、不依赖任何外部网域。
# 起因：酒店/商家的白名单 WiFi 只放行少数网域，外部 CDN 一律秒拒，导致拍收据完全识别不了
# （AI 识别和本地 OCR 双双失败）。这跟 2026-07-24 opencv.js 那次是同一个坑，当时的结论是
# 「加更多外部镜像没用，问题出在『外部依赖』这个大类本身」，解法就是 vendor 进仓库。
#
# 沙盒（Claude 网页版容器）的出站代理封锁了 cdn.jsdelivr.net / tessdata.projectnaptha.com，
# 抓不到这些文件，所以搬到 CI 上跑——这是本仓库处理「沙盒连不上的公开资源」的既定做法
# （见 .claude/playbook/dispatch.md 2026-07-10 的教训）。
#
# 用法：Actions 页面手动跑一次即可，之后除非要升级 tesseract 版本，不用再跑。

on:
  workflow_dispatch:
    inputs:
      tesseract_version:
        description: "tesseract.js version (dist 文件)"
        required: true
        default: "5.1.1"
      core_version:
        description: "tesseract.js-core version (wasm 引擎)"
        required: true
        default: "5.1.1"
      langs:
        description: "语言包，空格分隔（收据用 chi_sim+eng）"
        required: true
        default: "eng chi_sim"

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download tesseract runtime + language data
        env:
          TJS: ${{ inputs.tesseract_version }}
          CORE: ${{ inputs.core_version }}
          LANGS: ${{ inputs.langs }}
        run: |
          set -euo pipefail
          mkdir -p vendor/tesseract/lang

          get () {  # get <url> <dest>
            echo "→ $2"
            curl -fsSL --retry 3 --retry-delay 2 "$1" -o "$2"
          }

          get "https://cdn.jsdelivr.net/npm/tesseract.js@${TJS}/dist/tesseract.min.js"      vendor/tesseract/tesseract.min.js
          get "https://cdn.jsdelivr.net/npm/tesseract.js@${TJS}/dist/worker.min.js"         vendor/tesseract/worker.min.js
          # 四个变体都要抓，一个都不能省：tesseract 会按「CPU 支不支持 SIMD」×「语言包是不是
          # LSTM-only」四种组合去挑对应文件。我们用的 tessdata_fast 正是 LSTM-only，实测
          # 浏览器要的是 tesseract-core-simd-lstm.wasm.js——2026-08-02 第一版只抓了前两个，
          # 浏览器实测直接 404 挂掉（importScripts failed），所以别再精简这份清单。
          for V in tesseract-core tesseract-core-simd tesseract-core-lstm tesseract-core-simd-lstm; do
            get "https://cdn.jsdelivr.net/npm/tesseract.js-core@${CORE}/${V}.wasm.js" "vendor/tesseract/${V}.wasm.js"
          done

          # 语言包用 **tessdata_fast**，不要用 tesseract.js 默认的
          # tessdata.projectnaptha.com/4.0.0——那个是完整模型，解压后 chi_sim 43MB、
          # eng 23MB，两个就 66MB：仓库撑大是其次，真正的问题是用户第一次拍收据时要在
          # 酒店 WiFi 上把这 66MB 拉下来，比原本的 bug 还难用。tessdata_fast 是整数量化版，
          # 两个语言包一共只有 6.6MB，认收据上的金额/日期完全够用。（2026-08-02 实测过
          # 完整版才改的，别为了"准一点"换回完整模型。）
          #
          # 存成**未压缩**的 .traineddata，并在页面里传 gzip:false：GitHub Pages 对 .gz
          # 可能带 Content-Encoding: gzip 送出，浏览器会先自动解压一次，tesseract 再自己
          # 解压就会失败——这个坑很难查，直接用未压缩档换掉这层不确定性。
          for L in $LANGS; do
            get "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/${L}.traineddata" \
                "vendor/tesseract/lang/${L}.traineddata"
            # 404 会拿到一个 HTML 页面，大小看起来也"正常"，这里挡掉
            if head -c 1 "vendor/tesseract/lang/${L}.traineddata" | grep -q '<'; then
              echo "::error::${L}.traineddata looks like an HTML error page, not model data"; exit 1
            fi
          done

      - name: Report sizes and guard against repo bloat
        run: |
          set -euo pipefail
          echo "=== vendored files ==="
          find vendor/tesseract -type f -printf '%10s  %p\n' | sort -k2
          total_kb=$(du -sk vendor/tesseract | cut -f1)
          echo "total: $((total_kb/1024)) MB"
          # 闸门设在 25MB：正常应该是 16MB 左右（两个 wasm 引擎各 4.6MB ＋ 语言包 6.6MB）。
          # 一超过就说明多半是又抓成完整语言模型了（那会是 70MB+），必须先看一眼再提交，
          # 因为这些文件是用户手机要下载的，不只是仓库大小问题。
          if [ "$total_kb" -gt 25600 ]; then
            echo "::error::vendored total $((total_kb/1024))MB exceeds the 25MB guard — did the language data come from the full model set instead of tessdata_fast?"
            exit 1
          fi

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vendor/tesseract
          if git diff --cached --quiet; then
            echo "nothing changed"; exit 0
          fi
          git commit -m "Vendor tesseract.js ${{ inputs.tesseract_version }} runtime + language data

          Fetched by .github/workflows/vendor-tesseract.yml so receipt OCR
          works on networks that only whitelist a few domains."
          git push
