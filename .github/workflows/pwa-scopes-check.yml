# 各个 PWA 的 manifest scope 不能互相圈住。
# 为什么要挂 CI：scope 写错不会报任何错，只有真机安装时才发现——记账本的 scope 曾经
# 是整个 /skills-github-pages/ 文件夹，把库存页和同事版都圈了进去，用户想装库存时
# 提示「已经安装过」，两个 App 只能装一个（2026-08-10）。这种沉默的错必须机器守着。
# 零 Claude 用量消耗。
name: PWA scope check

on:
  pull_request:
    paths:
      - "**/*.webmanifest"
      - "tools/check-pwa-scopes.py"
      - ".github/workflows/pwa-scopes-check.yml"
  push:
    branches: [main]
    paths:
      - "**/*.webmanifest"
      - "tools/check-pwa-scopes.py"
      - ".github/workflows/pwa-scopes-check.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检查各 PWA 的 scope 互不重叠
        run: python3 tools/check-pwa-scopes.py
