# 清理 Actions 里堆积的历史运行记录。
#
# 存在原因（2026-08-11）：Actions 页面积了 1911 条运行记录，其中很大一部分是
# 「同一份代码跑两遍」留下的成对记录——那个毛病当天已经修掉（push 只在 main 触发），
# 但历史记录不会自己消失，翻起来全是噪音。
#
# 为什么做成 workflow 而不是让 Claude 逐条删：删运行记录要 actions:write 权限，
# 沙盒里的工具没有；而 Actions 自己的 GITHUB_TOKEN 有。顺带也符合仓库既定做法——
# 检测与清理放 CI（零 Claude 用量），只有需要判断力的事才叫 Claude 上场。
#
# 平时不必管它：每周一自动跑（见下面 schedule），把两周前的旧记录清掉。
# 想立刻清或想换口径时才手动跑——用法：Actions 页面选这个 workflow → Run workflow，填两个数：
#   older_than_days  删多少天以前的（默认 30，今天的记录不会被碰；填 -1 连今天的也算）
#   max_delete       安全上限（默认 3000）。**点一次就会一直删到清干净**，撞到上限才停，
#                    停了会在日志最后写明还剩多少。
# 一次点击 = Actions 页面上一行记录，不必反复点。
#
# 安全阀——「重要的不删，只删重复和不重要的」（2026-08-11 用户定的口径）：
#   - **红过的不删**：失败/超时的记录是「什么时候开始红、当时报什么」的唯一线索
#   - **上线记录不删**：pages build and deployment 是部署历史
#   - 只删「已结束」的（in_progress / queued 不碰）、不删自己这一次
#   - dry_run 打开时只列出来、不删，先看清楚要删什么
# 剩下会被删的，就是功能分支上跑绿了的那些——尤其是同一份代码被 push 与
# pull_request 各跑一遍留下的成对记录（那个毛病当天已修，历史不会自己消失）。
#
# include_main（2026-08-11 用户追加：「除了重要的留着就行」）：
# 默认 false，也就是 main 上的记录不碰——那是合并之后的验证记录。打开之后，
# main 上**跑绿的**旧记录也一起清；红过的和部署记录任何情况下都不动，
# 所以「什么时候开始红」「什么时候上线过」这两条线索永远查得到。
#
# include_unparseable（2026-08-11 用户追问「还是跑很多重复的出来」后加的）：
# 「红过的不删」这条保护，会把**格式错误的 workflow 留下的红记录**一起保住——
# 那种记录的名字显示成文件路径（`.github/workflows/xxx.yml`）而不是 workflow 名字，
# 那正是「GitHub 解析不了这个文件」的症状。当天 branches 键写重复的那四个文件
# 一口气留下四十几条这种记录，看起来就像同一件事在重复跑（其实早就不跑了）。
# 这种红记录没有诊断价值——红的原因是文件格式错，跟代码好坏无关，而且原因已经
# 查清、修好、还加了 tools/check-workflows.py 守着。打开这个开关就把它们一并清掉。
name: Cleanup old workflow runs

on:
  # 每周一自动跑一次，把两周前的旧记录清掉（2026-08-11 用户：「这样的话很快又上千个了」）。
  # 一个任务现在稳定产生 2 行（PR 一行 Checks ＋ 合并后一行 pages 部署），不算多，
  # 但天天累积照样会回到上千条。靠人想起来去按不可靠，所以让它自己维持。
  # 排程跑的时候用的参数写死在下面 env 里（不看 inputs，因为排程事件没有 inputs）：
  #   14 天前 / 上限 3000 / main 上跑绿的也清 / 解析不了的残骸也清 / 真删。
  # **红过的和 pages 部署记录永远不动**，所以自动清不会吃掉任何诊断线索。
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      older_than_days:
        description: "删多少天以前的运行记录（填 -1 表示连今天的也一起算）"
        required: true
        default: "30"
        type: string
      max_delete:
        description: "这一次最多删几条（安全上限；没撞到就会一直删到清干净）"
        required: true
        default: "3000"
        type: string
      include_main:
        description: "连 main 上跑绿的旧记录一起删（红的和部署记录仍保留）"
        required: false
        default: false
        type: boolean
      include_unparseable:
        description: "连「解析不了的 workflow」留下的红记录一起删（名字显示成文件路径的那种）"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "只列出来、不真的删"
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: 删掉旧的运行记录
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # 排程事件没有 inputs，所以按事件类型分流写死一套参数。
          # 不能写成 `inputs.include_main || 'true'`：布尔 input 明确填 false 时，
          # `false || 'true'` 会被判成 'true'，等于使用者关不掉这个开关。
          DAYS: ${{ github.event_name == 'schedule' && '14' || inputs.older_than_days }}
          MAX: ${{ github.event_name == 'schedule' && '3000' || inputs.max_delete }}
          DRY: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
          MAIN: ${{ github.event_name == 'schedule' && 'true' || inputs.include_main }}
          UNPARSE: ${{ github.event_name == 'schedule' && 'true' || inputs.include_unparseable }}
          SELF: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # 注意：这段里不要用「… | head -n N」。head 取够就关掉管道，上游收到 SIGPIPE，
          # 配上 pipefail 会让整段当场判失败——2026-08-11 第一次真删就是这样挂的
          # （挂在列清单那一步，还没开始删，所以没删坏东西）。改用 awk 限行或 herestring。
          # 写法必须是 "$DAYS days ago"，不能写成 "-$DAYS days"：
          # DAYS=-1（想表达「连今天的也算」）在后者会拼成 "--1 days"，GNU date 不报错、
          # 直接当成 "-1 days" 算出昨天——方向刚好相反，而且静默。2026-08-11 验过。
          cutoff=$(date -u -d "${DAYS} days ago" +%Y-%m-%d)
          echo "删除 $cutoff 之前的运行记录，本次上限 $MAX 条，dry_run=$DRY"
          # 日期筛选必须交给服务端（created=<日期）：运行列表接口最多只能翻到约 1000 条，
          # 拉回来再自己筛的话，最近一千条要是都在门槛内，就会得到「没有符合条件的记录」
          # 这个假结论——2026-08-11 第一次空跑就是这样，1911 条里一条都没找到。

          # 过滤口径见文件头。两个开关各自放宽一类，默认两个都关：
          #   include_main        —— main 上跑绿的也删
          #   include_unparseable —— 「解析不了的 workflow」留下的红记录也删
          branch_cond='(.head_branch != "main")'
          if [ "$MAIN" = "true" ]; then
            branch_cond='true'
            echo "include_main 打开：main 上跑绿的旧记录这次也会一起删（红的和部署记录仍保留）"
          fi
          unparse_cond='false'
          if [ "$UNPARSE" = "true" ]; then
            # 名字显示成 .github/workflows/xxx.yml 而不是 workflow 名字 = GitHub 解析不了那个文件
            unparse_cond='(.name | startswith(".github/"))'
            echo "include_unparseable 打开：名字显示成文件路径的那批红记录这次也会一起删"
          fi
          normal="((.conclusion == \"success\" or .conclusion == \"cancelled\" or .conclusion == \"skipped\") and (.name != \"pages build and deployment\") and $branch_cond)"
          keep="select($normal or $unparse_cond)"

          # 一次按到底：删完一批就重新查一次，直到查不到为止（或撞到 max_delete 上限）。
          # 为什么要循环而不是一次捞完（2026-08-11 用户回报「一大堆重复的」后改的）：
          # 运行列表接口即使 --paginate 也只能翻到约 1000 条，一次捞不干净。原本靠使用者
          # 反复点 Run workflow 补刀，结果 Actions 页面上一件事排出五行清理记录——
          # 那正是他抱怨的「重复」。现在一次点击 = 一行记录 = 事情做完。
          deleted=0; failed=0; round=0

          while [ "$deleted" -lt "$MAX" ]; do
            round=$((round+1))
            remaining_quota=$((MAX - deleted))
            candidates=$(gh api --paginate \
              "/repos/$REPO/actions/runs?per_page=100&status=completed&created=%3C$cutoff" \
              --jq ".workflow_runs[] | select(.id != $SELF) | $keep | \"\(.id)\t\(.created_at)\t\(.head_branch)\t\(.name)\"" \
              | awk -v m="$remaining_quota" 'NR<=m')

            if [ -z "$candidates" ]; then
              if [ "$round" = "1" ]; then echo "没有符合条件的记录，收工。"; else echo "已经清干净了。"; fi
              break
            fi

            count=$(printf '%s\n' "$candidates" | wc -l)
            echo "第 $round 批：$count 条"
            head -n 10 <<< "$candidates"
            [ "$count" -gt 10 ] && echo "…（其余省略）"

            if [ "$DRY" = "true" ]; then
              echo "dry_run 打开，没有真的删（只列第一批；真跑时会一直循环到清干净）。"
              exit 0
            fi

            while IFS=$'\t' read -r id created branch name; do
              if gh api -X DELETE "/repos/$REPO/actions/runs/$id" >/dev/null 2>&1; then
                deleted=$((deleted+1))
              else
                failed=$((failed+1))
                echo "::warning::删不掉 $id（$name，$created）"
              fi
              # 慢一点，别撞 GitHub 的次级限速
              sleep 0.3
            done <<< "$candidates"
            echo "  累计删掉 $deleted 条，失败 $failed 条。"
          done

          echo "删掉 $deleted 条，失败 $failed 条（共 $round 批）。"

          remain=$(gh api --paginate \
            "/repos/$REPO/actions/runs?per_page=100&status=completed&created=%3C$cutoff" \
            --jq "[.workflow_runs[] | $keep] | length" \
            | paste -sd+ | bc)
          if [ "$remain" = "0" ]; then
            echo "清干净了，剩 0 条符合条件的记录。"
          else
            echo "还剩 $remain 条——撞到 max_delete 上限（$MAX）了，把它调大再点一次。"
          fi
