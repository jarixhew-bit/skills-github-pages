# 网页读取通道。
#
# 存在原因（2026-08-29）：Claude 网页版沙盒的出口代理挡掉绝大多数外站
# （EGRESS_BLOCKED），官方页面一律读不到，只能靠搜索引擎摘要转述。一天内两次
# 因此卡住（查樟宜 JetQuay 流程、查手册限时活动的官方档期），而手册是七个人
# 照着走的东西，「摘要说」与「官网写」的差别就是行程写错与写对的差别。
# 按 CLAUDE.md「沙盒连不上的外部服务，先想 CI 通道」——runner 出得去，搬到这里。
#
# 用法：Actions 页面 Run workflow，填网址（多个用 | 分隔）与关键字；
# 或由 Claude 调 API 触发。结果印在 job 日志里，Claude 用 get_job_logs 读回，
# 不落档、不 commit（跟 play-lookup.yml 同一个路子）。
name: 读网页

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "要读的网址，多个用 | 分隔"
        required: true
        type: string
      keywords:
        description: "只印含这些关键字的行（逗号分隔）；留空=印正文前 3000 字"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 读取
        # 输入一律走 env，不要直接插进 run: 的文字里——网址与关键字含引号或
        # 反引号时会把 shell 命令拆坏（checks.yml 的 all-green 踩过同类坑）
        env:
          URLS: ${{ inputs.urls }}
          KEYWORDS: ${{ inputs.keywords }}
        run: python3 tools/web-lookup.py "$URLS" "$KEYWORDS"
