# 库存分页的自检（真浏览器）。
# 2026-08-10 起库存不再是独立页，而是记账 App（expense-tracker.html）的第五个分页，
# 同事版 staff/index.html 也有一份——所以这里盯的是那两个文件，不是 inventory/。
# 这块管的是老板的酒/茶叶/虫草实物库存——数字点错一下就跟实际瓶数对不上，
# 而且「点两下 + 只能加一次」这类窗口期 bug 光看代码看不出来（2026-08-08 在记账 App
# 上踩过：写法错了自测照样通过），所以每次改到这页都用真浏览器实跑一遍。
# 测试全程把 worker 请求拦下来假造返回，不打真实接口、不碰真实库存数据。
name: inventory page check

on:
  push:
    paths:
      - 'expense-tracker.html'
      - 'staff/index.html'
      - 'inventory/**'
      - 'tools/check-inventory.mjs'
      - 'tools/build-staff-page.py'
      - '.github/workflows/inventory-check.yml'
  pull_request:
    paths:
      - 'expense-tracker.html'
      - 'staff/index.html'
      - 'inventory/**'
      - 'tools/check-inventory.mjs'
      - 'tools/build-staff-page.py'
  workflow_dispatch:

# 同一个分支上 push 与 pull_request 会各触发一次，这个检查要装 Chromium（约 1 分钟），
# 跑两遍纯属浪费。新的一跑就取消同组里还没跑完的旧的。
concurrency:
  group: inventory-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Chromium 有 150MB 左右，每个 job 每次都重下要 30 秒上下（2026-08-11 量过：
      # 同事版那个 job 整段「装 playwright」34 秒）。缓存住之后只有 playwright 版本
      # 变了才会重下——所以 key 跟着 package.json 走。
      - name: 缓存 Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}
      - name: 装 playwright
        run: |
          npm install
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            # 浏览器本体已经从缓存拿回来了，只要补系统依赖（这一步很快）
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
      - name: 起本地服务器
        run: |
          # 输出必须重定向、还要 disown：后台进程只要还占着这个步骤的 stdout，
          # Actions 就会一直等它、整个步骤挂住不结束（见 expense-company-check.yml 里
          # 2026-08-03 那次卡 20 分钟的记录）。
          nohup python3 -m http.server 8899 > /tmp/httpserver.log 2>&1 &
          disown || true
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://localhost:8899/expense-tracker.html && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:8899/expense-tracker.html \
            || { echo "本地服务器没起来"; cat /tmp/httpserver.log; exit 1; }
      - name: 跑库存分页自检
        run: node tools/check-inventory.mjs
