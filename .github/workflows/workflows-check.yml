# workflow 文件本身的把关。
#
# 建立原因（2026-08-11）：改 workflow 时用 PyYAML 验「语法 OK」，四个文件里
# `branches: [main]` 写了两遍——PyYAML 对重复键静默接受，本地全绿；GitHub 却直接判
# 「Invalid workflow file」，于是每次推 main 都无声地红四条，是用户在 Actions 页面
# 看到「一次出现 4 条」才发现的。光用 PyYAML 验 workflow，等于没验。
#
# 这个检查零依赖、几秒钟跑完，盯的是 PyYAML 不管的那几件事（重复键、缺 on/jobs、
# pull_request 路径没包含自己、composite action 的 run 少写 shell）。
name: Workflows Check

on:
  pull_request:
    paths:
      - '.github/workflows/workflows-check.yml'   # 明示包含自己（规则要求，通配虽然也涵盖）
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'tools/check-workflows.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'tools/check-workflows.py'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检查 workflow 文件
        run: python3 tools/check-workflows.py
