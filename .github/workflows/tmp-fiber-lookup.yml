# 临时：查食物库膳食纤维（同一 FDC ID／台湾编号）＋饮食模块的几个原文出处。查完删掉，不进 main。
name: tmp fiber lookup
on:
  push:
    branches: [claude/inspiring-lamport-0jimcp]
    paths: [.github/workflows/tmp-fiber-lookup.yml]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: lookup
        continue-on-error: true
        env:
          IDS: '{"usda":["171477","172388","172376","172392","172411","168250","168240","167812","167903","169442","169441","168611","171793","174032","172487","172509","175180","175179","174223","175168","175177","171956","173699","171963","173674","175166","171995","173683","173709","174205","172186","173424","171287","172183","172475","172476","172449","172451","172446","175215","168411","172421","173757","174257","175194","168878","168932","169704","169711","168877","168914","169742","168919","169737","168910","168907","174924","172688","173904","171675","169999","170440","170093","168486","168449","168484","168483","169702","170149","169302","169301","169967","169392","170391","169980","169975","168463","168409","170457","170427","170393","169251","168437","169382","168580","169229","169223","169141","168394","169261","169233","169957","170000","169247","170397","168430","169988","168457","173944","169910","169926","167765","171688","169097","173044","169124","168192","169089","169086","174687","174683","168153","171705","169118","167762","170187","170567","173806","170162","170150","170554","169414","170556","170562","171265","170872","171269","171284","170894","171304","173414","170847","171413","171410","172336","171016","171412","173410","174277","174529","174531","169655","168833","169640","170172","167677","167676","167678"],"fndds":["2708953","2708954","2708956","2708951","2709145"],"tw":["R4700203","R2400201","B0100101","C1800101","G2100101","A1000101","E3201001"]}'
        run: |
          set -e
          mkdir -p d && cd d
          curl -sSL -o sr.zip https://fdc.nal.usda.gov/fdc-datasets/FoodData_Central_sr_legacy_food_csv_2018-04.zip
          curl -sSL -o sv.zip https://fdc.nal.usda.gov/fdc-datasets/FoodData_Central_survey_food_csv_2024-10-31.zip
          curl -sSL -o tw.zip 'https://data.fda.gov.tw/opendata/exportDataList.do?method=ExportData&InfoId=20&logType=3'
          mkdir sr sv tw; unzip -q -o sr.zip -d sr; unzip -q -o sv.zip -d sv; unzip -q -o tw.zip -d tw
          python3 - <<'PY'
          import csv, glob, json, os, re
          ids = json.loads(os.environ["IDS"])
          def find(root, name):
              return [p for p in glob.glob(root + "/**/" + name, recursive=True)][0]
          for tag, root, want in (("SR", "sr", ids["usda"]), ("FNDDS", "sv", ids["fndds"])):
              nut = {}
              for r in csv.DictReader(open(find(root, "nutrient.csv"), encoding="utf-8")):
                  nut[r["id"]] = (r["name"], r.get("nutrient_nbr", ""))
              fib_ids = [k for k, v in nut.items() if v[0].startswith("Fiber, total dietary")]
              print("==", tag, "fiber nutrient ids", [(k, nut[k]) for k in fib_ids])
              keep = {"1008","1003","1005","1004","208","203","205","204","291"} | set(fib_ids)
              vals = {}
              for r in csv.DictReader(open(find(root, "food_nutrient.csv"), encoding="utf-8")):
                  if r["fdc_id"] in want and r["nutrient_id"] in keep:
                      vals.setdefault(r["fdc_id"], {})[nut.get(r["nutrient_id"], (r["nutrient_id"],))[0][:12]] = r["amount"]
              desc = {}
              for r in csv.DictReader(open(find(root, "food.csv"), encoding="utf-8")):
                  if r["fdc_id"] in want: desc[r["fdc_id"]] = r["description"]
              for i in want:
                  print("FIB", tag, i, json.dumps(vals.get(i, {}), ensure_ascii=False), "|", desc.get(i, "?"))
          js = glob.glob("tw/**/*.json", recursive=True)
          print("TW files", js)
          data = json.load(open(js[0], encoding="utf-8"))
          print("TW head", json.dumps(data[:2], ensure_ascii=False)[:1500])
          if isinstance(data, dict): data = next(v for v in data.values() if isinstance(v, list))
          for row in data:
              s = json.dumps(row, ensure_ascii=False)
              if any(c in s for c in ids["tw"]) and re.search("纖維|熱量|蛋白|脂肪|碳水", s):
                  print("TWROW", s)
          PY
      - name: pages
        run: |
          python3 - <<'PY'
          import html, re, urllib.request
          urls = [
            "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&id=2305711,33741447&rettype=abstract&retmode=text",
            "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi?db=pubmed&term=Whittaker+J%5Bau%5D+AND+Wu+K%5Bau%5D+AND+testosterone&retmode=json",
            "https://www.nhs.uk/live-well/eat-well/digestive-health/how-to-get-more-fibre-into-your-diet/",
            "https://www.nhs.uk/conditions/nocturia/",
            "https://www.nhs.uk/symptoms/peeing-at-night/",
            "https://www.nhs.uk/conditions/urinating-at-night/",
            "https://www.nhsinform.scot/illnesses-and-conditions/kidneys-bladder-and-prostate/nocturia/",
            "https://www.nhs.uk/symptoms/bloating/",
            "https://www.nhs.uk/conditions/constipation/",
            "https://www.nhs.uk/conditions/diarrhoea-and-vomiting/",
            "https://www.nhs.uk/conditions/bowel-cancer/symptoms/",
            "https://www.nhs.uk/conditions/benign-prostate-enlargement/",
            "https://www.fao.org/4/y5686e/y5686e07.htm",
            "https://www.fao.org/4/y5686e/y5686e00.htm",
          ]
          for u in urls:
              print("\n######## URL", u)
              try:
                  req = urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36"})
                  raw = urllib.request.urlopen(req, timeout=40).read().decode("utf-8", "replace")
              except Exception as e:
                  print("ERR", e); continue
              t = re.sub(r"(?is)<(script|style|noscript).*?</\1>", " ", raw)
              t = re.sub(r"(?s)<[^>]+>", "\n", t); t = html.unescape(t)
              lines = [re.sub(r"\s+", " ", x).strip() for x in t.split("\n")]
              lines = [x for x in lines if x]
              out = "\n".join(lines)
              print(out[:14000])
          PY
