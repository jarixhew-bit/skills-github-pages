# 制度档月度体检：每月 1 号跑 tools/check-rules.py，检查 .claude/playbook/ 等制度档
# 有没有超过 maintenance.md 第 4 节的精简门槛（教训满 10 条 / 单档超行数上限 /
# 路由引用失效）。
#
# 为什么放 CI 而不是 Claude 定时任务（2026-08-01 用户提出后改的）：
# 绝大多数月份的结论是「没超标」，为此每月开一个新 Claude session（要载入
# CLAUDE.md ＋全部规则档＋工具定义）不划算。检测不需要判断力，放 CI 零消耗；
# 真正需要判断力的「精简」才叫 Claude 上场——超标时开 issue 通知用户即可。
name: Rules Health Check

on:
  # PR 那一路已经并进 checks.yml（2026-08-11 合并 workflow 时搬走），
  # 这里只留定时体检：超标开 issue 通知，不必每次改动都跑。
  schedule:
    # 每月 1 号 UTC 01:00（柬埔寨 UTC+7 早上 08:00 前后）。
    # 每月一次，GitHub 的排队延迟不影响用途。
    - cron: '0 1 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 跑制度档体检
        id: check
        run: |
          if python3 tools/check-rules.py --quiet > result.txt 2>&1; then
            echo "over=false" >> "$GITHUB_OUTPUT"
            echo "所有制度档都在门槛内，无需精简。"
          else
            echo "over=true" >> "$GITHUB_OUTPUT"
            cat result.txt
            # PR 上直接红，改档的人当场就看到；定时那一路不红，改开 issue 通知。
            if [ "${{ github.event_name }}" = "pull_request" ]; then exit 1; fi
          fi

      # 状态交给 tools/ci-notify.py：超标→没开过就开、开着就补评论；回到门槛内→自动关掉旧 issue 并留言「已恢复」。
      # （2026-11-12 之前只开不关，而且「已有就 exit 0」——旧 issue 不关，下一次超标就不会再通知。）
      - name: 超标开 issue／补评论，回到门槛内自动关
        if: github.event_name != 'pull_request' && steps.check.outputs.over != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OVER: ${{ steps.check.outputs.over }}
        run: |
          if [ "$OVER" = "true" ]; then STATE=bad; else STATE=ok; fi
          {
            echo "月度体检发现制度档超过 \`.claude/playbook/maintenance.md\` 第 4 节的精简门槛："
            echo
            echo '```'
            cat result.txt
            echo '```'
            echo
            echo "## 怎么处理"
            echo
            echo "跟 Claude 说一句「处理一下制度档精简」即可。它会按 maintenance.md"
            echo "第 4 节的六种判定（追加／修正／新增章节／新建档案／已覆盖／太具体）"
            echo "逐条精简，并走 PR 流程。"
            echo
            echo "注意：改铁律门槛数字、删整节、把教训上升为正文规则这三类改动，"
            echo "按 maintenance.md 第 2 节必须先经你同意，Claude 不会自己动手。"
            echo
            echo "自己看当前状况：\`python3 tools/check-rules.py\`"
          } > body.md
          python3 tools/ci-notify.py --title "制度档该精简了（月度体检）" \
            --state "$STATE" --body-file body.md --comment-existing \
            --tg-bad "制度档超过精简门槛（月度体检），详情见 GitHub issue。" \
            --tg-ok "制度档已回到门槛内（月度体检通过）。" || true
